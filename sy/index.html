(function () {

        dir: 'down', anim: rng.range(0, 4), moving: false,
        seed: rng.int(0, 9999), speed: NPC.speed * rng.range(0.7, 1.25),
        targetX: x, targetY: y, wait: rng.range(0, 2.5),
        id: `${cx}:${cy}:${idx}:${kind}`,
      };
    }

    // 눈에 보이는 것들만 훑는다
    *visible(cx0, cy0, cx1, cy1) {
      for (let cy = cy0; cy <= cy1; cy++) {
        for (let cx = cx0; cx <= cx1; cx++) {
          const list = this.chunks.get(cx * 100000 + cy);
          if (list) for (const a of list) yield a;
        }
      }
    }

    update(dt, cx0, cy0, cx1, cy1) {
      for (const a of this.visible(cx0, cy0, cx1, cy1)) {
        if (a.kind === 'prop') continue;
        a.anim += dt;
        if (a.wait > 0) { a.wait -= dt; a.moving = false; continue; }

        const dx = a.targetX - a.x, dy = a.targetY - a.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 2) {
          // 새 목적지 — 태어난 자리 근처로만
          const rng = makeRng(SEED, 'wander', a.id, Math.floor(a.anim));
          const r = NPC.wanderRadius * (a.kind === 'cat' ? 0.5 : 1);
          a.targetX = a.homeX + rng.range(-r, r);
          a.targetY = a.homeY + rng.range(-r, r);
          a.wait = rng.range(0.4, a.kind === 'cat' ? 4 : 2);
          a.moving = false;
          continue;
        }

        const speed = a.speed * (a.kind === 'cat' ? 0.55 : 1);
        const nx = a.x + (dx / dist) * speed * dt;
        const ny = a.y + (dy / dist) * speed * dt;

        a.x = nx; a.y = ny; a.moving = true;

    nearestPerson(x, y, radius) {
      let best = null, bestD = radius;
      for (const list of this.chunks.values()) {
        for (const a of list) {
          if (a.kind !== 'npc') continue;
          const d = Math.hypot(a.x - x, a.y - y);
          if (d < bestD) { bestD = d; best = a; }
        }
      }
      return best;
    }

    nearestEvent(x, y, radius) {
      let best = null, bestD = radius;
      for (const [key, e] of this.events) {
        const d = Math.hypot(e.x - x, e.y - y);
        if (d < bestD) { bestD = d; best = { key, ...e }; }

      return best;
    }

    // 플레이어 근처의 고양이 (쓰다듬기용)
    nearestCat(x, y, radius) {
      let best = null, bestD = radius;
      for (const list of this.chunks.values()) {
        for (const a of list) {
          if (a.kind !== 'cat') continue;
          const d = Math.hypot(a.x - x, a.y - y);
          if (d < bestD) { bestD = d; best = a; }
        }
      }
      return best;
    }

// ── world/traffic.js ─────────────────────────────
(function () {
  // 도로 위의 차. 이름 있는 도로를 차선 삼아 차들이 오간다.
  // 사람이 차도에 서 있으면 앞차가 선다 — 밟고 지나가지는 않는다.

  const { SEED, TILE, TRAFFIC } = __M;
  const { makeRng } = __M;
  const { projectPath } = __M;
  const { ROADS } = __M;
  const { ROAD_CLASS } = __M;

  const S = TILE.size;

  // 화면(+여유) 안에 있는가
  function inView(car, view) {
    if (!view) return true;
    return car.x >= view.left && car.x <= view.right &&
      car.y >= view.top && car.y <= view.bottom;
  }

  // 도로 하나를 방향별 차선 두 개로 만든다
  function makeLanes(road) {
    const spec = ROAD_CLASS[road.cls];
    if (!TRAFFIC.classes.includes(road.cls)) return [];
    const pts = projectPath(road.path);
    // 누적 길이
    let total = 0;
    const nodes = pts.map((p, i) => {
      if (i > 0) total += Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]);
      return { x: p[0], y: p[1], dist: total };
    });
    if (total < 20) return [];

    const offset = spec.width / 4;   // 중앙선에서 차선 중앙까지
    return [1, -1].map((sign) => ({
      road: road.name, nodes, length: total, sign, offset: offset * sign,
      speed: TRAFFIC.speed[road.cls] || 40,
    }));
  }

  class Traffic {
    constructor(map) {
      this.map = map;
      this.lanes = [];
      for (const road of ROADS) this.lanes.push(...makeLanes(road));

      const rng = makeRng(SEED, 'traffic');
      this.cars = [];
      for (let i = 0; i < this.lanes.length; i++) {
        const lane = this.lanes[i];
        const count = Math.max(1, Math.round(lane.length / TRAFFIC.spacing));
        for (let c = 0; c < count; c++) {
          this.cars.push({
            lane: i,
            dist: (lane.length * (c + rng.range(0, 0.8))) / count,
            speed: lane.speed * rng.range(0.85, 1.15),
            color: rng.int(0, TRAFFIC.colors - 1),
            kind: rng.chance(0.16) ? 'truck' : rng.chance(0.1) ? 'bus' : 'car',
            x: 0, y: 0, angle: 0, stopped: false,
          });
        }
      }
      this.place();
    }

    // 차선 위 거리(dist)로부터 실제 위치와 방향을 구한다
    locate(lane, dist) {
      const nodes = lane.nodes;
      const d = ((dist % lane.length) + lane.length) % lane.length;
      let i = 1;
      while (i < nodes.length - 1 && nodes[i].dist < d) i++;
      const a = nodes[i - 1], b = nodes[i];
      const segLen = b.dist - a.dist || 1;
      const t = (d - a.dist) / segLen;
      const dx = (b.x - a.x) / segLen, dy = (b.y - a.y) / segLen;
      // 진행 방향과 직각으로 차선만큼 비켜 선다
      const nx = -dy, ny = dx;
      return {
        x: (a.x + (b.x - a.x) * t + nx * lane.offset) * S,
        y: (a.y + (b.y - a.y) * t + ny * lane.offset) * S,
        angle: Math.atan2(dy * lane.sign, dx * lane.sign),
      };
    }

    place() {
      for (const car of this.cars) {
        const lane = this.lanes[car.lane];
        const p = this.locate(lane, car.dist);
        car.x = p.x; car.y = p.y; car.angle = p.angle;
      }
    }

    // view 는 화면 범위(월드 픽셀). 그 밖의 차는 위치만 굴리고 검사는 건너뛴다 —
    // 안 그러면 차 천 대가 매 프레임 온 지도의 청크를 만들어 낸다.
    update(dt, player, view) {
      for (const car of this.cars) {
        const lane = this.lanes[car.lane];
        // 앞에 사람이 있으면 선다
        if (!inView(car, view)) {   // 화면 밖 차는 그냥 굴러간다
          car.dist += car.speed * dt * lane.sign;
          const far = this.locate(lane, car.dist);
          car.x = far.x; car.y = far.y; car.angle = far.angle;
          continue;
        }
        const ahead = TRAFFIC.stopDistance;
        const dx = player.x - car.x, dy = player.y - car.y;
        const forwardX = Math.cos(car.angle), forwardY = Math.sin(car.angle);
        const along = dx * forwardX + dy * forwardY;
        const side = Math.abs(dx * -forwardY + dy * forwardX);
        car.stopped = along > 0 && along < ahead && side < TRAFFIC.stopWidth;
        if (car.stopped) continue;

        car.dist += car.speed * dt * lane.sign;
        const p = this.locate(lane, car.dist);
        car.x = p.x; car.y = p.y; car.angle = p.angle;
        // 길이 건물을 스쳐 지나가는 구간에서는 차를 감춘다 (건물을 뚫고 가는 것처럼 보이지 않게).
        // 화면 근처, 그것도 이미 만들어 둔 청크에서만 확인한다.
        if (this.map && inView(car, view)) {
          const tx = Math.floor(car.x / S), ty = Math.floor(car.y / S);
          car.hidden = this.map.hasChunk(tx, ty) && this.map.isSolid(tx, ty);
        }
      }
    }

    // 화면 안의 차만 넘겨준다
    *visible(left, top, right, bottom) {
      for (const car of this.cars) {
        if (car.x < left || car.x > right || car.y < top || car.y > bottom) continue;
        yield car;
      }
    }
  }

  __M.Traffic = Traffic;
})();

// ── render/sprites.js ─────────────────────────────

    return Math.min(BUILDING.wallHeightMax, 8 + b.floors * BUILDING.wallHeightPerFloor);
  }

  // 건물 한 채의 생김새를 시드에서 뽑는다.
  // 같은 종류라도 채마다 파사드·차양·옥상 구조물이 달라진다.
  function pickStyle(b, rng) {
    const tall = b.floors >= 8;
    const wide = b.w >= 10;
    return {
      facade: rng.pick(tall ? ['glass', 'glass', 'grid'] : ['grid', 'tile', 'glass']),
      awning: (b.kind === KIND.SHOP || b.kind === KIND.MART) && rng.chance(0.55),
      awningColor: rng.pick(SIGN_COLORS),
      signs: b.kind === KIND.SHOP ? rng.int(1, 3) : 1,
      pillar: b.kind === KIND.SHOP && b.floors >= 4 && rng.chance(0.4),   // 옥상 광고탑
      tank: rng.chance(tall ? 0.7 : 0.35),                                // 물탱크
      solar: rng.chance(b.kind === KIND.HOUSE ? 0.35 : 0.2),              // 태양광
      penthouse: tall && rng.chance(0.5),                                 // 옥탑방
      units: rng.chance(0.5),                                             // 실외기 줄
      roofShape: rng.pick(['gable', 'flat', 'hip']),                      // 주택 지붕
      chimney: b.kind === KIND.FACTORY && rng.chance(0.5),
      docks: (b.kind === KIND.WAREHOUSE || b.kind === KIND.FACTORY) && wide,
      piloti: b.kind === KIND.APARTMENT && rng.chance(0.45),              // 1층 필로티
      ridge: rng.chance(0.5),                                             // 공장 지붕 골 방향
    };
  }

  // 건물 한 채를 통째로 그린 캔버스. 아래 끝이 건물 남쪽 벽에 맞는다.
  function buildingSprite(b) {
    const wh = wallHeight(b);
    const key = `${b.kind}|${b.w}|${b.h}|${b.floors}|${b.seed}|${b.door.dir}`;
    let hit = buildingCache.get(key);
    if (hit) return hit;

    const pw = b.w * S, ph = b.h * S + wh;
    const { canvas, ctx } = makeCanvas(pw, ph);
    let col = BUILDING_COLOR[b.kind] || BUILDING_COLOR[KIND.SHOP];
    // 비닐하우스는 흰 비닐이 씌워져 있다
    if (b.name && b.name.includes('비닐하우스')) {
      col = { wall: '#e8eeea', roof: '#dfe6e2', trim: '#b8c4bc', accent: '#cfe0d8' };
    }
    const rng = makeRng(SEED, 'sprite', b.seed, b.kind);
    const style = pickStyle(b, rng);
    // 같은 종류라도 채마다 색을 꽤 다르게 흔든다
    const wall = shade(col.wall, rng.range(-0.10, 0.10));
    const roof = shade(col.roof, rng.range(-0.12, 0.12));
    const trim = col.trim;
    const roofH = b.h * S;

    // 옥상
    px(ctx, 0, 0, pw, roofH, roof);
    px(ctx, 0, 0, pw, 1, shade(roof, 0.18));
    px(ctx, 0, roofH - 1, pw, 1, shade(roof, -0.2));
    drawRoofDetail(ctx, b, pw, roofH, roof, trim, col, rng, style);

    // 앞벽
    px(ctx, 0, roofH, pw, wh, wall);
    px(ctx, 0, roofH, pw, 1, shade(wall, 0.2));
    px(ctx, 0, ph - 2, pw, 2, shade(wall, -0.28));
    px(ctx, 0, roofH, 1, wh, shade(wall, -0.12));
    px(ctx, pw - 1, roofH, 1, wh, shade(wall, -0.12));

    drawWindows(ctx, b, pw, roofH, wh, wall, col, rng, style);
    drawFrontDoor(ctx, b, pw, roofH, wh, col, rng, style);

    hit = canvas;
    buildingCache.set(key, hit);
    buildingOrder.push(key);
    if (buildingOrder.length > BUILDING_CACHE_MAX) {
      buildingCache.delete(buildingOrder.shift());
    }
    return hit;
  }

  function drawRoofDetail(ctx, b, pw, roofH, roof, trim, col, rng, style) {
    const dark = shade(roof, -0.16), light = shade(roof, 0.12);
    switch (b.kind) {
      case KIND.APARTMENT: case KIND.TOWER: {
        // 옥상 난간
        px(ctx, 1, 1, pw - 2, 2, light);
        px(ctx, 1, roofH - 3, pw - 2, 2, dark);
        px(ctx, 1, 1, 2, roofH - 3, shade(roof, 0.06));
        px(ctx, pw - 3, 1, 2, roofH - 3, shade(roof, -0.06));
        // 계단탑과 엘리베이터 기계실 — 세대 라인마다 하나씩 올라온다
        const towerStep = 42;
        for (let x = 8; x < pw - 16; x += towerStep) {
          const ty = Math.floor(roofH * 0.34);
          px(ctx, x, ty, 13, 10, shade(roof, -0.26));
          px(ctx, x + 1, ty + 1, 11, 3, light);
          px(ctx, x + 3, ty + 10, 7, 2, shade(roof, -0.34));
        }
        // 물탱크
        if (pw > 60) {
          const wx = pw - 22;
          px(ctx, wx, 6, 14, 9, shade(roof, -0.2));
          px(ctx, wx + 1, 7, 12, 3, light);
        }
        break;
      }
      case KIND.HOUSE: case KIND.FARMHOUSE: {
        if (style.roofShape === 'flat') {
          // 평지붕 — 옥상에 물탱크와 장독대, 가끔 태양광
          px(ctx, 1, 1, pw - 2, roofH - 3, shade(roof, -0.06));
          px(ctx, 1, 1, pw - 2, 1, light);
          if (style.tank) { px(ctx, 4, 4, 7, 6, dark); px(ctx, 5, 5, 5, 2, light); }
          if (style.solar) {
            for (let x = pw - 16; x < pw - 4 && x > 2; x += 6) px(ctx, x, 5, 5, 8, '#3f5f8a');
          }
          for (let i = 0; i < 3; i++) px(ctx, pw - 10 + i * 3, roofH - 9, 2, 3, '#7a5a3a');
        } else if (style.roofShape === 'hip') {
          // 모임지붕 — 네 방향으로 흐른다
          px(ctx, 0, 0, pw, roofH, shade(roof, 0.06));
          for (let i = 0; i < Math.min(pw, roofH) / 2; i++) {
            px(ctx, i, i, pw - i * 2, 1, shade(roof, 0.02 - i * 0.02));
          }
          px(ctx, 0, roofH - 2, pw, 2, dark);
        } else {
          // 박공지붕 — 가운데 용마루
          const mid = Math.floor(roofH / 2);
          px(ctx, 0, 0, pw, mid, shade(roof, 0.1));
          px(ctx, 0, mid, pw, roofH - mid, dark);
          px(ctx, 0, mid - 1, pw, 2, shade(roof, -0.35));
          for (let x = 2; x < pw - 2; x += 5) px(ctx, x, 1, 1, roofH - 2, shade(roof, -0.06));
        }
        break;
      }
      case KIND.FACTORY: case KIND.WAREHOUSE: {
        // 샌드위치 패널 골. 방향은 건물마다 다르다.
        if (style.ridge) {
          for (let x = 2; x < pw - 3; x += 9) {
            px(ctx, x, 2, 5, roofH - 5, dark);
            px(ctx, x, 2, 5, 2, shade(roof, 0.18));
          }
        } else {
          for (let y = 2; y < roofH - 3; y += 9) {
            px(ctx, 2, y, pw - 4, 5, dark);
            px(ctx, 2, y, pw - 4, 2, shade(roof, 0.18));
          }
        }
        // 지붕 환기구 줄
        for (let x = 6; x < pw - 8; x += 16) px(ctx, x, Math.floor(roofH / 2) - 2, 6, 4, '#c8ccd0');
        // 굴뚝
        if (style.chimney) {
          const cx2 = pw - 14;
          px(ctx, cx2, 3, 6, 16, '#b8bec4');
          px(ctx, cx2, 3, 6, 3, '#e2554a');
          px(ctx, cx2 + 1, 6, 4, 2, '#8f979e');
        }
        break;
      }
      case KIND.SCHOOL: case KIND.PUBLIC: case KIND.HOSPITAL: {
        px(ctx, 2, 2, pw - 4, roofH - 5, shade(roof, -0.08));
        px(ctx, 4, 4, pw - 8, 1, light);
        if (b.kind === KIND.HOSPITAL) { // 옥상 적십자
          const cx = Math.floor(pw / 2), cy = Math.floor(roofH / 2);
          px(ctx, cx - 2, cy - 6, 5, 13, col.accent);
          px(ctx, cx - 6, cy - 2, 13, 5, col.accent);
        }
        break;
      }
      case KIND.CHURCH: {
        const cx = Math.floor(pw / 2), cy = Math.floor(roofH / 2);
        px(ctx, cx - 1, cy - 8, 3, 16, col.accent);
        px(ctx, cx - 5, cy - 4, 11, 3, col.accent);
        break;
      }
      case KIND.STATION: {
        // 유리 캐노피
        for (let x = 2; x < pw - 2; x += 6) px(ctx, x, 2, 4, roofH - 5, shade(roof, 0.16));
        px(ctx, 0, roofH - 4, pw, 2, col.accent);
        break;
      }
      case KIND.MART: {
        px(ctx, 3, 3, pw - 6, roofH - 7, shade(roof, -0.1));
        for (let x = 6; x < pw - 6; x += 12) px(ctx, x, 6, 8, 6, dark); // 실외기
        break;
      }
      default: {
        // 상가 옥상 — 난간, 실외기 줄, 물탱크, 옥탑방, 광고탑
        px(ctx, 1, 1, pw - 2, roofH - 3, shade(roof, -0.05));
        px(ctx, 1, 1, pw - 2, 1, light);
        px(ctx, 1, roofH - 3, pw - 2, 1, dark);
        // 실외기 — 상가 옥상은 이것들로 빼곡하다
        const acRows = Math.max(1, Math.floor(roofH / 26));
        for (let r = 0; r < acRows; r++) {
          const ay = 5 + r * 14;
          if (ay + 6 > roofH - 6) break;
          for (let x = 4; x < pw - 8; x += 10) {
            if (!rng.chance(style.units ? 0.85 : 0.45)) continue;
            px(ctx, x, ay, 7, 6, shade(roof, -0.24));
            px(ctx, x + 1, ay + 1, 5, 3, shade(roof, 0.12));
            px(ctx, x + 1, ay + 5, 5, 1, shade(roof, -0.34));
          }
        }
        // 배관과 난간 그림자
        const pipeY = Math.floor(roofH * 0.72);
        px(ctx, 3, pipeY, pw - 6, 1, shade(roof, -0.2));
        if (rng.chance(0.5)) px(ctx, Math.floor(pw / 3), 3, 1, roofH - 8, shade(roof, -0.16));
        if (roofH > 24) {
          px(ctx, pw - 14, roofH - 14, 9, 8, dark);        // 옥상 출입문
          px(ctx, pw - 12, roofH - 12, 5, 5, shade(roof, 0.2));
        }
        if (style.tank && roofH > 18) {
          px(ctx, 4, roofH - 13, 8, 7, shade(roof, -0.28)); // 물탱크
          px(ctx, 5, roofH - 12, 6, 2, light);
        }
        if (style.penthouse && roofH > 26) {
          px(ctx, Math.floor(pw / 2) - 7, 5, 15, 11, shade(roof, -0.18));
          px(ctx, Math.floor(pw / 2) - 5, 7, 11, 4, shade(col.accent, 0.2));
        }
        if (style.pillar) {
          // 옥상 광고탑 — 간판 기둥이 하늘로 솟아 있다
          const sx = Math.floor(pw * 0.25);
          px(ctx, sx, 2, 3, roofH - 6, '#8f959c');
          px(ctx, sx - 5, 1, 13, 7, rng.pick(SIGN_COLORS));
          px(ctx, sx - 3, 3, 9, 1, '#fffdf2');
        }
      }
    }
  }

  function drawWindows(ctx, b, pw, roofH, wh, wall, col, rng, style) {
    if (b.kind === KIND.APARTMENT) {
      return drawApartmentFace(ctx, b, pw, roofH, wh, wall, col, rng, style);
    }
    if (b.kind === KIND.FARMHOUSE && b.w < 6) return;
    const glass = shade(col.accent, rng.range(-0.05, 0.1));

    // 창고·공장 앞면은 하역 도크 셔터가 늘어선다
    if (b.kind === KIND.WAREHOUSE || b.kind === KIND.FACTORY) {
      const y = roofH + Math.max(2, wh - 14);
      if (style.docks) {
        for (let x = 4; x < pw - 12; x += 18) {
          px(ctx, x, y, 13, Math.min(12, wh - 3), shade(wall, -0.22));
          for (let i = 1; i < 5; i++) px(ctx, x, y + i * 3, 13, 1, shade(wall, -0.32));
        }
      } else {
        for (let x = 4; x < pw - 8; x += 14) px(ctx, x, y + 2, 9, 5, glass);
      }
      return;
    }

    if (style.facade === 'glass') {
      // 커튼월 — 층마다 통유리 띠
      for (let r = 0; ; r++) {
        const y = roofH + 3 + r * 8;
        if (y + 6 > roofH + wh - 4) break;
        px(ctx, 2, y, pw - 4, 5, glass);
        px(ctx, 2, y, pw - 4, 1, shade(glass, 0.28));
        for (let x = 4; x < pw - 4; x += 7) px(ctx, x, y, 1, 5, shade(wall, -0.1));
      }
    } else if (style.facade === 'tile') {
      // 타일 벽 — 작은 창이 드문드문
      for (let y = roofH + 2; y < roofH + wh - 4; y += 4) {
        px(ctx, 1, y, pw - 2, 1, shade(wall, -0.06));
      }
      for (let r = 0; ; r++) {
        const y = roofH + 4 + r * 9;
        if (y + 5 > roofH + wh - 4) break;
        for (let x = 5; x < pw - 7; x += 12) {
          if (rng.chance(0.2)) continue;
          px(ctx, x, y, 6, 5, glass);
          px(ctx, x, y + 4, 6, 1, shade(glass, -0.3));
        }
      }
    } else {
      // 격자 창 — 가장 흔한 모습
      const step = 9;
      for (let r = 0; ; r++) {
        const y = roofH + 4 + r * 9;
        if (y + 5 > roofH + wh - 4) break;
        for (let x = 4; x < pw - 6; x += step) {
          if (rng.chance(0.12)) continue;
          px(ctx, x, y, 5, 5, glass);
          px(ctx, x, y, 5, 1, shade(glass, 0.25));
          px(ctx, x, y + 4, 5, 1, shade(glass, -0.25));
        }
      }
    }

    // 상가는 1층 유리 파사드와 간판띠. 간판 수와 색은 건물마다 다르다.
    if ((b.kind === KIND.SHOP || b.kind === KIND.MART || b.kind === KIND.TOWER) && wh > 14) {
      // 1층 통유리
      px(ctx, 1, roofH + wh - 9, pw - 2, 7, shade(col.accent, 0.3));
      for (let x = 4; x < pw - 3; x += 6) px(ctx, x, roofH + wh - 9, 1, 7, shade(wall, -0.15));

      const signCount = b.kind === KIND.MART ? 1 : style.signs;
      for (let i = 0; i < signCount; i++) {
        const y = roofH + wh - 14 - i * 11;
        if (y < roofH + 2) break;
        const sign = b.kind === KIND.MART ? col.accent : rng.pick(SIGN_COLORS);
        const inset = i === 0 ? 1 : 3;
        px(ctx, inset, y, pw - inset * 2, i === 0 ? 5 : 4, sign);
        px(ctx, inset, y, pw - inset * 2, 1, shade(sign, 0.25));
        for (let x = inset + 2; x < pw - inset - 3; x += 4) {
          px(ctx, x, y + 2, 2, 1, '#fffdf2');
        }
      }
      // 차양(어닝)
      if (style.awning) {
        const y = roofH + wh - 10;
        for (let x = 1; x < pw - 3; x += 6) {
          px(ctx, x, y, 5, 3, style.awningColor);
          px(ctx, x, y + 3, 5, 1, shade(style.awningColor, -0.3));
        }
      }
    }
  }

  // 아파트 앞면 — 세대 구획선과 발코니 띠, 그 사이 창문
  function drawApartmentFace(ctx, b, pw, roofH, wh, wall, col, rng, style) {
    const unit = 22;                    // 세대 하나의 폭(픽셀)
    const glass = shade(col.accent, rng.range(-0.04, 0.08));
    const line = shade(wall, -0.16);
    const rows = Math.max(2, Math.floor((wh - 6) / 8));

    for (let r = 0; r < rows; r++) {
      const y = roofH + 3 + r * 8;
      if (y + 6 > roofH + wh - 3) break;
      // 발코니 난간 띠
      px(ctx, 1, y + 5, pw - 2, 1, line);
      for (let x = 3; x < pw - 6; x += unit) {
        px(ctx, x, y, 8, 5, glass);
        px(ctx, x, y, 8, 1, shade(glass, 0.22));
        px(ctx, x + 10, y + 1, 6, 4, shade(glass, -0.12)); // 작은방 창
      }
    }
    // 세대 사이 벽선
    for (let x = 0; x < pw; x += unit) px(ctx, x, roofH + 1, 1, wh - 3, line);
    // 1층 — 필로티(기둥만 있는 층)인 단지가 있고, 아닌 단지가 있다
    if (style.piloti) {
      const y = roofH + wh - 9;
      px(ctx, 1, y, pw - 2, 9, shade(wall, -0.42));
      for (let x = 3; x < pw - 4; x += unit / 2) px(ctx, x, y, 3, 9, shade(wall, -0.05));
    }
    // 출입구 캐노피
    const dx = Math.max(2, Math.min(pw - 16, (b.door.x - b.x) * S));
    px(ctx, dx, roofH + wh - 8, 14, 8, shade(col.trim, -0.1));
    px(ctx, dx + 2, roofH + wh - 7, 10, 4, shade(col.accent, 0.15));
  }

  function drawFrontDoor(ctx, b, pw, roofH, wh, col, rng, style) {
    // 문은 언제나 앞면에 있다 (world/buildings.js 의 placeDoor 참고).
    // 실제 출입구 타일 x 에 맞춰 그려서, 땅에 깔린 매트와 자리가 어긋나지 않게 한다.
    const doorW = Math.min(12, Math.max(6, Math.floor(pw / 6)));
    const y = roofH + wh - 10;
    const dark = shade(col.trim, -0.2);
    const dx = Math.max(1, Math.min(pw - doorW - 1,
      (b.door.x - b.x) * S + (S - doorW) / 2));

    // 차양
    px(ctx, dx - 2, y - 3, doorW + 4, 3, shade(col.trim, 0.05));
    // 문틀과 유리문
    px(ctx, dx, y, doorW, 10, dark);
    px(ctx, dx + 1, y + 1, doorW - 2, 7, shade(col.accent, 0.25));
    px(ctx, dx + doorW / 2 - 0.5, y + 1, 1, 7, dark);   // 가운데 문설주
    px(ctx, dx, y + 9, doorW, 1, shade(dark, -0.3));
  }

  // 출입구 발판 (땅에 깔리는 매트) — 문 찾기 쉬우라고
  let doorMat = null;
  function doorMatSprite() {
    if (doorMat) return doorMat;
    const { canvas, ctx } = makeCanvas(S, S);
    px(ctx, 2, 4, 12, 9, '#c9a24a');
    px(ctx, 3, 5, 10, 7, '#e0b95f');
    px(ctx, 5, 8, 6, 1, '#8f6f2c');
    doorMat = canvas;
    return doorMat;
  }

  // ── 사람 ────────────────────────────────────────────────────────────────
  // 4방향 × 4프레임 (서기, 걷기1, 서기, 걷기2)
  const DIRS = ['down', 'left', 'right', 'up'];
  const FRAMES = 4;

  function makeCharacterSheet(colors) {
    const w = PLAYER.drawWidth, h = PLAYER.drawHeight;
    const { canvas, ctx } = makeCanvas(w * FRAMES, h * DIRS.length);
    for (let d = 0; d < DIRS.length; d++) {
      for (let f = 0; f < FRAMES; f++) {
        drawCharacter(ctx, f * w, d * h, w, h, DIRS[d], f, colors);
      }
    }
    return { canvas, w, h, dirs: DIRS, frames: FRAMES };
  }

  function drawCharacter(ctx, ox, oy, w, h, dir, frame, c) {
    const step = frame === 1 ? 1 : frame === 3 ? -1 : 0; // 걸음에 따라 다리를 엇갈린다
    const cx = ox + w / 2;
    const out = c.outline;

    // 그림자
    ctx.globalAlpha = 0.2;
    px(ctx, ox + 3, oy + h - 2, w - 6, 2, '#000000');
    ctx.globalAlpha = 1;

    // 다리
    px(ctx, cx - 3, oy + h - 6 + (step > 0 ? 0 : 1), 2, 5, c.bottom);
    px(ctx, cx + 1, oy + h - 6 + (step < 0 ? 0 : 1), 2, 5, c.bottom);
    px(ctx, cx - 3, oy + h - 2, 2, 2, c.shoe);
    px(ctx, cx + 1, oy + h - 2, 2, 2, c.shoe);

    // 몸통
    px(ctx, cx - 4, oy + 8, 8, 7, c.top);
    px(ctx, cx - 4, oy + 8, 8, 1, shade(c.top, 0.2));
    // 팔
    px(ctx, cx - 5, oy + 9 + (step > 0 ? 1 : 0), 1, 5, shade(c.top, -0.12));
    px(ctx, cx + 4, oy + 9 + (step < 0 ? 1 : 0), 1, 5, shade(c.top, -0.12));

    // 머리
    px(ctx, cx - 4, oy + 1, 8, 8, c.skin);
    px(ctx, cx - 4, oy + 1, 8, 3, c.hair);
    px(ctx, cx - 5, oy + 2, 1, 5, c.hair);
    px(ctx, cx + 4, oy + 2, 1, 5, c.hair);

    // 눈·표정 — 방향에 따라
    if (dir === 'down') {
      px(ctx, cx - 3, oy + 5, 2, 2, out);
      px(ctx, cx + 1, oy + 5, 2, 2, out);
      px(ctx, cx - 1, oy + 7, 2, 1, shade(c.skin, -0.25));
    } else if (dir === 'left') {
      px(ctx, cx - 3, oy + 5, 2, 2, out);
      px(ctx, cx - 5, oy + 4, 1, 3, c.hair);
    } else if (dir === 'right') {
      px(ctx, cx + 1, oy + 5, 2, 2, out);
      px(ctx, cx + 4, oy + 4, 1, 3, c.hair);
    } else {
      px(ctx, cx - 4, oy + 1, 8, 6, c.hair); // 뒤통수
    }
  }

  let playerSheet = null;
  function playerSheet_() {
    if (!playerSheet) playerSheet = makeCharacterSheet(PLAYER_COLOR);
    return playerSheet;
  }

  const npcSheets = new Map();
  function npcSheet(seed) {
    let hit = npcSheets.get(seed);
    if (hit) return hit;
    const rng = makeRng(SEED, 'npc', seed);
    hit = makeCharacterSheet({
      skin: rng.pick(['#f2cfa8', '#e6bd94', '#d8a97e']),
      hair: rng.pick(NPC_COLORS.hair),
      top: rng.pick(NPC_COLORS.top),
      bottom: rng.pick(NPC_COLORS.bottom),
      shoe: '#3a3a42',
      outline: '#2a2028',
    });
    npcSheets.set(seed, hit);
    return hit;
  }

  // 고양이 — 이 동네에 꼭 있어야 한다
  let catSprites = null;
  function catSprite(variant) {
    if (!catSprites) {
      catSprites = [];
      for (let v = 0; v < 3; v++) {
        const { canvas, ctx } = makeCanvas(14, 12);
        const rng = makeRng(SEED, 'cat', v);
        const fur = rng.pick(['#d8b98a', '#8a8a92', '#3a3a42', '#e8e2d8']);
        px(ctx, 2, 5, 9, 5, fur);
        px(ctx, 9, 3, 4, 4, fur);          // 머리
        px(ctx, 9, 2, 1, 2, fur);          // 귀
        px(ctx, 12, 2, 1, 2, fur);
        px(ctx, 1, 3, 2, 5, fur);          // 꼬리
        px(ctx, 3, 9, 2, 2, shade(fur, -0.2));
        px(ctx, 8, 9, 2, 2, shade(fur, -0.2));
        px(ctx, 10, 4, 1, 1, '#2a2028');   // 눈
        px(ctx, 12, 4, 1, 1, '#2a2028');
        catSprites.push(canvas);
      }
    }
    return catSprites[variant % catSprites.length];
  }

  // ── 길 위 사건 소품 ─────────────────────────────────────────────────────
  const eventPropCache = new Map();

  function eventPropSprite(icon) {
    let hit = eventPropCache.get(icon);
    if (hit) return hit;
    const { canvas, ctx } = makeCanvas(S, 24);
    const base = 24;
    switch (icon) {
      case 'cone':
        px(ctx, 3, base - 4, 10, 3, '#c85a2a');
        px(ctx, 5, base - 12, 6, 8, '#e2703a');
        px(ctx, 6, base - 16, 4, 4, '#e2703a');
        px(ctx, 5, base - 9, 6, 2, '#f2f2ee');
        break;
      case 'stall':   // 좌판
        px(ctx, 1, base - 9, 14, 6, '#b98f5c');
        px(ctx, 1, base - 10, 14, 2, '#d8a86a');
        px(ctx, 2, base - 3, 2, 3, '#7a5a3a');
        px(ctx, 12, base - 3, 2, 3, '#7a5a3a');
        px(ctx, 0, base - 17, S, 5, '#d8564a');   // 차양
        px(ctx, 0, base - 13, S, 1, '#a8382c');
        break;
      case 'bowl':
        px(ctx, 4, base - 6, 8, 4, '#c98f6a');
        px(ctx, 5, base - 7, 6, 2, '#e8d8a8');
        break;
      case 'boxes':
        px(ctx, 2, base - 10, 7, 7, '#b98f5c');
        px(ctx, 8, base - 7, 6, 5, '#a87f4c');
        px(ctx, 2, base - 10, 7, 1, '#d8a86a');
        break;
      case 'puddle':
        ctx.globalAlpha = 0.75;
        blob(ctx, 8, base - 4, 5, '#7fa8bd', null);
        ctx.globalAlpha = 1;
        break;
      case 'crowd':   // 사람 많음 — 발자국 표시만
        px(ctx, 4, base - 5, 3, 2, '#8a8477');
        px(ctx, 9, base - 8, 3, 2, '#8a8477');
        break;
      default:
        px(ctx, 5, base - 10, 6, 10, '#8a919c');
    }
    hit = canvas;
    eventPropCache.set(icon, hit);
    return hit;
  }

  // ── 자동차 ──────────────────────────────────────────────────────────────
  // 방향마다 미리 돌려서 구워 둔다. 매 프레임 회전시키면 도트가 지저분해진다.
  const CAR_DIRS = 16;
  const CAR_COLORS = ['#d8d8dc', '#3a3f46', '#8f97a0', '#5f7fa8', '#b8452f',
    '#2f5a3f', '#e2e2d8', '#7a5a8f'];
  const carCache = new Map();

  function carSprite(kind, color, dirIndex) {
    const key = `${kind}|${color}|${dirIndex}`;
    let hit = carCache.get(key);
    if (hit) return hit;

    const size = kind === 'bus' ? 46 : kind === 'truck' ? 38 : 26;
    const body = kind === 'car' ? 11 : 13;
    const box = Math.ceil(Math.hypot(size, body)) + 2;
    const { canvas, ctx } = makeCanvas(box, box);
    const c = CAR_COLORS[color % CAR_COLORS.length];

    ctx.save();
    ctx.translate(box / 2, box / 2);
    ctx.rotate((dirIndex / CAR_DIRS) * Math.PI * 2);
    ctx.translate(-size / 2, -body / 2);

    // 차체
    px(ctx, 0, 0, size, body, c);
    px(ctx, 0, 0, size, 1, shade(c, 0.22));
    px(ctx, 0, body - 1, size, 1, shade(c, -0.28));
    if (kind === 'bus') {
      // 버스 — 창문 줄과 노선 색띠
      for (let x = 4; x < size - 6; x += 6) px(ctx, x, 2, 4, body - 4, '#9fc0dd');
      px(ctx, 0, Math.floor(body / 2), size, 2, '#3f7fbf');
      px(ctx, size - 4, 2, 3, body - 4, shade(c, -0.2));
    } else if (kind === 'truck') {
      // 트럭 — 앞칸과 적재함
      px(ctx, 0, 0, 11, body, shade(c, -0.12));
      px(ctx, 2, 2, 6, body - 4, '#9fc0dd');
      px(ctx, 12, 1, size - 13, body - 2, shade(c, 0.1));
      for (let x = 14; x < size - 2; x += 5) px(ctx, x, 1, 1, body - 2, shade(c, -0.15));
    } else {
      // 승용차 — 앞유리, 뒷유리, 지붕
      px(ctx, 5, 1, size - 11, body - 2, shade(c, -0.08));
      px(ctx, 6, 2, 4, body - 4, '#9fc0dd');
      px(ctx, size - 10, 2, 4, body - 4, '#8fb0cc');
    }
    // 바퀴와 등
    px(ctx, 3, -1, 4, 1, '#2a2a30');
    px(ctx, size - 8, -1, 4, 1, '#2a2a30');
    px(ctx, 3, body, 4, 1, '#2a2a30');
    px(ctx, size - 8, body, 4, 1, '#2a2a30');
    px(ctx, size - 2, 1, 2, 2, '#f2e2a8');
    px(ctx, size - 2, body - 3, 2, 2, '#f2e2a8');
    px(ctx, 0, 1, 1, 2, '#d8564a');
    px(ctx, 0, body - 3, 1, 2, '#d8564a');
    ctx.restore();

    hit = canvas;
    carCache.set(key, hit);
    return hit;
  }

  function carDirIndex(angle) {
    const step = (Math.PI * 2) / CAR_DIRS;
    return ((Math.round(angle / step) % CAR_DIRS) + CAR_DIRS) % CAR_DIRS;
  }

  // ── 실내 타일 ───────────────────────────────────────────────────────────
  const interiorCache = new Map();

  function interiorTile(kind, variant) {
    const key = kind * 16 + variant;
    let hit = interiorCache.get(key);
    if (hit) return hit;

    const { canvas, ctx } = makeCanvas(S, S);
    const base = INTERIOR_COLOR[kind] || '#ff00ff';
    const rng = makeRng(SEED, 'in', kind, variant);
    px(ctx, 0, 0, S, S, base);

    switch (kind) {
      case IN.FLOOR: { // 장판 — 이음선
        px(ctx, 0, 0, S, 1, shade(base, -0.08));
        px(ctx, 0, 0, 1, S, shade(base, -0.08));
        for (let i = 0; i < 6; i++) px(ctx, rng.int(0, S - 1), rng.int(0, S - 1), 1, 1,
          shade(base, -0.05));
        break;
      }
      case IN.WALL: {
        px(ctx, 0, 0, S, 3, shade(base, 0.16));
        px(ctx, 0, S - 3, S, 3, shade(base, -0.22));
        for (let y = 3; y < S - 3; y += 6) px(ctx, 0, y, S, 1, shade(base, -0.1));
        break;
      }
      case IN.EXIT: { // 건물 현관 — 유리문과 비상구 표시
        px(ctx, 0, 0, S, S, INTERIOR_COLOR[IN.WALL]);
        px(ctx, 1, 3, 14, 13, '#8fb8cc');          // 유리
        px(ctx, 1, 3, 14, 1, '#d8e6ee');
        px(ctx, 7, 3, 2, 13, INTERIOR_COLOR[IN.WALL]); // 문설주
        px(ctx, 3, 9, 2, 2, '#e8d8a8');            // 손잡이
        px(ctx, 10, 9, 2, 2, '#e8d8a8');
        px(ctx, 4, 0, 8, 3, base);                 // 비상구 표시등
        px(ctx, 6, 1, 4, 1, '#ffffff');
        break;
      }
      case IN.STAIR_UP: case IN.STAIR_DOWN: {
        const up = kind === IN.STAIR_UP;
        for (let i = 0; i < 4; i++) {
          const y = up ? 12 - i * 4 : i * 4;
          px(ctx, 1, y, 14, 3, shade(base, up ? 0.06 * i : -0.06 * i));
        }
        break;
      }
      case IN.ELEVATOR: {
        px(ctx, 1, 1, 14, 14, shade(base, -0.15));
        px(ctx, 3, 3, 4, 10, shade(base, 0.25));
        px(ctx, 9, 3, 4, 10, shade(base, 0.25));
        break;
      }
      case IN.COUNTER: {
        px(ctx, 0, 3, S, 10, base);
        px(ctx, 0, 3, S, 2, shade(base, 0.2));
        px(ctx, 0, 12, S, 2, shade(base, -0.25));
        break;
      }
      case IN.SHELF: {
        px(ctx, 1, 1, 14, 14, base);
        for (let y = 3; y < 14; y += 5) px(ctx, 2, y, 12, 3, shade(base, rng.range(-0.2, 0.25)));
        break;
      }
      case IN.DESK: {
        px(ctx, 1, 4, 14, 9, base);
        px(ctx, 1, 4, 14, 2, shade(base, 0.18));
        px(ctx, 4, 6, 7, 4, '#6d7a86'); // 모니터
        break;
      }
      case IN.PLANT: {
        px(ctx, 0, 0, S, S, INTERIOR_COLOR[IN.FLOOR]);
        px(ctx, 6, 10, 4, 5, '#b1705a');
        blob(ctx, 8, 7, 4, base, rng);
        break;
      }
      case IN.RUG: {
        px(ctx, 1, 1, 14, 14, base);
        px(ctx, 3, 3, 10, 10, shade(base, 0.14));
        break;
      }
      case IN.WINDOW: {
        px(ctx, 0, 0, S, S, INTERIOR_COLOR[IN.WALL]);
        px(ctx, 2, 3, 12, 9, base);
        px(ctx, 7, 3, 2, 9, shade(base, -0.25));
        break;
      }
      case IN.BED: {
        px(ctx, 2, 2, 12, 12, base);
        px(ctx, 2, 2, 12, 4, shade(base, 0.2));
        px(ctx, 3, 7, 10, 6, '#b8c8dc');
        break;
      }
      case IN.TABLE: {
        px(ctx, 2, 3, 12, 10, base);
        px(ctx, 2, 3, 12, 2, shade(base, 0.2));
        px(ctx, 6, 6, 4, 4, '#f2f2ee');
        break;
      }
      case IN.DOOR: { // 닫힌 문
        px(ctx, 0, 0, S, S, INTERIOR_COLOR[IN.WALL]);
        px(ctx, 2, 1, 12, 14, base);
        px(ctx, 2, 1, 12, 1, shade(base, 0.24));
        px(ctx, 3, 3, 10, 10, shade(base, -0.12));
        px(ctx, 11, 8, 2, 2, '#e8d8a8');   // 손잡이
        break;
      }
      case IN.DOOR_OPEN: { // 열린 문 — 옆으로 젖혀져 있다
        px(ctx, 0, 0, S, S, INTERIOR_COLOR[IN.FLOOR]);
        px(ctx, 0, 0, 3, S, INTERIOR_COLOR[IN.WALL]);
        px(ctx, 13, 0, 3, S, INTERIOR_COLOR[IN.WALL]);
        px(ctx, 3, 0, 4, 14, base);
        px(ctx, 3, 0, 4, 1, shade(base, 0.24));
        break;
      }
      case IN.LOCKER: { // 복도 사물함
        px(ctx, 0, 0, S, S, base);
        for (let x = 1; x < S; x += 5) px(ctx, x, 1, 4, 14, shade(base, 0.1));
        for (let x = 1; x < S; x += 5) px(ctx, x + 1, 7, 2, 1, shade(base, -0.35));
        break;
      }
      case IN.SMOKE: { // 연기 — 반쯤 비친다
        px(ctx, 0, 0, S, S, INTERIOR_COLOR[IN.FLOOR]);
        ctx.globalAlpha = 0.55;
        for (let i = 0; i < 7; i++) {
          blob(ctx, rng.int(3, 13), rng.int(3, 13), rng.int(2, 4), base, rng);
        }
        ctx.globalAlpha = 1;
        break;
      }
      case IN.BOX: { // 쏟아진 상자
        px(ctx, 0, 0, S, S, INTERIOR_COLOR[IN.FLOOR]);
        px(ctx, 1, 4, 9, 8, base);
        px(ctx, 1, 4, 9, 1, shade(base, 0.2));
        px(ctx, 5, 4, 1, 8, shade(base, -0.25));
        px(ctx, 9, 1, 6, 6, shade(base, -0.1));
        break;
      }
      case IN.PUDDLE: { // 물웅덩이
        px(ctx, 0, 0, S, S, INTERIOR_COLOR[IN.FLOOR]);
        ctx.globalAlpha = 0.7;
        blob(ctx, 8, 9, 5, base, rng);
        ctx.globalAlpha = 1;
        px(ctx, 5, 6, 4, 1, shade(base, 0.35));
        break;
      }
      case IN.CONE: { // 안전콘
        px(ctx, 0, 0, S, S, INTERIOR_COLOR[IN.FLOOR]);
        px(ctx, 4, 12, 9, 3, shade(base, -0.2));
        px(ctx, 6, 5, 5, 7, base);
        px(ctx, 7, 2, 3, 3, base);
        px(ctx, 6, 8, 5, 2, '#f2f2ee');
        break;
      }
      case IN.CAR: { // 주차된 차 (위에서 본 모습)
        px(ctx, 0, 0, S, S, INTERIOR_COLOR[IN.FLOOR]);
        px(ctx, 2, 1, 12, 14, base);
        px(ctx, 3, 3, 10, 4, '#9fc0dd');
        px(ctx, 3, 9, 10, 4, shade(base, -0.15));
        px(ctx, 2, 0, 12, 1, shade(base, 0.2));
        break;
      }
      case IN.PILLAR: { // 기둥
        px(ctx, 0, 0, S, S, INTERIOR_COLOR[IN.FLOOR]);
        px(ctx, 2, 2, 12, 12, base);
        px(ctx, 2, 2, 12, 2, shade(base, 0.18));
        px(ctx, 2, 12, 12, 2, shade(base, -0.25));
        break;
      }
      case IN.SEAT: { // 상영관 좌석
        px(ctx, 0, 0, S, S, '#2a2530');
        px(ctx, 1, 4, 6, 10, base);
        px(ctx, 9, 4, 6, 10, base);
        px(ctx, 1, 4, 6, 2, shade(base, 0.2));
        px(ctx, 9, 4, 6, 2, shade(base, 0.2));
        break;
      }
      case IN.SCREEN: { // 스크린
        px(ctx, 0, 0, S, S, '#2a2530');
        px(ctx, 0, 2, S, 11, base);
        px(ctx, 0, 2, S, 1, '#ffffff');
        break;
      }
      case IN.CART: { // 카트 보관대
        px(ctx, 0, 0, S, S, INTERIOR_COLOR[IN.FLOOR]);
        for (let i = 0; i < 3; i++) px(ctx, 2 + i * 4, 4, 3, 9, base);
        px(ctx, 1, 3, 14, 1, shade(base, -0.2));
        break;
      }
      case IN.MACHINE: {
        px(ctx, 1, 1, 14, 14, base);
        px(ctx, 3, 3, 10, 5, shade(base, -0.3));
        px(ctx, 4, 10, 3, 3, '#e2705f');
        px(ctx, 9, 10, 3, 3, '#8fc48a');
        break;
      }
    }

    hit = canvas;
    interiorCache.set(key, hit);
    return hit;
  }

  // 상호작용 물건 (버튼·레버·자판기 따위) — 실내외 공용
  const gizmoCache = new Map();
  function gizmoSprite(icon, active) {
    const key = icon + (active ? '!' : '');
    let hit = gizmoCache.get(key);
    if (hit) return hit;
    const { canvas, ctx } = makeCanvas(S, S);
    const body = '#3d4450';
    switch (icon) {
      case 'button':
        px(ctx, 3, 5, 10, 8, body);
        px(ctx, 5, 7, 6, 4, active ? '#8fc48a' : '#e2554a');
        px(ctx, 5, 7, 6, 1, '#ffffff44');
        break;
      case 'lever':
        px(ctx, 4, 9, 8, 5, body);
        px(ctx, active ? 9 : 5, 3, 2, 7, '#d8d8dc');
        px(ctx, active ? 8 : 4, 2, 4, 3, active ? '#8fc48a' : '#e2554a');
        break;
      case 'panel':
        px(ctx, 2, 3, 12, 11, '#8a919c');
        px(ctx, 3, 4, 10, 9, active ? '#2a2f38' : '#b8bfc8');
        if (active) { px(ctx, 5, 6, 2, 2, '#f2c14e'); px(ctx, 9, 9, 2, 2, '#8fc48a'); }
        break;
      case 'valve':
        px(ctx, 7, 4, 2, 9, body);
        px(ctx, 3, 6, 10, 2, active ? '#8fc48a' : '#e2554a');
        px(ctx, 6, 3, 4, 2, '#d8d8dc');
        break;
      case 'note':
        px(ctx, 3, 3, 10, 11, '#f2eddc');
        px(ctx, 5, 6, 6, 1, '#8a8477');
        px(ctx, 5, 8, 6, 1, '#8a8477');
        px(ctx, 5, 10, 4, 1, '#8a8477');
        break;
      case 'bowl':
        px(ctx, 4, 8, 8, 4, '#c98f6a');
        px(ctx, 5, 7, 6, 2, active ? '#e8d8a8' : '#a8724e');
        break;
      case 'bell':
        px(ctx, 5, 4, 6, 7, '#d8b45a');
        px(ctx, 4, 10, 8, 2, '#b8923a');
        px(ctx, 7, 12, 2, 2, '#8a6a24');
        break;
      // ── 사건 표시 ──────────────────────────────────────────────
      case 'fire':
        px(ctx, 6, 10, 4, 4, '#e2554a');
        px(ctx, 5, 6, 6, 5, '#e2884a');
        px(ctx, 7, 3, 3, 4, '#f2c14e');
        break;
      case 'ufo':
        px(ctx, 5, 4, 6, 3, '#a8c8f0');
        px(ctx, 2, 7, 12, 3, '#8a919c');
        px(ctx, 4, 10, 2, 2, '#f2c14e');
        px(ctx, 10, 10, 2, 2, '#f2c14e');
        break;
      case 'kaiju':
        px(ctx, 4, 6, 8, 7, '#5a7a5e');
        px(ctx, 6, 3, 4, 4, '#5a7a5e');
        px(ctx, 6, 4, 1, 1, '#f2c14e');
        px(ctx, 9, 4, 1, 1, '#f2c14e');
        px(ctx, 3, 9, 2, 4, '#4a6a4e');
        px(ctx, 11, 9, 2, 4, '#4a6a4e');
        break;
      case 'bug':
        px(ctx, 6, 5, 4, 7, '#2f2a30');
        px(ctx, 3, 6, 3, 2, '#4a4450');
        px(ctx, 10, 6, 3, 2, '#4a4450');
        px(ctx, 7, 3, 2, 2, '#c04a4a');
        break;
      case 'animal':
        px(ctx, 4, 7, 9, 5, '#7a6a54');
        px(ctx, 11, 5, 3, 3, '#7a6a54');
        px(ctx, 3, 8, 1, 4, '#5a4a34');
        px(ctx, 12, 6, 1, 1, '#20202a');
        break;
      case 'fish':
        px(ctx, 4, 7, 8, 4, '#6a8faa');
        px(ctx, 12, 6, 2, 6, '#4a6f8a');
        px(ctx, 6, 8, 1, 1, '#20202a');
        break;
      case 'bird':
        px(ctx, 6, 6, 5, 6, '#e8e4dc');
        px(ctx, 8, 3, 2, 4, '#e8e4dc');
        px(ctx, 10, 4, 2, 1, '#f2c14e');
        px(ctx, 7, 12, 1, 2, '#8a8477');
        break;
      case 'circle':
        px(ctx, 3, 7, 10, 1, '#b8a86a');
        px(ctx, 5, 5, 6, 1, '#b8a86a');
        px(ctx, 5, 10, 6, 1, '#b8a86a');
        px(ctx, 3, 8, 1, 2, '#b8a86a');
        px(ctx, 12, 8, 1, 2, '#b8a86a');
        break;
      case 'hole':
        px(ctx, 3, 6, 10, 7, '#2a2620');
        px(ctx, 4, 5, 8, 2, '#5a5044');
        break;
      case 'train':
        px(ctx, 4, 3, 8, 9, '#8fa8c0');
        px(ctx, 5, 5, 6, 3, '#2a3038');
        px(ctx, 5, 12, 2, 2, '#3a3a44');
        px(ctx, 9, 12, 2, 2, '#3a3a44');
        break;
      case 'screen':
        px(ctx, 2, 4, 12, 8, '#e8e8ee');
        px(ctx, 3, 5, 10, 6, '#7a90a8');
        break;
      case 'alarm':
        px(ctx, 4, 6, 8, 6, '#e2554a');
        px(ctx, 7, 3, 2, 3, '#8a919c');
        px(ctx, 6, 8, 4, 2, '#f2eddc');
        break;
      case 'gate':
        px(ctx, 2, 11, 12, 2, '#5a5f68');
        px(ctx, 3, 4, 2, 8, '#8a919c');
        px(ctx, 5, 6, 9, 2, '#e2554a');
        break;
      case 'boxes':
        px(ctx, 3, 8, 6, 5, '#b08a5a');
        px(ctx, 9, 6, 5, 7, '#c99a68');

      this.clamp(bounds);

    const [sx, sy] = state.cameraRef.worldToScreen(wp.tx * S, wp.ty * S);
    const margin = 54;
    const inside = sx > margin && sx < W - margin && sy > margin && sy < H - margin;

    let tx = sx, ty = sy;
    if (!inside) {
      // 화면 중앙에서 목적지 방향으로 선을 그어 테두리와 만나는 점을 찾는다
      const cx = W / 2, cy = H / 2;
      const dx = sx - cx, dy = sy - cy;
      const scale = Math.min(
        Math.abs(dx) > 0.001 ? (W / 2 - margin) / Math.abs(dx) : Infinity,
        Math.abs(dy) > 0.001 ? (H / 2 - margin) / Math.abs(dy) : Infinity);
      tx = cx + dx * scale;
      ty = cy + dy * scale;
    }

    // 부드럽게 따라가기
    if (!state.markerPos) state.markerPos = { x: tx, y: ty };
    const t = Math.min(1, (state.dt || 0.016) * 12);
    state.markerPos.x += (tx - state.markerPos.x) * t;
    state.markerPos.y += (ty - state.markerPos.y) * t;
    const mx = state.markerPos.x, my = state.markerPos.y;

    const dist = Math.hypot(wp.tx * S - state.player.x, wp.ty * S - state.player.y);
    const km = (dist / S) * GEO.metersPerTile / 1000;
    const distText = km < 1 ? `${Math.round(km * 1000)}m` : `${km.toFixed(1)}km`;

    ctx.save();
    ctx.globalAlpha = 0.92;
    if (inside) {
      // 목표 위에 핀
      ctx.strokeStyle = UI_COLOR.accent;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(mx, my, 9, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = UI_COLOR.accent;
      ctx.fillRect(mx - 1.5, my - 22, 3, 12);
    } else {
      // 가장자리 화살표
      const ang = Math.atan2(my - H / 2, mx - W / 2);
      ctx.translate(mx, my);
      ctx.rotate(ang);
      ctx.fillStyle = UI_COLOR.accent;
      ctx.beginPath();
      ctx.moveTo(11, 0);
      ctx.lineTo(-7, -8);
      ctx.lineTo(-7, 8);
      ctx.closePath();
      ctx.fill();
      ctx.rotate(-ang);
      ctx.translate(-mx, -my);
    }
    ctx.restore();

    const text = `${wp.label} ${distText}`;
    const tw = textWidth(ctx, text, 11) + 14;
    const bx = Math.max(6, Math.min(W - tw - 6, mx - tw / 2));
    const by = Math.max(20, Math.min(H - 26, my + (inside ? 26 : 22)));
    ctx.fillStyle = 'rgba(16, 15, 20, 0.72)';
    ctx.fillRect(bx, by - 13, tw, 18);
    drawText(ctx, text, bx + tw / 2, by, { size: 11, align: 'center', color: UI_COLOR.accent });
  }

  // 반투명 판
  function panel(ctx, x, y, w, h) {
    ctx.fillStyle = UI_COLOR.panel;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = UI_COLOR.panelEdge;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }

  function fmt(seconds) {
    const s = Math.max(0, Math.floor(seconds));
    const m = Math.floor(s / 60);
    return m >= 60 ? `${Math.floor(m / 60)}시간 ${m % 60}분` : `${m}분`;
  }

  __M.bakeOverview = bakeOverview; __M.drawHud = drawHud; __M.panel = panel;
})();

// ── game/state.js ─────────────────────────────
(function () {
  // 게임 진행 상태 — 시계, 플래그, 발견한 엔딩.
  // "무엇을 건드렸는가" 가 전부다. 엔딩은 이 상태만 보고 결정된다.

  const { GAME, SAVE } = __M;
  const { withJosa } = __M;

  class GameState {
    constructor() {
      this.clock = GAME.startClock;     // 게임 내 시각(초)
      this.flags = new Set();           // 건드린 것들
      this.counters = {};               // 횟수를 세는 것들 (고양이 등)
      this.log = [];                    // 무엇을 언제 건드렸는지 (엔딩 화면에 보여 준다)
      this.used = new Set();            // 한 번만 되는 물건
      this.item = null;                 // 지금 들고 있는 아이템 id (하나만)
      this.gotItems = new Set();        // 오늘 받아 본 아이템들
      this.ending = null;               // 결말이 나면 채워진다
      this.startedAt = Date.now();
      this.found = loadFound();         // 지금까지 본 엔딩 (localStorage)
    }

    tick(dt) {
      if (this.ending) return;
      this.clock += dt * GAME.timeScale;
    }

    has(flag) { return this.flags.has(flag); }
    count(key) { return this.counters[key] || 0; }

    set(flag, note) {
      if (!this.flags.has(flag)) {
        this.flags.add(flag);
        if (note) this.log.push({ t: this.clock, note });
      }
    }

    bump(key, n = 1) { this.counters[key] = (this.counters[key] || 0) + n; }

    // 아이템은 하나만 든다. 새로 받으면 들고 있던 것은 그 자리에 놓고 온다.
    takeItem(id, name) {
      this.item = id;
      this.gotItems.add(id);
      this.bump('items');
      this.set('item_' + id, `${withJosa(name, '을/를')} 받았다`);
    }

    dropItem() { this.item = null; }

    get late() { return this.clock > GAME.deadline; }
    get touched() { return this.flags.size; }

    clockText() {
      const t = Math.floor(this.clock) % 86400;
      const hh = String(Math.floor(t / 3600)).padStart(2, '0');
      const mm = String(Math.floor((t % 3600) / 60)).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    discover(id) {
      this.found.add(id);
      saveFound(this.found);
    }
  }

  function loadFound() {
    try {
      const raw = localStorage.getItem(SAVE.key);
      if (!raw) return new Set();
      return new Set(JSON.parse(raw).found || []);
    } catch (e) {
      return new Set(); // 저장이 막힌 환경에서도 게임은 돌아간다
    }
  }

  function saveFound(found) {
    try {
      localStorage.setItem(SAVE.key, JSON.stringify({ found: [...found] }));
    } catch (e) { /* 저장 못 해도 그만 */ }
  }

  __M.GameState = GameState;
})();

(function () {
  // 사건(encounter) — 무엇을 들고 마주쳤느냐로 하루가 갈리는 자리들.
  //
  // 내용은 data/encounters_*.js 에 있다. 여기서는 세 묶음을 합치고,
  // 지도 위에 놓을 수 있는 형태로 바꾸고, 결과를 고르는 일만 한다.
  //
  // 사건 하나의 결과(outcome) 하나가 그대로 엔딩 하나가 된다.

  const { ENCOUNTERS_CITY } = __M;
  const { ENCOUNTERS_NATURE } = __M;
  const { ENCOUNTERS_DEEP } = __M;
  const { ITEM_BY_ID } = __M;

  const ENCOUNTERS = [
    ...ENCOUNTERS_CITY, ...ENCOUNTERS_NATURE, ...ENCOUNTERS_DEEP,
  ];

  // 사건에 붙는 플래그 이름 — 엔딩 판정이 이 값을 본다
  function encounterFlag(encId, itemId) {
    return `enc:${encId}:${itemId || 'none'}`;
  }

  // 들고 있는 것에 맞는 결과. 맞는 게 없으면 맨손 결과.
  function pickOutcome(enc, itemId) {
    return enc.outcomes.find((o) => o.item === itemId)
      || enc.outcomes.find((o) => o.item === null || o.item === undefined)
      || enc.outcomes[enc.outcomes.length - 1];
  }

  // 사건을 만질 수 있는 물건처럼 만들어 준다 (game/gizmos.js 와 같은 모양)
  function encounterGizmos() {
    return ENCOUNTERS.map((enc) => ({
      id: `enc-${enc.id}`,
      icon: enc.icon,
      at: enc.at,
      name: enc.name,
      once: false,          // 결과가 곧 엔딩이라 어차피 한 번이다
      encounter: enc,
    }));
  }

  // 사건 하나가 만들어 내는 엔딩들
  function encounterEndings() {
    const out = [];
    for (const enc of ENCOUNTERS) {
      for (const o of enc.outcomes) {
        const item = o.item ? ITEM_BY_ID.get(o.item) : null;
        out.push({
          id: `X-${enc.id}-${o.item || 'none'}`,
          title: o.title,
          tag: o.tag || 'odd',
          when: 'any',
          group: enc.name,
          hint: item
            ? `${enc.name} 앞에서 ${item.name}을(를) 쓰면 (${item.from}에게 받는다)`
            : `${enc.name}을(를) 맨손으로 마주하면`,
          test: (s) => s.has(encounterFlag(enc.id, o.item)),
          lines: o.lines,
        });
      }
    }
    return out;
  }

  __M.ENCOUNTERS = ENCOUNTERS; __M.encounterFlag = encounterFlag; __M.pickOutcome = pickOutcome; __M.encounterGizmos = encounterGizmos; __M.encounterEndings = encounterEndings;
})();

    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    cam.resize(w, h);
  }

  // ── 입력 ────────────────────────────────────────────────────────────────
  function onKeyDown(e) {
    if (e.repeat) { keys.add(e.code); return; }
    keys.add(e.code);

    if (KEYS.fullscreen.includes(e.code)) { toggleFullscreen(document.documentElement); e.preventDefault(); return; }
    if (KEYS.worldmap.includes(e.code)) {
      state.showWorldMap = !state.showWorldMap;
      e.preventDefault();
      return;
    }
    if (KEYS.map.includes(e.code)) {
      // 전체지도가 열려 있으면 M 은 그걸 닫는다
      if (state.showWorldMap) state.showWorldMap = false;
      else state.showMinimap = !state.showMinimap;
      return;
    }
    if (KEYS.help.includes(e.code)) { state.showHelp = !state.showHelp; return; }
    if (e.code === 'KeyL') { state.showGallery = !state.showGallery; state.galleryPage = 0; return; }
    if (e.code === 'KeyG') {
      // 목적지를 오늘의 목표로 되돌린다
      state.waypoint = { tx: state.goalPoint.x / S, ty: state.goalPoint.y / S, label: GAME.goalName };
      toast(`목적지: ${GAME.goalName}`);
      return;
    }
    if (KEYS.minimapIn.includes(e.code)) { zoomMinimap(1); return; }
    if (KEYS.minimapOut.includes(e.code)) { zoomMinimap(-1); return; }
    if (KEYS.zoomIn.includes(e.code)) { cam.setZoom(cam.zoom + 1, window.innerWidth, window.innerHeight); return; }
    if (KEYS.zoomOut.includes(e.code)) { cam.setZoom(cam.zoom - 1, window.innerWidth, window.innerHeight); return; }
    if (e.code === 'Escape') {
      state.picker = null; state.showGallery = false;
      state.showHelp = false; state.showWorldMap = false;
      return;
    }

    if (state.game.ending) {
      if (e.code === 'KeyR') restart();
      return;
    }
    // 엔딩 목록은 쪽으로 넘긴다
    if (state.showGallery) {
      if (KEYS.left.includes(e.code)) { state.galleryPage = Math.max(0, (state.galleryPage || 0) - 1); return; }
      if (KEYS.right.includes(e.code)) {
        state.galleryPage = Math.min((state.galleryPages || 1) - 1, (state.galleryPage || 0) + 1);
        return;
      }
    }
    if (state.showHelp) { state.showHelp = false; return; }

    if (state.picker) {
      if (KEYS.up.includes(e.code)) state.picker.index = Math.max(0, state.picker.index - 1);
      else if (KEYS.down.includes(e.code)) {
        state.picker.index = Math.min(state.picker.floors.length - 1, state.picker.index + 1);
      } else if (KEYS.interact.includes(e.code)) {
        changeFloor(state.picker.floors[state.picker.index]);
        state.picker = null;
      }
      e.preventDefault();
      return;
    }

    if (KEYS.useItem.includes(e.code)) { useItem(); e.preventDefault(); return; }

    // 선택지가 떠 있으면 위아래로 고른다
    if (state.dialogue && state.dialogue.choices) {
      if (KEYS.up.includes(e.code)) { moveChoice(state, -1); e.preventDefault(); return; }
      if (KEYS.down.includes(e.code)) { moveChoice(state, 1); e.preventDefault(); return; }
    }

    if (KEYS.interact.includes(e.code)) {
      if (state.dialogue) advanceDialogue(state);
      else interact();
      e.preventDefault();
    }
  }

  function axis(negKeys, posKeys) {
    const neg = negKeys.some((k) => keys.has(k));
    const pos = posKeys.some((k) => keys.has(k));
    return (pos ? 1 : 0) - (neg ? 1 : 0);
  }

  // ── 루프 ────────────────────────────────────────────────────────────────
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000 || 0);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    state.dt = dt;              // 그리는 쪽에서 부드러운 전환에 쓴다
    const g = state.game;
    if (g.ending) return;
    if (state.showHelp || state.showGallery || state.picker || state.showWorldMap) return;
    if (state.dialogue) return;   // 말하는 동안에는 멈춘다

    g.tick(dt);
    if (state.exitCooldown > 0) state.exitCooldown -= dt;

    movePlayer(dt);

    if (state.mode === 'outdoor') {
      const view = cam.visibleTiles(2);
      const c0x = Math.floor(view.x0 / TILE.chunk), c1x = Math.floor(view.x1 / TILE.chunk);
      const c0y = Math.floor(view.y0 / TILE.chunk), c1y = Math.floor(view.y1 / TILE.chunk);
      actors.ensure(c0x, c0y, c1x, c1y);
      actors.update(dt, c0x, c0y, c1x, c1y);
      const pad = 120;
      traffic.update(dt, state.player, {
        left: cam.left - pad, top: cam.top - pad,
        right: cam.left + cam.viewW + pad, bottom: cam.top + cam.viewH + pad,
      });
      cam.follow(state.player.x, state.player.y, dt);
      updatePlaceName();
      noticeOutdoorEvent();
      checkGoal();
    } else {
      cam.follow(state.player.x, state.player.y, dt,
        { w: state.interior.w * S, h: state.interior.h * S });
      state.placeName = `${state.interiorBuilding.name} · ${floorLabel(state.floor)}`;
      // 방 안에 들어서면 그 방은 밝아진다
      const rIdx = state.interior.roomIndexAt(
        Math.floor(state.player.x / S), Math.floor(state.player.y / S));
      if (rIdx >= 0) state.interior.reveal(rIdx);
    }

    updatePrompt();

    for (const t of state.toasts) t.life -= dt;
    state.toasts = state.toasts.filter((t) => t.life > 0);
  }

  let stuckTime = 0;   // 제자리걸음이 이어진 시간

  // ── 자동 이동 ───────────────────────────────────────────────────────────
  // 지도에서 찍은 곳까지 알아서 걸어간다. 길은 조금씩 끊어서 찾는다.
  function startAutoWalk(target) {
    if (state.mode !== 'outdoor') {
      toast('밖으로 나가야 걸어갈 수 있다.');
      return;
    }
    state.autoPath = {
      goal: { x: Math.round(target.tx), y: Math.round(target.ty) },
      label: target.label || '표시한 곳',
      tiles: [], index: 0, age: PATHING.replanSeconds, still: 0, retries: 0,
    };
    toast(`${withJosa(state.autoPath.label, '으로/로')} 자동 이동 — 움직이면 멈춘다`);
  }

  function stopAutoWalk(reason) {
    if (!state.autoPath) return;
    if (reason) toast(reason);
    state.autoPath = null;
  }

  // 자동 이동이 갈 방향을 낸다. 갈 데가 없으면 null.
  function autoWalkDir(dt) {
    const auto = state.autoPath;
    const p = state.player;
    const here = { x: Math.floor(p.x / S), y: Math.floor(p.y / S) };
    const distTiles = Math.hypot(auto.goal.x - here.x, auto.goal.y - here.y);
    if (distTiles <= PATHING.arriveTiles) {
      stopAutoWalk(`${auto.label} 도착`);
      return null;
    }

    auto.age += dt;
    // 길이 다 떨어졌거나, 오래됐거나, 제자리면 다시 찾는다
    if (auto.index >= auto.tiles.length || auto.age >= PATHING.replanSeconds
        || auto.still > PATHING.stuckSeconds) {
      auto.tiles = findPath(map, here, auto.goal);
      auto.index = 0;
      auto.age = 0;
      auto.still = 0;
      if (!auto.tiles.length) {
        auto.retries++;
        if (auto.retries >= PATHING.maxRetries) {
          stopAutoWalk('그쪽으로는 길이 없어 멈췄다.');
          return null;
        }
        return null;
      }
      auto.retries = 0;
    }

    // 다음 지점까지 걸어간다
    let target = auto.tiles[auto.index];
    let tx = (target.x + 0.5) * S, ty = (target.y + 0.5) * S;
    while (Math.hypot(tx - p.x, ty - p.y) < PATHING.stepTiles * S
        && auto.index < auto.tiles.length - 1) {
      auto.index++;
      target = auto.tiles[auto.index];
      tx = (target.x + 0.5) * S; ty = (target.y + 0.5) * S;
    }
    const dx = tx - p.x, dy = ty - p.y;
    const len = Math.hypot(dx, dy) || 1;
    return { x: dx / len, y: dy / len };
  }

  function movePlayer(dt) {
    const p = state.player;
    let dx = axis(KEYS.left, KEYS.right);
    let dy = axis(KEYS.up, KEYS.down);
    if (touch && (touch.axis.x || touch.axis.y)) {   // 터치 조이스틱
      dx = touch.axis.x;
      dy = touch.axis.y;
    }
    // 직접 조작하면 자동 이동은 그 자리에서 멈춘다
    if (state.autoPath && (dx !== 0 || dy !== 0)) stopAutoWalk('자동 이동을 멈췄다.');
    if (state.autoPath) {
      const dir = autoWalkDir(dt);
      if (dir) { dx = dir.x; dy = dir.y; }
    }
    p.moving = dx !== 0 || dy !== 0;
    if (!p.moving) { stuckTime = 0; return; }

    const running = KEYS.run.some((k) => keys.has(k)) || (touch && touch.running);
    const speed = PLAYER.walkSpeed * (running ? PLAYER.runMultiplier : 1);
    const len = Math.hypot(dx, dy) || 1;
    const vx = (dx / len) * speed * dt, vy = (dy / len) * speed * dt;

    if (Math.abs(dx) > Math.abs(dy)) p.dir = dx > 0 ? 'right' : 'left';
    else if (dy !== 0) p.dir = dy > 0 ? 'down' : 'up';

    p.anim += dt * (running ? 1.6 : 1);

    const beforeX = p.x, beforeY = p.y;
    if (!blocked(p.x + vx, p.y)) p.x += vx;
    if (!blocked(p.x, p.y + vy)) p.y += vy;

    // 갇힘 감시 — 가려는데 제자리면 빼 준다
    const gone = Math.hypot(p.x - beforeX, p.y - beforeY);
    const still = gone <= PLAYER.stuckEpsilon * dt;
    stuckTime = still ? stuckTime + dt : 0;
    if (state.autoPath) state.autoPath.still = still ? state.autoPath.still + dt : 0;
    if (stuckTime > PLAYER.stuckSeconds) { stuckTime = 0; checkTrapped(); }
  }

  // 제자리걸음이 길어졌다 — 정말 갇힌 것인지 보고, 갇혔을 때만 빼 준다.
  // (벽을 향해 걷고 있을 뿐인데 옮겨 버리면 그게 더 이상하다)
  function checkTrapped() {
    const p = state.player;
    if (state.mode === 'interior') {
      const it = state.interior;
      const tx = Math.floor(p.x / S), ty = Math.floor(p.y / S);
      // 실내는 좁으니 몇 칸만 움직일 수 있어도 갇힌 것으로 본다
      if (interiorOpenArea(it, tx, ty, 6) >= 6) return;
      unstick();
      return;
    }
    const tx = Math.floor(p.x / S), ty = Math.floor(p.y / S);
    if (map.openArea(tx, ty, PLAYER.safeArea) >= PLAYER.safeArea) return;
    unstick();
  }

  // 실내에서 걸어 다닐 수 있는 칸 수 (limit 까지만)
  function interiorOpenArea(it, tx, ty, limit) {
    const seen = new Set([ty * 1000 + tx]);
    const queue = [{ x: tx, y: ty }];
    let count = 0;
    for (let i = 0; i < queue.length && count < limit; i++) {
      const q = queue[i];
      count++;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = q.x + dx, ny = q.y + dy, key = ny * 1000 + nx;
        if (seen.has(key) || it.isSolid(nx, ny)) continue;
        seen.add(key);
        queue.push({ x: nx, y: ny });
      }
    }
    return count;
  }

  // 갇혔을 때 빠져나갈 자리로 옮긴다.
  // 실내면 문 앞으로, 바깥이면 가까운 넓은 자리로.
  function unstick() {
    const p = state.player;
    stopAutoWalk();
    if (state.mode === 'interior') {
      const sp = state.interior.spawn;
      p.x = (sp.x + 0.5) * S; p.y = (sp.y + 0.5) * S;
      cam.snap(p.x, p.y);
      toast('길이 막혀 문 앞으로 돌아왔다.');
      return;
    }
    const spot = map.openSpot(Math.floor(p.x / S), Math.floor(p.y / S), PLAYER.safeArea);
    p.x = (spot.x + 0.5) * S; p.y = (spot.y + 0.5) * S;
    cam.snap(p.x, p.y);
    toast('좁은 데 끼어서 길가로 나왔다.');
  }

  // 바깥 좌표를 안전한 칸에 놓는다 (갇히는 자리로는 절대 내려놓지 않는다)
  function placeOutdoors(tx, ty) {
    const spot = map.openSpot(tx, ty, PLAYER.safeArea);
    state.player.x = (spot.x + 0.5) * S;
    state.player.y = (spot.y + 0.5) * S;
    cam.snap(state.player.x, state.player.y);
  }

  // 발밑 상자로 충돌을 본다
  function blocked(x, y) {
    const hw = PLAYER.width / 2, hh = PLAYER.height;
    const corners = [
      [x - hw, y - hh], [x + hw, y - hh], [x - hw, y], [x + hw, y],
    ];
    for (const [cx, cy] of corners) {
      const tx = Math.floor(cx / S), ty = Math.floor(cy / S);
      if (state.mode === 'interior') {
        if (state.interior.isSolid(tx, ty)) return true;
      } else if (map.isSolid(tx, ty)) return true;
    }
    return false;
  }

  // ── 상호작용 ────────────────────────────────────────────────────────────
  function nearestOutdoorTarget() {
    const p = state.player;
    const ptx = Math.floor(p.x / S), pty = Math.floor(p.y / S);

    // 물건
    for (const g of state.outdoorGizmos) {
      const d = Math.hypot((g.tx + 0.5) * S - p.x, (g.ty + 0.5) * S - p.y);
      if (d < GAME.interactRadius && !(g.once && state.game.used.has(g.id))) {
        return { type: 'gizmo', gizmo: g, label: g.name };
      }
    }
    // 길에서 만난 사람
    const person = actors.nearestPerson(p.x, p.y, LIFE.talkRadius);
    if (person) return { type: 'talk', person, label: person.role || '주민' };

    // 고양이
    const cat = actors.nearestCat(p.x, p.y, GAME.petRadius);
    if (cat && !state.game.used.has('cat:' + cat.id)) {
      return { type: 'cat', cat, label: '고양이' };
    }
    // 건물 출입구
    let best = null, bestD = BUILDING.enterRadius;
    for (const b of buildings.index.query(ptx - 3, pty - 3, ptx + 3, pty + 3)) {
      const d = Math.hypot((b.door.x + 0.5) * S - p.x, (b.door.y + 0.5) * S - p.y);
      if (d < bestD) { bestD = d; best = b; }
    }
    if (best && state.exitCooldown <= 0) {
      return { type: 'enter', building: best, label: best.name };
    }
    return null;
  }

  function nearestInteriorTarget() {
    const p = state.player;
    const tx = Math.floor(p.x / S), ty = Math.floor(p.y / S);
    const it = state.interior;

    for (const g of state.interiorGizmos) {
      const d = Math.hypot((g.tx + 0.5) * S - p.x, (g.ty + 0.5) * S - p.y);
      if (d < GAME.interactRadius && !(g.once && state.game.used.has(g.id))) {
        return { type: 'gizmo', gizmo: g, label: g.name };
      }
    }
    // 옆에 닫힌 문이 있으면 열 수 있다
    for (const [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
      if (it.tileAt(tx + dx, ty + dy) === IN.DOOR) {
        const room = it.rooms.find((r) => r.door && r.door.x === tx + dx && r.door.y === ty + dy);
        return { type: 'door', x: tx + dx, y: ty + dy, label: room ? room.name : '문' };
      }
    }

    // 옆에 사람이 있으면 말을 걸 수 있다 (어두운 방 안 사람은 안 보인다)
    for (const person of state.indoorPeople) {
      if (!it.visibleAt(person.tx, person.ty)) continue;
      if (Math.hypot(person.x - p.x, person.y - p.y) < LIFE.talkRadius) {
        return { type: 'talk', person, label: person.role };
      }
    }

    const here = it.tileAt(tx, ty);
    if (here === IN.EXIT) return { type: 'exit', label: '나가기' };
    if (here === IN.STAIR_UP) return { type: 'stair', delta: 1, label: '올라가기' };
    if (here === IN.STAIR_DOWN) return { type: 'stair', delta: -1, label: '내려가기' };
    if (here === IN.ELEVATOR) return { type: 'elevator', label: '엘리베이터' };
    return null;
  }

  function updatePrompt() {
    const t = state.mode === 'outdoor' ? nearestOutdoorTarget() : nearestInteriorTarget();
    state.target = t;
    if (!t) { state.prompt = ''; return; }
    const verb = t.type === 'talk' ? '말 걸기'
      : t.type === 'door' ? '문 열기'
      : t.type === 'enter' ? '들어가기'
      : t.type === 'exit' ? '나가기'
      : t.type === 'cat' ? '쓰다듬기'
      : t.type === 'stair' ? t.label
      : t.type === 'elevator' ? '층 고르기'
      : '만지기';
    state.prompt = `Space  ${verb} — ${t.label}`;
  }

  function interact() {
    // 자동 이동 중이면 먼저 선다 (걸어가면서 문을 여는 일은 없다)
    if (state.autoPath) { stopAutoWalk('자동 이동을 멈췄다.'); return; }

    const t = state.target;
    if (!t) return;
    switch (t.type) {
      case 'enter': return enterBuilding(t.building);
      case 'exit': return exitBuilding();
      case 'stair': return changeFloor(nextFloor(state.floor, t.delta));
      case 'elevator': return openPicker();
      case 'cat': return petCat(t.cat);
      case 'door': return openDoor(t);
      case 'talk': return talkTo(t.person);
      case 'gizmo': return useGizmo(t.gizmo);
    }
  }

  // 사람에게 말 걸기.
  // 줄 것을 들고 있는 사람이면 마지막에 물어본다 — 손은 하나뿐이다.
  function talkTo(person) {
    state.game.bump('talked');
    const item = person.gift && !person.gave ? ITEM_BY_ID.get(person.gift) : null;
    if (!item) {
      startDialogue(state, person.role || '주민', person.lines);
      return;
    }
    const held = state.game.item ? ITEM_BY_ID.get(state.game.item) : null;
    const lines = person.lines.concat([item.line]);
    const choices = held
      ? [
        { label: `${withJosa(held.name, '을/를')} 놓고 ${item.name} 받기`,
          run: () => { person.gave = true; swapItem(item, held); } },
        { label: `${withJosa(held.name, '을/를')} 계속 든다`,
          run: () => toast(`${withJosa(item.name, '은/는')} 그 자리에 두었다.`) },
      ]
      : [
        { label: `${item.name} 받기`, run: () => { person.gave = true; swapItem(item, null); } },
        { label: '괜찮다고 한다', run: () => toast('그냥 고맙다고만 했다.') },
      ];
    startDialogue(state, person.role || '주민', lines, { choices });
  }

  // 아이템 교체 — 하나만 들 수 있다
  function swapItem(item, held) {
    state.game.takeItem(item.id, item.name);
    toast(held ? `${withJosa(held.name, '을/를')} 놓고 ${withJosa(item.name, '을/를')} 들었다.`
      : `${withJosa(item.name, '을/를')} 받았다.`);
  }

  // ── 아이템 쓰기 ─────────────────────────────────────────────────────────
  // 사건 앞에서 쓰면 그날 하루가 그걸로 정해진다.
  // 그냥 쓰면 물건마다 정해진 한 줄이 나온다.
  function useItem() {
    if (state.dialogue || state.picker || state.game.ending) return;
    const id = state.game.item;
    if (!id) { toast('든 것이 없다. 사람에게 말을 걸어 보자.'); return; }
    const item = ITEM_BY_ID.get(id);

    // 가까이에 사건이 있으면 그쪽이 먼저다
    const enc = nearestEncounter();
    if (enc) { triggerEncounter(enc, id); return; }

    // 아니면 지금 있는 자리에 맞는 한 줄
    toast(`${item.name} — ${item.use}`);
    state.game.bump('used_item');
    state.game.set('use_' + id, `${item.name}을(를) 써 봤다`);
  }

  // 만질 수 있는 것 중 사건인 것 (실내·바깥 모두)
  function nearestEncounter() {
    const p = state.player;
    const list = state.mode === 'outdoor' ? state.outdoorGizmos : state.interiorGizmos;
    let best = null, bestD = LIFE.encounterRadius;
    for (const g of list) {
      if (!g.encounter) continue;
      const d = Math.hypot((g.tx + 0.5) * S - p.x, (g.ty + 0.5) * S - p.y);
      if (d < bestD) { bestD = d; best = g; }
    }
    return best;
  }

  // 사건 하나를 마주한다. 들고 있는 것에 따라 결과가 갈린다.
  function triggerEncounter(g, itemId) {
    const enc = g.encounter;
    const outcome = pickOutcome(enc, itemId || null);
    const used = outcome.item || null;
    startDialogue(state, enc.name, enc.intro, {
      onEnd: () => {
        const item = used ? ITEM_BY_ID.get(used) : null;
        state.game.set(encounterFlag(enc.id, used),
          item ? `${enc.name} 앞에서 ${withJosa(item.name, '을/를')} 썼다`
            : `${withJosa(enc.name, '을/를')} 맨손으로 마주했다`);
        state.game.bump('encounter');
        // 던지는 물건은 여기서 없어진다
        if (item && item.tag === '투척') state.game.dropItem();
        checkImmediateEnding();
      },
    });
  }

  // 문을 열면 그 방이 보인다
  function openDoor(target) {
    const it = state.interior;
    it.setTile(target.x, target.y, IN.DOOR_OPEN);
    const idx = it.rooms.findIndex((r) => r.door && r.door.x === target.x && r.door.y === target.y);
    if (idx >= 0) {
      it.reveal(idx);
      toast(`${it.rooms[idx].name}`);
    }
  }

  function petCat(cat) {
    state.game.used.add('cat:' + cat.id);
    state.game.bump('cat');
    state.game.set('cat_' + state.game.count('cat'), '고양이를 쓰다듬었다');
    toast(`고양이를 쓰다듬었다 (${state.game.count('cat')})`);
    checkImmediateEnding();
  }

  function useGizmo(g) {
    if (g.encounter) return triggerEncounter(g, state.game.item);
    const ctxObj = {
      toast,
      rideTo: (stationName) => rideTo(stationName),
    };
    state.game.used.add(g.id);
    g.effect(state.game, ctxObj);
    toast(g.text);
    checkImmediateEnding();
  }

  function toast(text) {
    state.toasts.unshift({ text, life: UI.toastSeconds });
    if (state.toasts.length > 3) state.toasts.pop();
  }

  // ── 건물 출입 · 층 이동 ─────────────────────────────────────────────────
  function enterBuilding(b) {
    stopAutoWalk();
    state.interiorBuilding = b;
    const floors = floorList(b);
    setFloor(b, floors.includes(1) ? 1 : floors[0], 'spawn');
    state.mode = 'interior';
    cam.snap(state.player.x, state.player.y, { w: state.interior.w * S, h: state.interior.h * S });
    toast(`${b.name} · ${floorLabel(state.floor)}`);
  }

  function setFloor(b, floor, place) {
    state.floor = floor;
    state.interior = makeInterior(b, floor);
    // 오늘 이 층에 무슨 일이 있는가
    state.indoorEvent = pickIndoorEvent(b, floor);
    applyEventProps(state.interior, state.indoorEvent);
    state.indoorPeople = makeIndoorPeople(b, floor, state.interior, state.indoorEvent);
    if (state.indoorEvent && state.indoorEvent.notice) {
      toast(state.indoorEvent.notice);
      state.game.bump('seen_event');
    }
    state.interiorGizmos = (indoorIndex.get(`${b.name}|${floor}`) || []).map((g, i) => {
      const slot = state.interior.slots[(g.at.slot + i) % Math.max(1, state.interior.slots.length)]
        || state.interior.spawn;
      return { ...g, tx: slot.x, ty: slot.y };
    });

    let spot;
    if (place === 'spawn') spot = state.interior.spawn;
    else if (place === 'up') spot = below(state.interior.stairs.down || state.interior.stairs.elevator);
    else if (place === 'down') spot = below(state.interior.stairs.up || state.interior.stairs.elevator);
    else spot = below(state.interior.stairs.elevator) || state.interior.spawn;
    state.player.x = (spot.x + 0.5) * S;
    state.player.y = (spot.y + 0.9) * S; // 타일 경계에 딱 걸치지 않게 (발밑 기준)
  }

  function below(pos) {
    return pos ? { x: pos.x, y: pos.y + 1 } : null;
  }

  function nextFloor(floor, delta) {
    const floors = floorList(state.interiorBuilding);
    const i = floors.indexOf(floor);
    return floors[Math.max(0, Math.min(floors.length - 1, i + delta))];
  }

  function changeFloor(floor) {
    if (floor === state.floor) return;
    const dir = floor > state.floor ? 'up' : 'down';
    setFloor(state.interiorBuilding, floor, dir);
    cam.snap(state.player.x, state.player.y, { w: state.interior.w * S, h: state.interior.h * S });
    toast(`${state.interiorBuilding.name} · ${floorLabel(floor)}`);
  }

  function openPicker() {
    // 전기를 끊어 놓고 엘리베이터를 타면 갇힌다
    if (state.game.has('blackout')) {
      state.game.set('stuck', '정전 중에 엘리베이터를 탔다');
      toast('버튼을 누르자 안내판이 꺼졌다.');
      checkImmediateEnding();
      return;
    }
    const floors = floorList(state.interiorBuilding);
    state.picker = { floors, index: Math.max(0, floors.indexOf(state.floor)) };
  }

  function exitBuilding() {
    stopAutoWalk();
    const b = state.interiorBuilding;
    const out = doorOutside(b);
    state.mode = 'outdoor';
    state.interior = null;
    state.interiorGizmos = [];
    state.indoorPeople = [];
    state.indoorEvent = null;
    state.floor = 1;
    state.exitCooldown = INTERIOR.exitPause;
    placeOutdoors(out.x, out.y);
  }

  // 지하철로 다른 역까지
  function rideTo(stationName) {
    stopAutoWalk();
    const target = buildings.list.find((b) => b.name === stationName);
    if (!target) return;
    const out = doorOutside(target);
    state.mode = 'outdoor';
    state.interior = null;
    state.interiorGizmos = [];
    state.interiorBuilding = null;
    state.floor = 1;
    state.exitCooldown = INTERIOR.exitPause;
    state.game.clock += 4 * 60; // 4분
    placeOutdoors(out.x, out.y);
    toast(`${stationName} 도착`);
  }

  // ── 결말 ────────────────────────────────────────────────────────────────
  // 길에서 벌어지는 일이 눈에 들어오면 한 번 알려 준다
  const seenOutdoorEvents = new Set();
  function noticeOutdoorEvent() {
    const near = actors.nearestEvent(state.player.x, state.player.y, LIFE.noticeRadius);
    if (!near || seenOutdoorEvents.has(near.key)) return;
    seenOutdoorEvents.add(near.key);
    if (near.event.notice) {
      toast(near.event.notice);
      state.game.bump('seen_event');
    }
  }

  function updatePlaceName() {
    const tx = Math.floor(state.player.x / S), ty = Math.floor(state.player.y / S);
    state.placeName = map.regionNameAt(tx, ty) || '김포 들녘';
  }

  function checkGoal() {
    const tx = Math.floor(state.player.x / S), ty = Math.floor(state.player.y / S);
    for (const r of map.regionIndex.queryPoint(tx, ty)) {
      if (!GAME.goalRegions.includes(r.id)) continue;
      if (pointInside(tx, ty, r.path)) { finish('goal'); return; }
    }
  }

  function pointInside(px, py, path) {
    let inside = false;
    for (let i = 0, j = path.length - 1; i < path.length; j = i++) {
      const [xi, yi] = path[i], [xj, yj] = path[j];
      if ((yi > py) !== (yj > py) && px < ((xj - xi) * (py - yi)) / (yj - yi + 1e-12) + xi) {
        inside = !inside;
      }
    }
    return inside;
  }

  function checkImmediateEnding() { finish('any'); }

  function finish(where) {
    if (state.game.ending) return;
    const e = evaluateEnding(state.game, where);
    if (!e) return;
    state.game.ending = e;
    state.game.discover(e.id);
  }

  function restart() {
    stopAutoWalk();
    state.game = new GameState();
    state.mode = 'outdoor';
    state.interior = null;
    state.interiorGizmos = [];
    state.interiorBuilding = null;
    state.toasts = [];
    state.showGallery = false;
    state.player.x = state.startPos.x;
    state.player.y = state.startPos.y;
    state.player.dir = 'down';
    cam.snap(state.player.x, state.player.y);
  }

  // ── 그리기 ──────────────────────────────────────────────────────────────
  function draw() {
    const W = canvas.width, H = canvas.height;
    ctx.fillStyle = UI_COLOR.sky;
    ctx.fillRect(0, 0, W, H);

    if (state.mode === 'outdoor') {
      scene.drawOutdoor(ctx, cam, state);
      drawBuildingLabels(ctx, cam, map, state.player);
    } else {
      scene.drawInterior(ctx, cam, state);
      drawRoomLabels(ctx, cam, state.interior);
    }

    drawHud(ctx, state);
    drawDialogue(ctx, state);
    if (state.picker) drawPicker();
    if (touch && !state.showWorldMap && !state.showGallery && !state.game.ending) {
      touch.draw(ctx, window.innerWidth, window.innerHeight);
    }
    if (state.showWorldMap) drawWorldMap(ctx, state);
    // 목록을 열면 결말 화면 대신 목록만 보여 준다
    else if (state.showGallery) drawGallery(ctx, state);
    else if (state.game.ending) drawEnding(ctx, state);
  }

  // 층 선택 대화창의 자리 (터치로 고를 때도 쓴다)
  function pickerLayout() {
    const floors = state.picker.floors;
    const rowH = 22;
    const visible = Math.min(floors.length, 12);
    const from = Math.max(0, Math.min(floors.length - visible,
      state.picker.index - Math.floor(visible / 2)));
    const w = 260;
    const h = visible * rowH + 78;
    const x = 40;
    const y = Math.max(20, (window.innerHeight - h) / 2);
    return { floors, rowH, visible, from, w, h, x, y };
  }

  function pickerRowAt(px, py) {
    const L = pickerLayout();
    if (px < L.x || px > L.x + L.w || py < L.y || py > L.y + L.h) return null;
    const idx = L.from + Math.floor((py - (L.y + 50)) / L.rowH);
    if (idx < 0 || idx >= L.floors.length) return null;
    return idx;
  }

  function drawPicker() {
    const b = state.interiorBuilding;
    const floors = state.picker.floors;
    const rowH = 22;
    const visible = Math.min(floors.length, 12);
    const from = Math.max(0, Math.min(floors.length - visible,
      state.picker.index - Math.floor(visible / 2)));

    const w = 260;
    const h = visible * rowH + 78;
    const x = 40;
    const y = Math.max(20, (window.innerHeight - h) / 2);

    panel(ctx, x, y, w, h);
    drawText(ctx, b.name, x + 16, y + 26, { size: 14 });
    drawText(ctx, '엘리베이터', x + 16, y + 44, { size: 11, color: UI_COLOR.accent });

    for (let i = from; i < from + visible; i++) {
      const f = floors[i];
      const row = y + 62 + (i - from) * rowH;
      const selected = i === state.picker.index;
      if (selected) {
        ctx.fillStyle = 'rgba(242, 193, 78, 0.16)';
        ctx.fillRect(x + 8, row - 14, w - 16, rowH);
      }
      const here = f === state.floor;
      drawText(ctx, `${here ? '●' : selected ? '▶' : ' '} ${floorLabel(f)}`,
        x + 16, row, { size: 13, color: selected ? UI_COLOR.text : UI_COLOR.textDim });
      drawText(ctx, floorUse(b, f), x + w - 16, row,
        { size: 12, align: 'right', color: selected ? UI_COLOR.accent : UI_COLOR.textDim });
    }

    drawText(ctx, '↑↓ 고르기 · Space 이동 · Esc 닫기', x + w / 2, y + h - 14,
      { size: 11, align: 'center', color: UI_COLOR.textDim });
  }

  // 개발·점검용 손잡이. 콘솔에서 __gurae 로 세계를 들여다볼 수 있다.
  function exposeDebugHandle() {
    if (typeof window === 'undefined') return;
    window.__gurae = {
      state, cam,
      get scene() { return scene; },
      get map() { return map; },
      get buildings() { return buildings; },
      // 타일 좌표로 순간이동 (실외)
      tp(tx, ty) {
        state.mode = 'outdoor';
        state.interior = null;
        state.player.x = (tx + 0.5) * S;
        state.player.y = (ty + 0.7) * S;
        cam.snap(state.player.x, state.player.y);
      },
      // 이름으로 건물 앞까지
      goto(name) {
        const b = buildings.list.find((x) => x.name === name);
        if (!b) return false;
        const out = doorOutside(b);
        window.__gurae.tp(out.x, out.y);
        return true;
      },
      interact,
      useItem,
      // 사건 앞으로 (검증용)
      encounter(id) {
        const g = state.outdoorGizmos.find((x) => x.encounter && x.encounter.id === id);
        if (!g) return false;
        window.__gurae.tp(g.tx, g.ty + 1);
        return true;
      },
    };
  }

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  }

})();

</script>
