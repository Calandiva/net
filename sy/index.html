// ── util/rng.js ─────────────────────────────
(function () {
  // 시드 기반 난수 · 노이즈. 절차적 생성물이 항상 같은 모습으로 재현되도록 하는 토대.

  // 문자열/숫자 조각들을 32비트 정수 해시 하나로 섞는다.
  function hash32(...parts) {
    let h = 0x811c9dc5;
    for (const part of parts) {
      const s = typeof part === 'string' ? part : String(part);
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 0x01000193) >>> 0;
      }
      h = Math.imul(h ^ 0x9e3779b9, 0x85ebca6b) >>> 0;
    }
    return h >>> 0;
  }

  // mulberry32 — 짧고 품질이 충분한 결정적 난수기.
  function makeRng(...seedParts) {
    let a = hash32(...seedParts);
    const rng = () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    // 편의 함수들
    rng.int = (min, max) => min + Math.floor(rng() * (max - min + 1));
    rng.range = (min, max) => min + rng() * (max - min);
    rng.pick = (arr) => arr[Math.floor(rng() * arr.length) % arr.length];
    rng.chance = (p) => rng() < p;
    rng.shuffle = (arr) => {
      const out = arr.slice();
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    };
    return rng;
  }

  // 시드 문자열들을 노이즈용 정수 시드 하나로 미리 굳혀 둔다.
  // 노이즈 함수는 픽셀마다 불리므로 문자열을 만들지 않는 것이 중요하다.
  function seedOf(...parts) { return hash32(...parts); }

  // 정수 좌표 해시 (0~1). 문자열을 거치지 않는다.
  function noiseAt(seed, x, y) {
    let h = seed ^ 0x9e3779b9;
    h = Math.imul(h ^ (x | 0), 0x85ebca6b);
    h ^= h >>> 13;
    h = Math.imul(h ^ (y | 0), 0xc2b2ae35);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  // 격자 보간 밸류 노이즈. scale 이 클수록 완만하다.
  function valueNoise(seed, x, y, scale) {
    const fx = x / scale, fy = y / scale;
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    const tx = smooth(fx - x0), ty = smooth(fy - y0);
    const n00 = noiseAt(seed, x0, y0);
    const n10 = noiseAt(seed, x0 + 1, y0);
    const n01 = noiseAt(seed, x0, y0 + 1);
    const n11 = noiseAt(seed, x0 + 1, y0 + 1);
    return lerp(lerp(n00, n10, tx), lerp(n01, n11, tx), ty);
  }

  // 여러 옥타브를 겹쳐 자연스러운 얼룩을 만든다.
  function fbm(seed, x, y, scale, octaves = 3) {
    let sum = 0, amp = 1, norm = 0, s = scale, sd = seed;
    for (let i = 0; i < octaves; i++) {
      sum += valueNoise(sd, x, y, s) * amp;
      norm += amp;
      amp *= 0.5;
      s *= 0.5;
      sd = (Math.imul(sd, 0x27d4eb2d) ^ 0x165667b1) >>> 0;
    }
    return sum / norm;
  }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function clamp(v, min, max) { return v < min ? min : v > max ? max : v; }

  __M.hash32 = hash32; __M.makeRng = makeRng; __M.seedOf = seedOf; __M.noiseAt = noiseAt; __M.valueNoise = valueNoise; __M.fbm = fbm; __M.lerp = lerp; __M.smooth = smooth; __M.clamp = clamp;
})();

// ── world/geo.js ─────────────────────────────
(function () {
  // 위경도(WGS84) ↔ 타일 좌표 변환만 담당한다.
  // 지역 데이터는 전부 실제 좌표로 적고, 게임 안에서 쓰는 순간 여기를 통과한다.
  // 지도 API에서 받은 데이터를 그대로 얹어도 이 파일만 통하면 된다.

  const { GEO, TILE } = __M;

  // 영역 전체 크기 (타일)
  const WORLD_W = Math.round(
    ((GEO.east - GEO.west) * GEO.metersPerLon) / GEO.metersPerTile);
  const WORLD_H = Math.round(
    ((GEO.north - GEO.south) * GEO.metersPerLat) / GEO.metersPerTile);

  // 영역 전체 크기 (픽셀)
  const WORLD_PX_W = WORLD_W * TILE.size;
  const WORLD_PX_H = WORLD_H * TILE.size;

  // 경도 → 타일 x
  function lonToTx(lon) {
    return ((lon - GEO.west) * GEO.metersPerLon) / GEO.metersPerTile;
  }
  // 위도 → 타일 y (화면은 위쪽이 북쪽)
  function latToTy(lat) {
    return ((GEO.north - lat) * GEO.metersPerLat) / GEO.metersPerTile;
  }

  const T = metersToTiles; // 미터 → 타일

  function clipLineToPath(fixed, from, to, path, horizontal, step = 3) {
    const runs = [];
    let current = null;
    for (let t = from; t <= to; t += step) {
      const x = horizontal ? t : fixed;
      const y = horizontal ? fixed : t;
      if (pointInPath(x, y, path)) {
        if (!current) current = [[x, y]];
        else current.push([x, y]);
      } else if (current) {
        if (current.length > 1) runs.push(current);

  // 블록 한 칸을 건물로 채운다. 종류별로 규칙이 다르다.

    // 상가 블록은 포장 마당에 뒤쪽 주차장이 붙는다.
    const parkingDepth = 6; // 타일
    if (district.kind === 'apartment') {
      out.areas.push({ ...rect, ground: 'lawn' });
      out.areas.push({ x: rect.x, y: rect.y + rect.h - parkingDepth,
        w: rect.w, h: parkingDepth, ground: 'parking' });
    } else if (district.kind === 'commercial') {
      out.areas.push({ ...rect, ground: 'plaza' });
      out.areas.push({ x: rect.x, y: rect.y + rect.h - parkingDepth,
        w: rect.w, h: parkingDepth, ground: 'parking' });
    }
    switch (district.kind) {
      case 'apartment': return fillApartment(district, rect, rng, out, f);
      case 'commercial': return fillCommercial(district, rect, rng, out, f);
      case 'house': return fillHouse(district, rect, rng, out, f);
      case 'industrial': return fillIndustrial(district, rect, rng, out, f);
      case 'rural': return fillRural(district, rect, rng, out, f);

  // 아파트 — 긴 판상형 동을 줄지어 놓고 번호를 매긴다.
  function fillApartment(d, rect, rng, out, f) {
    const bw = Math.round(T(f.bw)), bh = Math.round(T(f.bh));
    const gap = Math.round(T(f.gap));
    const rowPitch = bh + gap;
    for (let y = rect.y + 2; y + bh <= rect.y + rect.h - 2; y += rowPitch) {
      for (let x = rect.x + 2; x + bw <= rect.x + rect.w - 2; x += bw + Math.round(gap * 0.6)) {
        const n = f.start + out.aptCount[d.id]++;
        out.buildings.push({
          name: `${d.name} ${n}동`, kind: KIND.APARTMENT,
          x, y, w: bw, h: bh,
          floors: rng.int(f.floors[0], f.floors[1]), basement: 1,
          districtId: d.id,
        });
      }
    }

  // 상가 — 블록 가장자리를 따라 좁고 깊은 건물을 붙여 세운다.
  function fillCommercial(d, rect, rng, out, f) {
    const depth = Math.max(3, Math.round(T(f.depth)));
    const minW = Math.max(3, Math.round(T(f.minW)));
    const maxW = Math.max(minW + 1, Math.round(T(f.maxW)));
    const edges = [
      { horizontal: true, y: rect.y, dir: 1 },
      { horizontal: true, y: rect.y + rect.h - depth, dir: -1 },
      { horizontal: false, x: rect.x, dir: 1 },
      { horizontal: false, x: rect.x + rect.w - depth, dir: -1 },
    ];
    for (const e of edges) {
      if (e.horizontal) {
        for (let x = rect.x; x + minW <= rect.x + rect.w; ) {
          const w = rng.int(minW, Math.min(maxW, rect.x + rect.w - x));
          if (w < minW) break;
          if (rng.chance(0.86)) pushShop(d, rng, out, x, e.y, w, depth, f);
          x += w + (rng.chance(0.25) ? 1 : 0);
        }
      } else {
        for (let y = rect.y + depth; y + minW <= rect.y + rect.h - depth; ) {
          const h = rng.int(minW, Math.min(maxW, rect.y + rect.h - depth - y));
          if (h < minW) break;
          if (rng.chance(0.8)) pushShop(d, rng, out, e.x, y, depth, h, f);

    const innerX = rect.x + depth + 2, innerY = rect.y + depth + 2;
    const innerW = rect.w - (depth + 2) * 2, innerH = rect.h - (depth + 2) * 2;
    if (innerW >= minW && innerH >= 4) {
      for (let x = innerX; x + minW <= innerX + innerW; ) {
        const w = rng.int(minW, Math.min(maxW, innerX + innerW - x));
        if (w < minW) break;
        if (rng.chance(0.7)) {

    const jitter = Math.round(T(f.jitter));
    const pitch = size + Math.max(2, Math.round(jitter * 0.8));
    for (let y = rect.y + 1; y + size <= rect.y + rect.h - 1; y += pitch) {
      for (let x = rect.x + 1; x + size <= rect.x + rect.w - 1; x += pitch) {
        if (!rng.chance(0.82)) continue;
        const w = size + rng.int(-1, 2), h = size + rng.int(-1, 1);
        const floors = rng.int(f.floors[0], f.floors[1]);
        out.buildings.push({
          address: true, suffix: floors >= 3 ? rng.pick(HOUSE_SUFFIX) : '',
          kind: KIND.HOUSE, x, y, w: Math.max(3, w), h: Math.max(3, h),
          floors, basement: 0, districtId: d.id,
        });
      }
    }
  }

  // 공장 — 블록 하나에 큰 건물 한둘.
  function fillIndustrial(d, rect, rng, out, f) {
    const count = rng.int(1, 2);
    let cursorY = rect.y + 3;
    for (let i = 0; i < count; i++) {
      const w = Math.round(T(rng.range(f.minW, f.maxW)));
      const h = Math.round(T(rng.range(f.minH, f.maxH)));

      const x = rect.x + rng.int(2, Math.max(2, rect.w - w - 2));
      const warehouse = rng.chance(0.3);

        address: true, suffix: warehouse ? '물류창고' : '공장',

        x, y: cursorY, w, h,

      const streetW = ROAD_CLASS[d.street].width + ROAD_CLASS[d.street].sidewalk * 2;
      const pitchX = Math.round(T(d.block.w)) + streetW;
      const pitchY = Math.round(T(d.block.h)) + streetW;
      const x0 = Math.floor(b.minX), y0 = Math.floor(b.minY);

      // 블록 사이 길 — 구역 안쪽 구간만 남긴다
      for (let x = x0; x <= b.maxX; x += pitchX) {
        for (const run of clipLineToPath(x, y0, b.maxY, path, false)) {
          out.roads.push({ name: '', cls: d.street, tiles: run, districtId: d.id });
        }
      }
      for (let y = y0; y <= b.maxY; y += pitchY) {
        for (const run of clipLineToPath(y, x0, b.maxX, path, true)) {
          out.roads.push({ name: '', cls: d.street, tiles: run, districtId: d.id });
        }
      }

      // 블록 안쪽 채우기
      for (let y = y0; y <= b.maxY; y += pitchY) {
        for (let x = x0; x <= b.maxX; x += pitchX) {

          const inset = Math.ceil(streetW / 2) + 2;

            x: x + inset, y: y + inset,
            w: pitchX - inset * 2, h: pitchY - inset * 2,
          };
          const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;

          let inside = pointInPath(cx, cy, path) ? 1 : 0;
          for (const [px, py] of [[rect.x, rect.y], [rect.x + rect.w, rect.y],
            [rect.x, rect.y + rect.h], [rect.x + rect.w, rect.y + rect.h]]) {

          fillBlock(d, rect, rng, out);
        }
      }

    return out;

(function () {
  // 길에 사는 것들 — 지나가는 사람과 고양이.

  class Actors {
    constructor(map) {

        }

      const count = Math.min(NPC.perChunk, Math.floor(spots.length / 40));
      for (let i = 0; i < count; i++) {
        const idx = rng.pick(spots);
        out.push(this._make(cx, cy, idx, rng, 'npc'));

        kind, x, y, homeX: x, homeY: y,
        dir: 'down', anim: rng.range(0, 4), moving: false,
        seed: rng.int(0, 9999), speed: NPC.speed * rng.range(0.7, 1.25),
        targetX: x, targetY: y, wait: rng.range(0, 2.5),
        id: `${cx}:${cy}:${idx}:${kind}`,

    *visible(cx0, cy0, cx1, cy1) {

          const list = this.chunks.get(cx * 100000 + cy);
          if (list) for (const a of list) yield a;
        }
      }
    }

      for (const a of this.visible(cx0, cy0, cx1, cy1)) {
        a.anim += dt;

        const dx = a.targetX - a.x, dy = a.targetY - a.y;
        const dist = Math.hypot(dx, dy);

          a.targetY = a.homeY + rng.range(-r, r);

          a.moving = false;
          continue;

          const d = Math.hypot(a.x - x, a.y - y);

        }
      }

    }

// ── render/sprites.js ─────────────────────────────
(function () {
  // 절차적 스프라이트 생성 — 이 파일이 게임의 모든 그림을 만든다.
  //
  // 외부 이미지를 일절 쓰지 않는다. 전부 캔버스에 코드로 찍는다.
  // 나중에 진짜 도트 에셋으로 바꾸고 싶으면 이 파일만 갈아끼우면 된다.
  // 규칙: 모든 생성물은 시드에서 나오고, 한 번 만들면 캐시한다.

  const { TILE, GROUND, PROP, KIND, IN, BUILDING, PLAYER, SEED } = __M;
  const {
    GROUND_COLOR, GROUND_JITTER, PROP_COLOR, BUILDING_COLOR, INTERIOR_COLOR,
    PLAYER_COLOR, NPC_COLORS, shade, mix,
  } = __M;
  const { makeRng, noiseAt, seedOf } = __M;

  const S = TILE.size;
  // 간판 색 — 우리나라 상가 간판에 흔한 색들
  const SIGN_COLORS = ['#d4574a', '#e2b93b', '#3f7fbf', '#4f9a5a', '#e2782f',
    '#8f5aa8', '#2f2f38', '#d8607f'];
  const GROUND_VARIANTS = 6;   // 지면 종류마다 만들어 둘 변주 개수
  const S_TEX = seedOf(SEED, 'tex');

  // ── 캔버스 도구 ─────────────────────────────────────────────────────────
  function makeCanvas(w, h) {
    const c = typeof OffscreenCanvas !== 'undefined'
      ? new OffscreenCanvas(w, h)
      : Object.assign(document.createElement('canvas'), { width: w, height: h });
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    return { canvas: c, ctx };
  }

  // 도트 하나(또는 사각형) 찍기
  function px(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x | 0, y | 0, w | 0, h | 0);
  }

  // ── 지면 타일 ───────────────────────────────────────────────────────────
  const groundCache = new Map();

  // kind 와 variant 로 16x16 지면 타일 하나
  function groundTile(kind, variant) {
    const key = kind * 16 + variant;
    let hit = groundCache.get(key);
    if (hit) return hit;

    const { canvas, ctx } = makeCanvas(S, S);
    const base = GROUND_COLOR[kind] || '#ff00ff';
    const jitter = GROUND_JITTER[kind] || 0;
    const rng = makeRng(SEED, 'ground', kind, variant);

    px(ctx, 0, 0, S, S, base);
    // 얼룩 — 픽셀마다 밝기를 조금씩 흔든다
    for (let y = 0; y < S; y++) {
      for (let x = 0; x < S; x++) {
        const n = rng();
        if (n > 0.72) px(ctx, x, y, 1, 1, shade(base, jitter * (n - 0.72) * 3));
        else if (n < 0.2) px(ctx, x, y, 1, 1, shade(base, -jitter * (0.2 - n) * 3));
      }
    }

    switch (kind) {
      case GROUND.FIELD: { // 논 — 이랑 줄무늬
        const dark = shade(base, -0.12);
        for (let y = (variant % 2) ? 1 : 2; y < S; y += 4) px(ctx, 0, y, S, 1, dark);
        break;
      }
      case GROUND.GRASS: { // 풀 — 짧은 잎
        for (let i = 0; i < 10; i++) {
          const x = rng.int(0, S - 1), y = rng.int(0, S - 2);
          px(ctx, x, y, 1, 2, shade(base, 0.16));
        }
        break;
      }
      case GROUND.ROAD: { // 아스팔트 알갱이
        for (let i = 0; i < 22; i++) px(ctx, rng.int(0, S - 1), rng.int(0, S - 1), 1, 1,
          shade(base, rng.chance(0.5) ? 0.1 : -0.1));
        break;
      }
      case GROUND.ROAD_LINE: {
        // 우리나라 도로 중앙선은 노란색이다
        px(ctx, 0, 0, S, S, GROUND_COLOR[GROUND.ROAD]);
        px(ctx, 0, S / 2 - 1, S, 2, '#e0b63c');
        break;
      }
      case GROUND.SIDEWALK: { // 보도블럭 격자
        const line = shade(base, -0.14);
        for (let y = 0; y < S; y += 8) px(ctx, 0, y, S, 1, line);
        for (let x = (variant % 2) ? 0 : 4; x < S; x += 8) px(ctx, x, 0, 1, S, line);
        break;
      }
      case GROUND.CROSSWALK: {
        px(ctx, 0, 0, S, S, GROUND_COLOR[GROUND.ROAD]);
        px(ctx, 2, 0, 5, S, '#eeead8');
        px(ctx, 10, 0, 5, S, '#eeead8');
        break;
      }
      case GROUND.PLAZA: { // 포장 블럭
        const line = shade(base, -0.12);
        for (let y = 0; y < S; y += 4) px(ctx, 0, y, S, 1, line);
        for (let x = 0; x < S; x += 4) px(ctx, x, 0, 1, S, line);
        break;
      }
      case GROUND.WATER: { // 잔물결
        for (let i = 0; i < 4; i++) {
          const y = rng.int(1, S - 2), x = rng.int(0, S - 6);
          px(ctx, x, y, rng.int(3, 6), 1, shade(base, 0.22));
        }
        break;
      }
      case GROUND.SAND: {
        for (let i = 0; i < 14; i++) px(ctx, rng.int(0, S - 1), rng.int(0, S - 1), 1, 1,
          shade(base, -0.1));
        break;
      }
      case GROUND.PARKING: { // 주차 구획선 — 일부 타일에만 그린다
        if (variant % 3 === 0) px(ctx, 0, 1, 1, S - 2, shade(base, 0.3));
        for (let i = 0; i < 10; i++) px(ctx, rng.int(0, S - 1), rng.int(0, S - 1), 1, 1,
          shade(base, rng.chance(0.5) ? 0.06 : -0.06));
        break;
      }
      case GROUND.YARD: { // 공단 포장 마당
        for (let i = 0; i < 14; i++) px(ctx, rng.int(0, S - 1), rng.int(0, S - 1), 1, 1,
          shade(base, rng.chance(0.5) ? 0.07 : -0.07));
        if (variant % 4 === 0) px(ctx, 0, 0, S, 1, shade(base, -0.12));
        break;
      }
      case GROUND.TRACK: { // 산책로 — 자잘한 자갈
        for (let i = 0; i < 18; i++) px(ctx, rng.int(0, S - 1), rng.int(0, S - 1), 1, 1,
          shade(base, rng.chance(0.5) ? 0.12 : -0.12));
        break;
      }
      case GROUND.FLOOR: { // 건물 바닥 — 실제로는 거의 가려진다
        px(ctx, 0, 0, S, S, shade(base, -0.05));
        break;
      }
    }

    hit = canvas;
    groundCache.set(key, hit);
    return hit;
  }

  // 타일 좌표로 변주 고르기 — 같은 자리는 언제나 같은 모습
  function groundVariantAt(tx, ty) {
    return Math.floor(noiseAt(S_TEX, tx, ty) * GROUND_VARIANTS) % GROUND_VARIANTS;
  }

  // ── 소품 ────────────────────────────────────────────────────────────────
  const propCache = new Map();
  const PROP_H = 24; // 소품 캔버스 높이 (타일보다 커서 위로 삐져나온다)

  function propSprite(kind, variant) {
    const key = kind * 16 + variant;
    let hit = propCache.get(key);
    if (hit) return hit;

    const { canvas, ctx } = makeCanvas(S, PROP_H);
    const rng = makeRng(SEED, 'prop', kind, variant);
    const c = PROP_COLOR[kind] || {};
    const base = PROP_H; // 바닥선

    switch (kind) {
      case PROP.TREE: {
        const leaf = shade(c.leaf, rng.range(-0.08, 0.08));
        px(ctx, 7, base - 7, 2, 6, c.trunk);
        // 잎은 세 덩어리를 겹쳐 둥글게
        for (const [ox, oy, r] of [[8, base - 13, 6], [5, base - 11, 5], [11, base - 11, 5]]) {
          blob(ctx, ox, oy, r, leaf, rng);
        }
        blob(ctx, 6, base - 15, 3, c.leafHi, rng);
        break;
      }
      case PROP.BUSH: {
        blob(ctx, 8, base - 4, 5, c.leaf, rng);
        blob(ctx, 6, base - 6, 3, c.leafHi, rng);
        break;
      }
      case PROP.LAMP: {
        px(ctx, 7, base - 16, 2, 16, c.pole);
        px(ctx, 5, base - 20, 6, 4, c.head);
        px(ctx, 4, base - 18, 8, 1, shade(c.head, -0.3));
        break;
      }
      case PROP.BENCH: {
        px(ctx, 2, base - 6, 12, 3, c.wood);
        px(ctx, 2, base - 9, 12, 2, shade(c.wood, 0.1));
        px(ctx, 3, base - 3, 2, 3, c.leg);
        px(ctx, 11, base - 3, 2, 3, c.leg);
        break;
      }
      case PROP.SIGN: {
        px(ctx, 7, base - 12, 2, 12, c.pole);
        px(ctx, 2, base - 20, 12, 8, c.board);
        px(ctx, 4, base - 17, 8, 1, c.text);
        px(ctx, 4, base - 15, 6, 1, c.text);
        break;
      }
      case PROP.HYDRANT: {
        px(ctx, 6, base - 8, 4, 8, c.body);
        px(ctx, 5, base - 10, 6, 2, c.cap);
        px(ctx, 4, base - 6, 8, 2, shade(c.body, -0.2));
        break;
      }
      case PROP.PLANTER: {
        px(ctx, 4, base - 6, 8, 6, c.pot);
        blob(ctx, 8, base - 9, 4, c.leaf, rng);
        break;
      }
      case PROP.FENCE: {
        px(ctx, 0, base - 8, S, 2, c.wood);
        px(ctx, 0, base - 4, S, 2, c.wood);
        px(ctx, 2, base - 10, 2, 10, shade(c.wood, -0.15));
        px(ctx, 12, base - 10, 2, 10, shade(c.wood, -0.15));
        break;
      }
      case PROP.ROCK: {
        blob(ctx, 8, base - 4, 5, c.body, rng);
        px(ctx, 6, base - 7, 3, 2, c.hi);
        break;
      }
      case PROP.FLOWER: {
        const petal = c.petal[variant % c.petal.length];
        for (let i = 0; i < 3; i++) {
          const x = 3 + i * 5 + rng.int(0, 1), y = base - 4 - rng.int(0, 3);
          px(ctx, x, y + 2, 1, 3, c.stem);
          px(ctx, x - 1, y, 3, 2, petal);
        }
        break;
      }
      case PROP.VENDING: {
        px(ctx, 3, base - 14, 10, 14, c.body);
        px(ctx, 5, base - 12, 6, 7, c.glass);
        px(ctx, 5, base - 4, 6, 2, shade(c.body, -0.3));
        break;
      }
    }

    hit = canvas;
    propCache.set(key, hit);
    return hit;
  }

  // 둥근 덩어리 (도트라서 원 대신 계단식)
  function blob(ctx, cx, cy, r, color, rng) {
    ctx.fillStyle = color;
    for (let y = -r; y <= r; y++) {
      const w = Math.round(Math.sqrt(Math.max(0, r * r - y * y)));
      if (w <= 0) continue;
      const wobble = rng ? (rng.chance(0.25) ? -1 : 0) : 0;
      ctx.fillRect(cx - w, cy + y, w * 2 + wobble, 1);
    }
  }

  // ── 건물 ────────────────────────────────────────────────────────────────
  const buildingCache = new Map();
  const buildingOrder = [];
  const BUILDING_CACHE_MAX = 320;

  // 건물 높이(픽셀) — 층수에 비례하되 상한이 있다
  function wallHeight(b) {
    return Math.min(BUILDING.wallHeightMax, 8 + b.floors * BUILDING.wallHeightPerFloor);
  }

  // 건물 한 채를 통째로 그린 캔버스. 아래 끝이 건물 남쪽 벽에 맞는다.
  function buildingSprite(b) {
    const wh = wallHeight(b);
    const key = `${b.kind}|${b.w}|${b.h}|${b.floors}|${b.seed}|${b.door.dir}`;
    let hit = buildingCache.get(key);
    if (hit) return hit;

    const pw = b.w * S, ph = b.h * S + wh;
    const { canvas, ctx } = makeCanvas(pw, ph);
    let col = BUILDING_COLOR[b.kind] || BUILDING_COLOR[KIND.SHOP];
    // 비닐하우스는 흰 비닐이 씌워져 있다
    if (b.name && b.name.includes('비닐하우스')) {
      col = { wall: '#e8eeea', roof: '#dfe6e2', trim: '#b8c4bc', accent: '#cfe0d8' };
    }
    const rng = makeRng(SEED, 'sprite', b.seed, b.kind);
    // 같은 종류라도 채마다 색을 조금씩 흔든다
    const wall = shade(col.wall, rng.range(-0.06, 0.06));
    const roof = shade(col.roof, rng.range(-0.07, 0.07));
    const trim = col.trim;
    const roofH = b.h * S;

    // 옥상
    px(ctx, 0, 0, pw, roofH, roof);
    px(ctx, 0, 0, pw, 1, shade(roof, 0.18));
    px(ctx, 0, roofH - 1, pw, 1, shade(roof, -0.2));
    drawRoofDetail(ctx, b, pw, roofH, roof, trim, col, rng);

    // 앞벽
    px(ctx, 0, roofH, pw, wh, wall);
    px(ctx, 0, roofH, pw, 1, shade(wall, 0.2));
    px(ctx, 0, ph - 2, pw, 2, shade(wall, -0.28));
    px(ctx, 0, roofH, 1, wh, shade(wall, -0.12));
    px(ctx, pw - 1, roofH, 1, wh, shade(wall, -0.12));

    drawWindows(ctx, b, pw, roofH, wh, wall, col, rng);
    drawFrontDoor(ctx, b, pw, roofH, wh, col, rng);

    hit = canvas;
    buildingCache.set(key, hit);
    buildingOrder.push(key);
    if (buildingOrder.length > BUILDING_CACHE_MAX) {
      buildingCache.delete(buildingOrder.shift());
    }
    return hit;
  }

  function drawRoofDetail(ctx, b, pw, roofH, roof, trim, col, rng) {
    const dark = shade(roof, -0.16), light = shade(roof, 0.12);
    switch (b.kind) {
      case KIND.APARTMENT: case KIND.TOWER: {
        // 옥상 난간
        px(ctx, 1, 1, pw - 2, 2, light);
        px(ctx, 1, roofH - 3, pw - 2, 2, dark);
        px(ctx, 1, 1, 2, roofH - 3, shade(roof, 0.06));
        px(ctx, pw - 3, 1, 2, roofH - 3, shade(roof, -0.06));
        // 계단탑과 엘리베이터 기계실 — 세대 라인마다 하나씩 올라온다
        const towerStep = 42;
        for (let x = 8; x < pw - 16; x += towerStep) {
          const ty = Math.floor(roofH * 0.34);
          px(ctx, x, ty, 13, 10, shade(roof, -0.26));
          px(ctx, x + 1, ty + 1, 11, 3, light);
          px(ctx, x + 3, ty + 10, 7, 2, shade(roof, -0.34));
        }
        // 물탱크
        if (pw > 60) {
          const wx = pw - 22;
          px(ctx, wx, 6, 14, 9, shade(roof, -0.2));
          px(ctx, wx + 1, 7, 12, 3, light);
        }
        break;
      }
      case KIND.HOUSE: case KIND.FARMHOUSE: {
        // 경사 지붕 — 가운데 용마루
        const mid = Math.floor(roofH / 2);
        px(ctx, 0, 0, pw, mid, shade(roof, 0.1));
        px(ctx, 0, mid, pw, roofH - mid, dark);
        px(ctx, 0, mid - 1, pw, 2, shade(roof, -0.35));
        break;
      }
      case KIND.FACTORY: case KIND.WAREHOUSE: {
        // 톱날 지붕 + 환기구
        for (let x = 2; x < pw - 4; x += 10) {
          px(ctx, x, 2, 6, roofH - 5, dark);
          px(ctx, x, 2, 6, 2, col.accent);
        }
        break;
      }
      case KIND.SCHOOL: case KIND.PUBLIC: case KIND.HOSPITAL: {
        px(ctx, 2, 2, pw - 4, roofH - 5, shade(roof, -0.08));
        px(ctx, 4, 4, pw - 8, 1, light);
        if (b.kind === KIND.HOSPITAL) { // 옥상 적십자
          const cx = Math.floor(pw / 2), cy = Math.floor(roofH / 2);
          px(ctx, cx - 2, cy - 6, 5, 13, col.accent);
          px(ctx, cx - 6, cy - 2, 13, 5, col.accent);
        }
        break;
      }
      case KIND.CHURCH: {
        const cx = Math.floor(pw / 2), cy = Math.floor(roofH / 2);
        px(ctx, cx - 1, cy - 8, 3, 16, col.accent);
        px(ctx, cx - 5, cy - 4, 11, 3, col.accent);
        break;
      }
      case KIND.STATION: {
        // 유리 캐노피
        for (let x = 2; x < pw - 2; x += 6) px(ctx, x, 2, 4, roofH - 5, shade(roof, 0.16));
        px(ctx, 0, roofH - 4, pw, 2, col.accent);
        break;
      }
      case KIND.MART: {
        px(ctx, 3, 3, pw - 6, roofH - 7, shade(roof, -0.1));
        for (let x = 6; x < pw - 6; x += 12) px(ctx, x, 6, 8, 6, dark); // 실외기
        break;
      }
      default: {
        // 상가 옥상 — 난간, 실외기 줄, 물탱크, 옥상 출입문
        px(ctx, 1, 1, pw - 2, roofH - 3, shade(roof, -0.05));
        px(ctx, 1, 1, pw - 2, 1, light);
        px(ctx, 1, roofH - 3, pw - 2, 1, dark);
        for (let x = 5; x < pw - 8; x += 11) {
          if (!rng.chance(0.55)) continue;
          px(ctx, x, 5, 7, 5, shade(roof, -0.2));
          px(ctx, x + 1, 6, 5, 3, shade(roof, 0.1));
        }
        if (roofH > 26) {
          px(ctx, pw - 14, roofH - 14, 9, 8, dark);       // 옥상 출입문
          px(ctx, pw - 12, roofH - 12, 5, 5, shade(roof, 0.2));
        }
        if (roofH > 20 && rng.chance(0.6)) {
          px(ctx, 4, roofH - 13, 8, 7, shade(roof, -0.28)); // 물탱크
          px(ctx, 5, roofH - 12, 6, 2, light);
        }
      }
    }
  }

  function drawWindows(ctx, b, pw, roofH, wh, wall, col, rng) {
    if (b.kind === KIND.APARTMENT) return drawApartmentFace(ctx, b, pw, roofH, wh, wall, col, rng);
    if (b.kind === KIND.FARMHOUSE && b.w < 6) return;
    const glass = shade(col.accent, rng.range(-0.05, 0.1));
    const rows = Math.max(1, Math.min(4, Math.floor((wh - 8) / 9)));
    const step = b.kind === KIND.FACTORY || b.kind === KIND.WAREHOUSE ? 14 : 9;
    for (let r = 0; r < rows; r++) {
      const y = roofH + 4 + r * 9;
      if (y + 5 > roofH + wh - 3) break;
      for (let x = 4; x < pw - 6; x += step) {
        if (rng.chance(0.12)) continue; // 불 꺼진 창
        px(ctx, x, y, 5, 5, glass);
        px(ctx, x, y, 5, 1, shade(glass, 0.25));
        px(ctx, x, y + 4, 5, 1, shade(glass, -0.25));
      }
    }
    // 상가는 1층에 간판띠. 색은 건물마다 다르다 (실제 간판이 그렇듯)
    if ((b.kind === KIND.SHOP || b.kind === KIND.MART) && wh > 14) {
      const sign = b.kind === KIND.MART ? col.accent : rng.pick(SIGN_COLORS);
      const y = roofH + wh - 14;
      px(ctx, 1, y, pw - 2, 5, sign);
      px(ctx, 1, y, pw - 2, 1, shade(sign, 0.25));
      for (let x = 3; x < pw - 5; x += 4) px(ctx, x, y + 2, 2, 1, '#fffdf2');
      // 위층에도 간판이 하나씩 붙는다
      if (wh > 26 && rng.chance(0.7)) {
        const y2 = roofH + wh - 26;
        const sign2 = rng.pick(SIGN_COLORS);
        px(ctx, 2, y2, Math.max(6, pw - 8), 4, sign2);
        for (let x = 4; x < pw - 8; x += 4) px(ctx, x, y2 + 1, 2, 1, '#fffdf2');
      }
    }
  }

  // 아파트 앞면 — 세대 구획선과 발코니 띠, 그 사이 창문
  function drawApartmentFace(ctx, b, pw, roofH, wh, wall, col, rng) {
    const unit = 22;                    // 세대 하나의 폭(픽셀)
    const glass = shade(col.accent, rng.range(-0.04, 0.08));
    const line = shade(wall, -0.16);
    const rows = Math.max(2, Math.floor((wh - 6) / 8));

    for (let r = 0; r < rows; r++) {
      const y = roofH + 3 + r * 8;
      if (y + 6 > roofH + wh - 3) break;
      // 발코니 난간 띠
      px(ctx, 1, y + 5, pw - 2, 1, line);
      for (let x = 3; x < pw - 6; x += unit) {
        px(ctx, x, y, 8, 5, glass);
        px(ctx, x, y, 8, 1, shade(glass, 0.22));
        px(ctx, x + 10, y + 1, 6, 4, shade(glass, -0.12)); // 작은방 창
      }
    }
    // 세대 사이 벽선
    for (let x = 0; x < pw; x += unit) px(ctx, x, roofH + 1, 1, wh - 3, line);
    // 1층 출입구 캐노피
    const dx = Math.max(2, Math.min(pw - 16, (b.door.x - b.x) * S));

// ── render/camera.js ─────────────────────────────
(function () {
  // 카메라 — 플레이어를 부드럽게 따라가고 지도 밖을 비추지 않는다.

  const { CAMERA, TILE } = __M;
  const { WORLD_PX_W, WORLD_PX_H } = __M;

  class Camera {
    constructor() {
      this.x = 0; this.y = 0;      // 화면 중앙이 보는 월드 좌표(픽셀)
      this.zoom = CAMERA.zoom;
      this.viewW = 0; this.viewH = 0; // 화면 크기(월드 픽셀 기준)
    }

    resize(cssW, cssH) {
      this.viewW = cssW / this.zoom;
      this.viewH = cssH / this.zoom;
    }

    setZoom(z, cssW, cssH) {
      this.zoom = Math.max(CAMERA.zoomMin, Math.min(CAMERA.zoomMax, Math.round(z)));
      this.resize(cssW, cssH);
    }

    // 목표를 따라간다. bounds 를 주면 그 안으로 가둔다 (실내는 실내 크기로).
    follow(tx, ty, dt, bounds) {
      const dx = tx - this.x, dy = ty - this.y;
      const dist = Math.hypot(dx, dy);
      if (dist > CAMERA.deadzone) {
        const t = 1 - Math.pow(1 - CAMERA.lerp, dt * 60);
        this.x += dx * t;
        this.y += dy * t;
      }
      this.clamp(bounds);
    }

    snap(tx, ty, bounds) {
      this.x = tx; this.y = ty;
      this.clamp(bounds);
    }

    clamp(bounds) {
      const w = bounds ? bounds.w : WORLD_PX_W;
      const h = bounds ? bounds.h : WORLD_PX_H;
      const halfW = this.viewW / 2, halfH = this.viewH / 2;
      this.x = w <= this.viewW ? w / 2 : Math.max(halfW, Math.min(w - halfW, this.x));
      this.y = h <= this.viewH ? h / 2 : Math.max(halfH, Math.min(h - halfH, this.y));
    }

    // 화면 왼쪽 위가 보는 월드 좌표. 정수로 맞춰 도트가 흔들리지 않게 한다.
    get left() { return Math.round(this.x - this.viewW / 2); }
    get top() { return Math.round(this.y - this.viewH / 2); }

    worldToScreen(wx, wy) {
      return [(wx - this.left) * this.zoom, (wy - this.top) * this.zoom];
    }

    // 지금 보이는 타일 범위
    visibleTiles(pad = 1) {
      return {
        x0: Math.floor(this.left / TILE.size) - pad,
        y0: Math.floor(this.top / TILE.size) - pad,
        x1: Math.ceil((this.left + this.viewW) / TILE.size) + pad,
        y1: Math.ceil((this.top + this.viewH) / TILE.size) + pad,
      };
    }
  }

  __M.Camera = Camera;
})();

            if (seen.has(b.id)) continue;
            seen.add(b.id);
            const alpha = this.buildingAlpha(b, state.player, state.dt || 0.016);
            if (alpha < 0.95) hidden = true;
            items.push({ base: (b.y + b.h) * S, draw: () => this.drawBuilding(ctx, b, alpha) });
          }
        }
      }
      for (const g of state.outdoorGizmos) {
        if (g.tx < view.x0 || g.tx > view.x1 || g.ty < view.y0 || g.ty > view.y1) continue;
        items.push({
          base: (g.ty + 1) * S,
          draw: () => ctx.drawImage(gizmoSprite(g.icon, state.game.used.has(g.id)), g.tx * S, g.ty * S),
        });
      }
      for (const a of state.actors.visible(cx0, cy0, cx1, cy1)) {
        items.push({ base: a.y, draw: () => this.drawActor(ctx, a) });
      }
      items.push({ base: state.player.y, draw: () => this.drawPlayer(ctx, state.player) });

      items.sort((a, b) => a.base - b.base);
      for (const it of items) it.draw();

      // 건물 뒤에 있으면 반투명 지붕 위로 한 번 더 그려 준다 — 자기 위치를 놓치지 않게
      if (hidden) {
        ctx.globalAlpha = 0.9;
        this.drawPlayer(ctx, state.player);
        ctx.globalAlpha = 1;
      }

      ctx.restore();
    }

    drawBuilding(ctx, b, alpha = 1) {
      const sprite = buildingSprite(b);
      const wh = wallHeight(b);
      // 출입구 발판은 건물보다 먼저 (땅에 깔린 것)
      ctx.drawImage(doorMatSprite(), b.door.x * S, b.door.y * S);
      ctx.globalAlpha = RENDER.shadowAlpha * alpha;
      ctx.fillStyle = '#000000';
      ctx.fillRect(b.x * S + 2, (b.y + b.h) * S - 2, b.w * S, 4);
      ctx.globalAlpha = alpha;
      ctx.drawImage(sprite, b.x * S, b.y * S - wh);
      // 반투명해진 건물은 윤곽선을 남겨 어디까지가 건물인지 알 수 있게 한다
      if (alpha < 0.95) {
        const edge = (1 - alpha);
        ctx.globalAlpha = edge * 0.9;
        ctx.strokeStyle = UI_COLOR.labelShadow;
        ctx.lineWidth = 1;
        ctx.strokeRect(b.x * S + 0.5, b.y * S - wh + 0.5, b.w * S - 1, b.h * S + wh - 1);
        ctx.globalAlpha = edge * 0.5;
        ctx.strokeStyle = UI_COLOR.label;
        ctx.strokeRect(b.x * S + 1.5, b.y * S - wh + 1.5, b.w * S - 3, b.h * S + wh - 3);
      }
      ctx.globalAlpha = 1;
    }

    drawActor(ctx, a) {
      const sheet = a.kind === 'cat' ? null : npcSheet(a.seed);
      if (!sheet) {
        ctx.drawImage(catSprite(a.seed % 3), Math.round(a.x - 7), Math.round(a.y - 10));
        return;
      }
      drawFromSheet(ctx, sheet, a.x, a.y, a.dir, a.moving ? a.anim : 0);
    }

    drawPlayer(ctx, p) {
      drawFromSheet(ctx, playerSheet_(), p.x, p.y, p.dir, p.moving ? p.anim : 0);
    }

    // ── 실내 ──────────────────────────────────────────────────────
    drawInterior(ctx, cam, state) {
      const it = state.interior;
      ctx.save();
      ctx.scale(cam.zoom, cam.zoom);
      ctx.translate(-cam.left, -cam.top);

      // 실내 바깥은 어둡게
      ctx.fillStyle = INTERIOR_COLOR[IN.VOID];
      ctx.fillRect(cam.left - S, cam.top - S, cam.viewW + S * 2, cam.viewH + S * 2);

      const x0 = Math.max(0, Math.floor(cam.left / S) - 1);
      const y0 = Math.max(0, Math.floor(cam.top / S) - 1);
      const x1 = Math.min(it.w - 1, Math.ceil((cam.left + cam.viewW) / S));
      const y1 = Math.min(it.h - 1, Math.ceil((cam.top + cam.viewH) / S));

      for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
          const t = it.tiles[y * it.w + x];
          if (t === IN.VOID) continue;
          // 벽·가구 아래에도 바닥을 먼저 깔아 둔다
          if (t !== IN.FLOOR && t !== IN.WALL) {
            ctx.drawImage(interiorTile(IN.FLOOR, (x + y) % 3), x * S, y * S);
          }
          ctx.drawImage(interiorTile(t, (x * 3 + y) % 3), x * S, y * S);
        }
      }

      for (const g of state.interiorGizmos) {
        ctx.drawImage(gizmoSprite(g.icon, state.game.used.has(g.id)), g.tx * S, g.ty * S - 4);
      }

      this.drawPlayer(ctx, state.player);

      // 방 이름 — 방 한가운데 옅게
      ctx.font = `${8}px ${'monospace'}`;
      ctx.restore();
    }
  }

  // 스프라이트 시트에서 한 칸 꺼내 그리기
  function drawFromSheet(ctx, sheet, x, y, dir, animTime) {
    const d = Math.max(0, sheet.dirs.indexOf(dir));
    const frame = animTime > 0
      ? Math.floor(animTime * PLAYER.animFps) % sheet.frames
      : 0;
    ctx.drawImage(sheet.canvas,
      frame * sheet.w, d * sheet.h, sheet.w, sheet.h,
      Math.round(x - sheet.w / 2), Math.round(y - sheet.h + 3), sheet.w, sheet.h);
  }

  __M.Scene = Scene;
})();

// ── ui/labels.js ─────────────────────────────
(function () {
  // 건물 이름표. 가까운 것부터, 화면당 정해진 개수만 그린다.

  const { TILE, RENDER, UI } = __M;
  const { UI_COLOR } = __M;
  const { wallHeight } = __M;

  const S = TILE.size;

  // 공용 글자 그리기 (그림자 있는 도트 느낌)
  function drawText(ctx, text, x, y, opts = {}) {
    const size = opts.size || UI.hudSize;
    ctx.font = `${opts.bold ? 'bold ' : ''}${size}px ${UI.font}`;
    ctx.textAlign = opts.align || 'left';
    ctx.textBaseline = opts.baseline || 'alphabetic';
    if (opts.shadow !== false) {
      ctx.fillStyle = opts.shadowColor || UI_COLOR.labelShadow;
      ctx.fillText(text, x + 1, y + 1);
      ctx.fillText(text, x - 1, y + 1);
      ctx.fillText(text, x + 1, y - 1);
      ctx.fillText(text, x - 1, y - 1);
    }
    ctx.fillStyle = opts.color || UI_COLOR.text;
    ctx.fillText(text, x, y);
  }

  function textWidth(ctx, text, size) {
    ctx.font = `${size || UI.hudSize}px ${UI.font}`;
    return ctx.measureText(text).width;
  }

  // 바깥 — 건물 이름
  function drawBuildingLabels(ctx, cam, map, player) {
    const view = cam.visibleTiles(0);
    const cx0 = Math.floor(view.x0 / TILE.chunk), cx1 = Math.floor(view.x1 / TILE.chunk);
    const cy0 = Math.floor(view.y0 / TILE.chunk), cy1 = Math.floor(view.y1 / TILE.chunk);

    const seen = new Set();
    const cands = [];
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        if (cx < 0 || cy < 0) continue;
        for (const b of map.chunk(cx, cy).buildings) {
          if (seen.has(b.id)) continue;
          seen.add(b.id);
          const bx = (b.x + b.w / 2) * S, by = b.y * S;
          const d = Math.hypot(bx - player.x, by - player.y);
          if (d > RENDER.labelMaxDistance && !b.landmark) continue;
          cands.push({ b, d, bx, by });
        }
      }
    }
    // 랜드마크 먼저, 그다음 가까운 순
    cands.sort((a, b) => (b.b.landmark - a.b.landmark) || (a.d - b.d));

    for (const c of cands.slice(0, RENDER.labelMax)) {
      const [sx, sy] = cam.worldToScreen(c.bx, c.by - wallHeight(c.b) - 4);
      if (sx < -80 || sy < -20) continue;
      // 글자 뒤에 옅은 칩을 깔아 배경과 섞이지 않게 한다
      const w = textWidth(ctx, c.b.name, UI.labelSize) + 10;
      ctx.fillStyle = 'rgba(24, 22, 30, 0.42)';
      ctx.fillRect(sx - w / 2, sy - UI.labelSize - 1, w, UI.labelSize + 6);
      drawText(ctx, c.b.name, sx, sy, {
        size: UI.labelSize,
        align: 'center',
        color: c.b.landmark ? UI_COLOR.labelLandmark : UI_COLOR.label,
      });
    }
  }

  // 실내 — 방 이름
  function drawRoomLabels(ctx, cam, interior) {
    for (const room of interior.rooms) {
      const wx = (room.x + room.w / 2) * S, wy = (room.y + 1) * S;
      const [sx, sy] = cam.worldToScreen(wx, wy);
      if (sx < -60 || sy < -20 || sx > ctx.canvas.width + 60 || sy > ctx.canvas.height + 20) continue;
      drawText(ctx, room.name, sx, sy, {
        size: UI.labelSize, align: 'center', color: UI_COLOR.label,
      });
    }
  }

  __M.drawText = drawText; __M.textWidth = textWidth; __M.drawBuildingLabels = drawBuildingLabels; __M.drawRoomLabels = drawRoomLabels;
})();

(function () {

  function bakeOverview(overview) {
    const { canvas, ctx } = makeCanvas(overview.w, overview.h);
    const img = ctx.createImageData(overview.w, overview.h);
    for (let i = 0; i < overview.data.length; i++) {
      const hex = GROUND_COLOR[overview.data[i]] || '#000000';
      const v = parseInt(hex.slice(1), 16);
      img.data[i * 4] = (v >> 16) & 255;
      img.data[i * 4 + 1] = (v >> 8) & 255;
      img.data[i * 4 + 2] = v & 255;

      color: late ? '#e2705f' : UI_COLOR.text });
    drawText(ctx, late ? '지각' : `출근 ${fmt(GAME.deadline - g.clock)} 전`, 92, 32,
      { size: 12, color: late ? '#e2705f' : UI_COLOR.textDim });

    const dist = state.goalPoint
      ? Math.hypot(state.goalPoint.x - state.player.x, state.goalPoint.y - state.player.y)
      : 0;
    const km = (dist / TILE.size) * GEO.metersPerTile / 1000;
    drawText(ctx, `→ ${GAME.goalName} ${km < 0.15 ? '도착' : km.toFixed(1) + 'km'}`, 92, 50,
      { size: 12, color: UI_COLOR.accent });

    // ── 오른쪽 위: 지금 있는 곳 ────────────────────────────────
    const place = state.placeName || '';
    if (place) {
      const w = textWidth(ctx, place, 14) + 28;
      panel(ctx, W - w - 12, 12, w, 32);
      drawText(ctx, place, W - 24, 33, { size: 14, align: 'right' });

    if (state.prompt) {
      const text = state.prompt;
      const w = textWidth(ctx, text, 14) + 36;
      panel(ctx, (W - w) / 2, H - 76, w, 34);

    if (W >= 640) {
      drawText(ctx, 'H 도움말 · M 지도 · F 전체화면 · L 엔딩 목록', W - 58, H - 16,
        { size: 11, align: 'right', color: 'rgba(255,255,255,0.5)', shadow: false });
    }

    // 플레이어 주변만 잘라서 보여 준다
    const pxT = state.player.x / S / scale, pyT = state.player.y / S / scale;

      ['미니맵', 'M'],
      ['엔딩 목록', 'L'],

    panel(ctx, x, y, boxW, boxH);

    drawText(ctx, '〈구래〉', x + boxW / 2, y + 52, { size: 28, align: 'center', bold: true });
    drawText(ctx, '구래동에서 양촌공단까지, 걸어서 출근하기.', x + boxW / 2, y + 78,
      { size: 13, align: 'center', color: UI_COLOR.textDim });
    drawText(ctx, '무엇을 건드리느냐로 결말이 갈린다.', x + boxW / 2, y + 98,

    let ly = y + 134;

  }

// ── game/state.js ─────────────────────────────
(function () {
  // 게임 진행 상태 — 시계, 플래그, 발견한 엔딩.
  // "무엇을 건드렸는가" 가 전부다. 엔딩은 이 상태만 보고 결정된다.

  const { GAME, SAVE } = __M;

  class GameState {
    constructor() {
      this.clock = GAME.startClock;     // 게임 내 시각(초)
      this.flags = new Set();           // 건드린 것들
      this.counters = {};               // 횟수를 세는 것들 (고양이 등)
      this.log = [];                    // 무엇을 언제 건드렸는지 (엔딩 화면에 보여 준다)
      this.used = new Set();            // 한 번만 되는 물건
      this.ending = null;               // 결말이 나면 채워진다
      this.startedAt = Date.now();
      this.found = loadFound();         // 지금까지 본 엔딩 (localStorage)
    }

    tick(dt) {
      if (this.ending) return;
      this.clock += dt * GAME.timeScale;
    }

    has(flag) { return this.flags.has(flag); }
    count(key) { return this.counters[key] || 0; }

    set(flag, note) {
      if (!this.flags.has(flag)) {
        this.flags.add(flag);
        if (note) this.log.push({ t: this.clock, note });
      }
    }

    bump(key, n = 1) { this.counters[key] = (this.counters[key] || 0) + n; }

    get late() { return this.clock > GAME.deadline; }
    get touched() { return this.flags.size; }

    clockText() {
      const t = Math.floor(this.clock) % 86400;
      const hh = String(Math.floor(t / 3600)).padStart(2, '0');
      const mm = String(Math.floor((t % 3600) / 60)).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    discover(id) {
      this.found.add(id);
      saveFound(this.found);
    }
  }

  function loadFound() {
    try {
      const raw = localStorage.getItem(SAVE.key);
      if (!raw) return new Set();
      return new Set(JSON.parse(raw).found || []);
    } catch (e) {
      return new Set(); // 저장이 막힌 환경에서도 게임은 돌아간다
    }
  }

  function saveFound(found) {
    try {
      localStorage.setItem(SAVE.key, JSON.stringify({ found: [...found] }));
    } catch (e) { /* 저장 못 해도 그만 */ }
  }

  __M.GameState = GameState;
})();

(function () {
  // 결말 화면과 엔딩 목록.

    const W = ctx.canvas.width, H = ctx.canvas.height;
    const e = state.game.ending;
    const g = state.game;

    ctx.fillStyle = 'rgba(10, 9, 13, 0.92)';
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2;
    let y = Math.max(90, H / 2 - 150);

    drawText(ctx, `${TAG_LABEL[e.tag]} 끝났다`, cx, y - 40,
      { size: 13, align: 'center', color: UI_COLOR.textDim });
    drawText(ctx, e.title, cx, y, { size: 34, align: 'center', bold: true, color: TAG_COLOR[e.tag] });
    drawText(ctx, `${e.id} · ${g.clockText()}`, cx, y + 26,
      { size: 12, align: 'center', color: UI_COLOR.textDim });

    y += 66;
    for (const line of e.lines) {
      drawText(ctx, line, cx, y, { size: 15, align: 'center' });
      y += 26;
    }

    // 이 판에 건드린 것들
    y += 16;
    if (g.log.length) {
      drawText(ctx, `건드린 것 ${g.log.length}가지`, cx, y,
        { size: 12, align: 'center', color: UI_COLOR.accent });
      y += 20;
      const notes = g.log.slice(-6).map((l) => l.note);
      for (const note of notes) {
        drawText(ctx, `· ${note}`, cx, y, { size: 12, align: 'center', color: UI_COLOR.textDim });
        y += 18;
      }
    } else {
      drawText(ctx, '아무것도 건드리지 않았다', cx, y,
        { size: 12, align: 'center', color: UI_COLOR.textDim });
      y += 20;
    }

    y += 14;
    drawText(ctx, `찾은 결말 ${g.found.size} / ${ENDING_COUNT}`, cx, y,
      { size: 14, align: 'center', color: UI_COLOR.accent });
    drawText(ctx, 'R 다시 시작 · L 엔딩 목록', cx, y + 30,
      { size: 13, align: 'center', color: UI_COLOR.textDim });
  }

  // 지금까지 본 결말 목록
  function drawGallery(ctx, state) {
    const W = ctx.canvas.width, H = ctx.canvas.height;
    const found = state.game.found;

    ctx.fillStyle = 'rgba(10, 9, 13, 0.94)';
    ctx.fillRect(0, 0, W, H);
    drawText(ctx, `엔딩 ${found.size} / ${ENDING_COUNT}`, W / 2, 46,
      { size: 22, align: 'center', bold: true });
    drawText(ctx, '못 본 결말에는 힌트가 붙어 있다', W / 2, 68,
      { size: 12, align: 'center', color: UI_COLOR.textDim });

    const cols = W >= 1000 ? 3 : W >= 680 ? 2 : 1;
    const cardW = Math.min(320, (W - 60) / cols - 12);
    const cardH = 54;
    const startX = (W - (cardW * cols + 12 * (cols - 1))) / 2;
    let top = 92;
    const rows = Math.ceil(ENDINGS.length / cols);
    const maxRows = Math.floor((H - top - 60) / (cardH + 8));
    const scale = rows > maxRows ? (H - top - 60) / (rows * (cardH + 8)) : 1;

    ENDINGS.forEach((e, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const x = startX + col * (cardW + 12);
      const y = top + row * (cardH + 8) * scale;
      const h = cardH * scale;
      const got = found.has(e.id);
      ctx.fillStyle = got ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)';
      ctx.fillRect(x, y, cardW, h);
      ctx.fillStyle = got ? TAG_COLOR[e.tag] : 'rgba(255,255,255,0.12)';
      ctx.fillRect(x, y, 3, h);
      drawText(ctx, e.id, x + 12, y + 20 * scale,
        { size: 11 * scale, color: UI_COLOR.textDim, shadow: false });
      drawText(ctx, got ? e.title : '？？？', x + 44, y + 21 * scale,
        { size: 14 * scale, color: got ? UI_COLOR.text : UI_COLOR.textDim, shadow: false });
      drawText(ctx, got ? e.lines[0] : e.hint, x + 12, y + 40 * scale,
        { size: 11 * scale, color: got ? UI_COLOR.textDim : 'rgba(255,255,255,0.32)', shadow: false });
    });

    drawText(ctx, 'L 로 닫기', W / 2, H - 24,
      { size: 12, align: 'center', color: UI_COLOR.textDim });
  }

  __M.drawEnding = drawEnding; __M.drawGallery = drawGallery;

(function () {
  // 전체화면. 브라우저마다 이름이 조금씩 달라서 한 겹 감싼다.

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function toggleFullscreen(el) {
    if (isFullscreen()) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
      return false;
    }
    const target = el || document.documentElement;
    const req = target.requestFullscreen || target.webkitRequestFullscreen;
    if (req) req.call(target);
    return true;
  }

  // 화면 크기가 바뀌면 알려 준다
  function onFullscreenChange(handler) {
    document.addEventListener('fullscreenchange', handler);
    document.addEventListener('webkitfullscreenchange', handler);
  }

  __M.isFullscreen = isFullscreen; __M.toggleFullscreen = toggleFullscreen; __M.onFullscreenChange = onFullscreenChange;
})();

    const speed = PLAYER.walkSpeed * (running ? PLAYER.runMultiplier : 1);
    const len = Math.hypot(dx, dy) || 1;
    const vx = (dx / len) * speed * dt, vy = (dy / len) * speed * dt;

    if (Math.abs(dx) > Math.abs(dy)) p.dir = dx > 0 ? 'right' : 'left';
    else if (dy !== 0) p.dir = dy > 0 ? 'down' : 'up';

    p.anim += dt * (running ? 1.6 : 1);

    if (!blocked(p.x + vx, p.y)) p.x += vx;
    if (!blocked(p.x, p.y + vy)) p.y += vy;
  }

  // 발밑 상자로 충돌을 본다
  function blocked(x, y) {
    const hw = PLAYER.width / 2, hh = PLAYER.height;
    const corners = [
      [x - hw, y - hh], [x + hw, y - hh], [x - hw, y], [x + hw, y],
    ];
    for (const [cx, cy] of corners) {
      const tx = Math.floor(cx / S), ty = Math.floor(cy / S);
      if (state.mode === 'interior') {
        if (state.interior.isSolid(tx, ty)) return true;
      } else if (map.isSolid(tx, ty)) return true;
    }
    return false;
  }

  // ── 상호작용 ────────────────────────────────────────────────────────────
  function nearestOutdoorTarget() {
    const p = state.player;
    const ptx = Math.floor(p.x / S), pty = Math.floor(p.y / S);

    // 물건
    for (const g of state.outdoorGizmos) {
      const d = Math.hypot((g.tx + 0.5) * S - p.x, (g.ty + 0.5) * S - p.y);
      if (d < GAME.interactRadius && !(g.once && state.game.used.has(g.id))) {
        return { type: 'gizmo', gizmo: g, label: g.name };
      }
    }
    // 고양이
    const cat = actors.nearestCat(p.x, p.y, GAME.petRadius);
    if (cat && !state.game.used.has('cat:' + cat.id)) {
      return { type: 'cat', cat, label: '고양이' };
    }
    // 건물 출입구
    let best = null, bestD = BUILDING.enterRadius;
    for (const b of buildings.index.query(ptx - 3, pty - 3, ptx + 3, pty + 3)) {
      const d = Math.hypot((b.door.x + 0.5) * S - p.x, (b.door.y + 0.5) * S - p.y);
      if (d < bestD) { bestD = d; best = b; }
    }
    if (best && state.exitCooldown <= 0) {
      return { type: 'enter', building: best, label: best.name };
    }
    return null;
  }

  function nearestInteriorTarget() {
    const p = state.player;
    const tx = Math.floor(p.x / S), ty = Math.floor(p.y / S);
    const it = state.interior;

    for (const g of state.interiorGizmos) {
      const d = Math.hypot((g.tx + 0.5) * S - p.x, (g.ty + 0.5) * S - p.y);
      if (d < GAME.interactRadius && !(g.once && state.game.used.has(g.id))) {
        return { type: 'gizmo', gizmo: g, label: g.name };
      }
    }
    const here = it.tileAt(tx, ty);
    if (here === IN.EXIT) return { type: 'exit', label: '나가기' };
    if (here === IN.STAIR_UP) return { type: 'stair', delta: 1, label: '올라가기' };
    if (here === IN.STAIR_DOWN) return { type: 'stair', delta: -1, label: '내려가기' };
    if (here === IN.ELEVATOR) return { type: 'elevator', label: '엘리베이터' };
    return null;
  }

  function updatePrompt() {
    const t = state.mode === 'outdoor' ? nearestOutdoorTarget() : nearestInteriorTarget();
    state.target = t;
    if (!t) { state.prompt = ''; return; }
    const verb = t.type === 'enter' ? '들어가기'
      : t.type === 'exit' ? '나가기'
      : t.type === 'cat' ? '쓰다듬기'
      : t.type === 'stair' ? t.label
      : t.type === 'elevator' ? '층 고르기'
      : '만지기';
    state.prompt = `Space  ${verb} — ${t.label}`;
  }

  function interact() {
    const t = state.target;
    if (!t) return;
    switch (t.type) {
      case 'enter': return enterBuilding(t.building);
      case 'exit': return exitBuilding();
      case 'stair': return changeFloor(nextFloor(state.floor, t.delta));
      case 'elevator': return openPicker();
      case 'cat': return petCat(t.cat);
      case 'gizmo': return useGizmo(t.gizmo);
    }
  }

  function petCat(cat) {
    state.game.used.add('cat:' + cat.id);
    state.game.bump('cat');
    state.game.set('cat_' + state.game.count('cat'), '고양이를 쓰다듬었다');
    toast(`고양이를 쓰다듬었다 (${state.game.count('cat')})`);
    checkImmediateEnding();
  }

  function useGizmo(g) {
    const ctxObj = {
      toast,
      rideTo: (stationName) => rideTo(stationName),
    };
    state.game.used.add(g.id);
    g.effect(state.game, ctxObj);
    toast(g.text);
    checkImmediateEnding();
  }

  function toast(text) {
    state.toasts.unshift({ text, life: UI.toastSeconds });
    if (state.toasts.length > 3) state.toasts.pop();
  }

  // ── 건물 출입 · 층 이동 ─────────────────────────────────────────────────
  function enterBuilding(b) {
    state.interiorBuilding = b;
    const floors = floorList(b);
    setFloor(b, floors.includes(1) ? 1 : floors[0], 'spawn');
    state.mode = 'interior';
    cam.snap(state.player.x, state.player.y, { w: state.interior.w * S, h: state.interior.h * S });
    toast(`${b.name} · ${floorLabel(state.floor)}`);
  }

  function setFloor(b, floor, place) {
    state.floor = floor;
    state.interior = makeInterior(b, floor);
    state.interiorGizmos = (indoorIndex.get(`${b.name}|${floor}`) || []).map((g, i) => {
      const slot = state.interior.slots[(g.at.slot + i) % Math.max(1, state.interior.slots.length)]
        || state.interior.spawn;
      return { ...g, tx: slot.x, ty: slot.y };
    });

    let spot;
    if (place === 'spawn') spot = state.interior.spawn;
    else if (place === 'up') spot = below(state.interior.stairs.down || state.interior.stairs.elevator);
    else if (place === 'down') spot = below(state.interior.stairs.up || state.interior.stairs.elevator);
    else spot = below(state.interior.stairs.elevator) || state.interior.spawn;
    state.player.x = (spot.x + 0.5) * S;
    state.player.y = (spot.y + 0.9) * S; // 타일 경계에 딱 걸치지 않게 (발밑 기준)
  }

  function below(pos) {
    return pos ? { x: pos.x, y: pos.y + 1 } : null;
  }

  function nextFloor(floor, delta) {
    const floors = floorList(state.interiorBuilding);
    const i = floors.indexOf(floor);
    return floors[Math.max(0, Math.min(floors.length - 1, i + delta))];
  }

  function changeFloor(floor) {
    if (floor === state.floor) return;
    const dir = floor > state.floor ? 'up' : 'down';
    setFloor(state.interiorBuilding, floor, dir);
    cam.snap(state.player.x, state.player.y, { w: state.interior.w * S, h: state.interior.h * S });
    toast(`${state.interiorBuilding.name} · ${floorLabel(floor)}`);
  }

  function openPicker() {
    // 전기를 끊어 놓고 엘리베이터를 타면 갇힌다
    if (state.game.has('blackout')) {
      state.game.set('stuck', '정전 중에 엘리베이터를 탔다');
      toast('버튼을 누르자 안내판이 꺼졌다.');
      checkImmediateEnding();
      return;
    }
    const floors = floorList(state.interiorBuilding);
    state.picker = { floors, index: Math.max(0, floors.indexOf(state.floor)) };
  }

  function exitBuilding() {
    const b = state.interiorBuilding;
    const out = doorOutside(b);
    state.mode = 'outdoor';
    state.player.x = (out.x + 0.5) * S;
    state.player.y = (out.y + 0.7) * S;
    state.interior = null;
    state.interiorGizmos = [];
    state.floor = 1;
    state.exitCooldown = INTERIOR.exitPause;
    cam.snap(state.player.x, state.player.y);
  }

  // 지하철로 다른 역까지
  function rideTo(stationName) {
    const target = buildings.list.find((b) => b.name === stationName);
    if (!target) return;
    const out = doorOutside(target);
    state.mode = 'outdoor';
    state.interior = null;
    state.interiorGizmos = [];
    state.interiorBuilding = null;
    state.floor = 1;
    state.player.x = (out.x + 0.5) * S;
    state.player.y = (out.y + 0.7) * S;
    state.exitCooldown = INTERIOR.exitPause;
    state.game.clock += 4 * 60; // 4분
    cam.snap(state.player.x, state.player.y);
    toast(`${stationName} 도착`);
  }

  // ── 결말 ────────────────────────────────────────────────────────────────
  function updatePlaceName() {
    const tx = Math.floor(state.player.x / S), ty = Math.floor(state.player.y / S);
    state.placeName = map.regionNameAt(tx, ty) || '김포 들녘';
  }

  function checkGoal() {
    const tx = Math.floor(state.player.x / S), ty = Math.floor(state.player.y / S);
    for (const r of map.regionIndex.queryPoint(tx, ty)) {
      if (!GAME.goalRegions.includes(r.id)) continue;
      if (pointInside(tx, ty, r.path)) { finish('goal'); return; }
    }
  }

  function pointInside(px, py, path) {
    let inside = false;
    for (let i = 0, j = path.length - 1; i < path.length; j = i++) {
      const [xi, yi] = path[i], [xj, yj] = path[j];
      if ((yi > py) !== (yj > py) && px < ((xj - xi) * (py - yi)) / (yj - yi + 1e-12) + xi) {
        inside = !inside;
      }
    }
    return inside;
  }

  function checkImmediateEnding() { finish('any'); }

  function finish(where) {
    if (state.game.ending) return;
    const e = evaluateEnding(state.game, where);
    if (!e) return;
    state.game.ending = e;
    state.game.discover(e.id);
  }

  function restart() {
    state.game = new GameState();
    state.mode = 'outdoor';
    state.interior = null;
    state.interiorGizmos = [];
    state.interiorBuilding = null;
    state.toasts = [];
    state.showGallery = false;
    state.player.x = state.startPos.x;
    state.player.y = state.startPos.y;
    state.player.dir = 'down';
    cam.snap(state.player.x, state.player.y);
  }

  // ── 그리기 ──────────────────────────────────────────────────────────────
  function draw() {
    const W = canvas.width, H = canvas.height;
    ctx.fillStyle = UI_COLOR.sky;
    ctx.fillRect(0, 0, W, H);

    if (state.mode === 'outdoor') {
      scene.drawOutdoor(ctx, cam, state);
      drawBuildingLabels(ctx, cam, map, state.player);
    } else {
      scene.drawInterior(ctx, cam, state);
      drawRoomLabels(ctx, cam, state.interior);
    }

    drawHud(ctx, state);
    if (state.picker) drawPicker();
    // 목록을 열면 결말 화면 대신 목록만 보여 준다
    if (state.showGallery) drawGallery(ctx, state);
    else if (state.game.ending) drawEnding(ctx, state);
  }

  function drawPicker() {
    const W = ctx.canvas.width / (window.devicePixelRatio > 1 ? 1 : 1);
    const floors = state.picker.floors;
    const h = Math.min(280, floors.length * 24 + 40);
    const x = 40, y = 120;
    panel(ctx, x, y, 150, h);
    drawText(ctx, '층 선택', x + 16, y + 26, { size: 14, color: UI_COLOR.accent });
    const visible = Math.floor((h - 40) / 24);
    const from = Math.max(0, Math.min(floors.length - visible, state.picker.index - 2));
    for (let i = from; i < Math.min(floors.length, from + visible); i++) {
      const sel = i === state.picker.index;
      drawText(ctx, `${sel ? '▶ ' : '   '}${floorLabel(floors[i])}`,
        x + 16, y + 52 + (i - from) * 24,
        { size: 13, color: sel ? UI_COLOR.text : UI_COLOR.textDim });
    }
  }

  // 개발·점검용 손잡이. 콘솔에서 __gurae 로 세계를 들여다볼 수 있다.
  function exposeDebugHandle() {
    if (typeof window === 'undefined') return;
    window.__gurae = {
      state, cam,
      get map() { return map; },
      get buildings() { return buildings; },
      // 타일 좌표로 순간이동 (실외)
      tp(tx, ty) {
        state.mode = 'outdoor';
        state.interior = null;
        state.player.x = (tx + 0.5) * S;
        state.player.y = (ty + 0.7) * S;
        cam.snap(state.player.x, state.player.y);
      },
      // 이름으로 건물 앞까지
      goto(name) {
        const b = buildings.list.find((x) => x.name === name);
        if (!b) return false;
        const out = doorOutside(b);
        window.__gurae.tp(out.x, out.y);
        return true;
      },
      interact,
    };
  }

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  }

})();

</script>
</body>
</html>
