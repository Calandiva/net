<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="description" content="김포 구래동에서 양촌공단까지 걸어가는 탑뷰 도트 어드벤처. 무엇을 건드리느냐로 결말이 갈린다.">
<title>〈구래〉 — 구래동에서 양촌공단까지</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #10131a; color: #f4f1ea;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #game {
    display: block; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #fs {
    position: fixed; right: 12px; bottom: 44px; z-index: 5;
    width: 34px; height: 34px; border: 1px solid rgba(255,255,255,.22);
    background: rgba(28,26,33,.82); color: #f4f1ea; font-size: 15px;
    border-radius: 4px; cursor: pointer;
  }
  #fs:hover { background: rgba(60,56,70,.9); }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; background: #10131a; z-index: 10;
  }
  #boot b { font-size: 22px; letter-spacing: .04em; }
  #boot span { font-size: 12px; color: #b9b3a8; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="fs" title="전체화면 (F)">⛶</button>
<div id="boot"><b>〈구래〉</b><span>구래동을 짓는 중…</span></div>

</body>
