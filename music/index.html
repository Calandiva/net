<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="보컬·기타·베이스·건반·드럼 튜토리얼과 코드 사전, 튜너, 메트로놈. 학원 없이 혼자 보는 악기 교실.">
<title>악기 교실 — 보컬 · 기타 · 베이스 · 건반 · 드럼</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #12141a; --panel: #191c24; --panel2: #20242e; --line: #2e3440;
    --ink: #e8e6e1; --dim: #9aa0ac; --accent: #e4572e; --ok: #5aa469; --warn: #d9a441;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; -webkit-text-size-adjust: 100%;
  }
  #app { display: flex; flex-direction: column; min-height: 100%; }

  /* ── 머리와 탭 ── */
  .top { position: sticky; top: 0; z-index: 9; background: rgba(18,20,26,.94);
         backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px 6px; }
  .brand b { font-size: 17px; letter-spacing: .02em; }
  .brand span { font-size: 12px; color: var(--dim); }
  .tabs { display: flex; gap: 4px; padding: 0 10px 8px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; cursor: pointer;
         padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px;
         background: transparent; color: var(--dim); font: inherit; font-size: 13px; }
  .tab:hover { color: var(--ink); border-color: #3d4658; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab-icon { font-size: 14px; }

  .body { flex: 1; }
  .page { max-width: 940px; margin: 0 auto; padding: 20px 16px 60px; }
  .foot { text-align: center; color: #5d6470; font-size: 12px; padding: 18px; border-top: 1px solid var(--line); }

  /* ── 공통 조각 ── */
  .page-head { margin-bottom: 18px; }
  .page-head h2 { font-size: 24px; letter-spacing: -.01em; }
  .tagline { color: var(--dim); font-size: 13.5px; margin-top: 4px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px; margin-bottom: 14px; }
  .card.warn { border-color: var(--warn); color: var(--warn); }
  h3.section { font-size: 15px; margin: 22px 0 10px; color: var(--dim); font-weight: 600; }
  .card h3 { font-size: 15.5px; margin-bottom: 6px; }
  ul { padding-left: 18px; }
  li { margin: 3px 0; font-size: 14px; }
  .tip { font-size: 12.5px; color: var(--dim); margin-top: 8px;
         border-left: 2px solid var(--line); padding-left: 10px; }
  .tip b { color: var(--warn); }
  .muted { color: var(--dim); }
  .badge { font-size: 11px; color: var(--warn); border: 1px solid var(--warn);
           border-radius: 999px; padding: 1px 8px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips.static { margin-top: 8px; }
  .chip { cursor: pointer; font: inherit; font-size: 12.5px; padding: 4px 11px;
          border-radius: 999px; border: 1px solid var(--line); background: var(--panel2); color: var(--dim); }
  .chip:hover { color: var(--ink); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.ghost { background: transparent; }
  .field-label { font-size: 12px; color: var(--dim); flex: 0 0 auto; }
  .count-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

  button.big { display: block; width: 100%; margin: 12px 0 4px; padding: 12px;
               font: inherit; font-size: 15px; cursor: pointer; border-radius: 10px;
               border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  button.big:hover { filter: brightness(1.08); }
  button.mini { cursor: pointer; font: inherit; font-size: 12px; padding: 5px 12px; margin-top: 8px;
                border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); }
  button.mini:hover { border-color: var(--accent); }

  /* ── 튜토리얼 ── */
  .steps { display: grid; gap: 10px; }
  .card.step { display: flex; gap: 14px; margin-bottom: 0; }
  .step-no { flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--panel2);
             color: var(--accent); display: flex; align-items: center; justify-content: center;
             font-weight: 700; font-size: 14px; }
  .step-body { flex: 1; min-width: 0; }
  .score-card .score-title { font-size: 13px; color: var(--dim); margin-bottom: 10px; }
  .score-scroll { overflow-x: auto; padding-bottom: 4px; margin-top: 8px; }
  .score-scroll svg { display: block; }

  /* ── 코드 사전 ── */
  .chord-input { width: 100%; padding: 12px 14px; font: inherit; font-size: 18px;
                 border-radius: 10px; border: 1px solid var(--line);
                 background: var(--panel2); color: var(--ink); }
  .chord-input:focus { outline: none; border-color: var(--accent); }
  .chord-name { display: flex; align-items: baseline; gap: 10px; }
  .chord-name b { font-size: 26px; }
  .chord-kor { color: var(--dim); font-size: 13px; }
  .tone-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tone-table th { text-align: left; color: var(--dim); font-weight: 600; font-size: 11.5px;
                   border-bottom: 1px solid var(--line); padding: 4px 6px; }
  .tone-table td { padding: 6px; border-bottom: 1px solid #232833; vertical-align: top; }
  .tone-table tr.off td { opacity: .5; text-decoration-color: var(--dim); }
  .deg-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%;
             border: 1.5px solid; margin-right: 6px; vertical-align: -1px; }
  .panel-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
                border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 10px; }
  .panel-head h3 { margin: 0; flex: 1; }
  .shape-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; }
  .shape { flex: 0 0 auto; text-align: center; }
  .shape-meta { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .hands { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; }
  .hand { display: flex; gap: 8px; }
  .hand-label { color: var(--warn); font-size: 12px; flex: 0 0 auto; }

  /* ── 튜너 ── */
  .tuner-card { text-align: center; }
  .gauge { display: flex; justify-content: center; }
  .tuner-read { font-size: 40px; font-weight: 700; margin-top: 6px; letter-spacing: .02em; }
  .tuner-read.good { color: var(--ok); }
  .tuner-detail { font-size: 13px; color: var(--dim); min-height: 20px; }
  .string-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
  .string-btn { cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 1px;
                padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
                background: var(--panel2); color: var(--ink); font-size: 11px; }
  .string-btn b { font-size: 13px; }
  .string-btn.near { border-color: var(--ok); color: var(--ok); }

  /* ── 메트로놈 ── */
  .metro-card { text-align: center; }
  .bpm { font-size: 54px; font-weight: 700; line-height: 1.1; }
  .lamps { display: flex; gap: 8px; justify-content: center; margin: 10px 0 4px; }
  .lamp { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel2); }
  .lamp.first { border-color: var(--accent); }
  .lamp.on { background: var(--accent); box-shadow: 0 0 10px rgba(228,87,46,.7); }
  .metro-row { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 8px; }
  .slider { flex: 1; max-width: 340px; accent-color: var(--accent); }
  .metro-card .count-row { justify-content: center; }

  @media (max-width: 560px) {
    .page { padding: 16px 12px 48px; }
    .page-head h2 { font-size: 21px; }
    .bpm { font-size: 44px; }
  }

  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          background: var(--bg); color: var(--dim); font-size: 13px; z-index: 20; }
</style>
</head>
<body>
<div id="app"></div>
<div id="boot">불러오는 중…</div>
<script>
'use strict';

const __M = Object.create(null);

// ── config.js ─────────────────────────────
(function () {
  // 조정 가능한 값은 전부 여기에 둔다. 다른 파일에 숫자를 흩뿌리지 않는다.

  const APP = {
    title: '악기 교실',
    subtitle: '보컬 · 기타 · 베이스 · 건반 · 드럼',
    storageKey: 'music-lab-v1',
  };

  // 화면 위쪽 탭 순서. id 는 lesson/*.js 와 ui/* 가 함께 쓴다.
  const TABS = [
    { id: 'vocal',  label: '보컬',   icon: '🎤' },
    { id: 'guitar', label: '기타',   icon: '🎸' },
    { id: 'bass',   label: '베이스', icon: '🎻' },
    { id: 'keys',   label: '건반',   icon: '🎹' },
    { id: 'drums',  label: '드럼',   icon: '🥁' },
    { id: 'chord',  label: '코드사전', icon: '🔎' },
    { id: 'tuner',  label: '튜너',   icon: '📡' },
    { id: 'metro',  label: '메트로놈', icon: '⏱' },
  ];

  // 도수별 색. 악보 · 지판 · 건반이 전부 이 색을 쓴다(같은 도수는 어디서나 같은 색).
  const DEG_COLOR = {
    R:  '#e4572e',   // 1도 뿌리
    3:  '#3d7dca',   // 3음 — 밝고 어두움
    5:  '#5aa469',   // 5음 — 뼈대
    7:  '#a45ec4',   // 7음 — 성격
    T:  '#d9a441',   // 텐션 9 11 13
    X:  '#8b8b8b',   // 생략된 음
  };

  const COLOR = {
    bg:      '#12141a',
    panel:   '#191c24',
    panel2:  '#20242e',
    line:    '#2e3440',
    ink:     '#e8e6e1',
    dim:     '#9aa0ac',
    accent:  '#e4572e',
    ok:      '#5aa469',
    warn:    '#d9a441',
    paper:   '#f7f5f0',   // 악보 바탕
    paperInk:'#1a1a1a',   // 악보 잉크
  };

  // 악보 그리기 기준값(px). s = 줄 간격 하나.
  const STAFF_METRIC = {
    s: 10,             // 오선 줄 간격
    noteR: 5.6,        // 음표 머리 반지름(가로)
    stem: 30,          // 기둥 길이
    leftPad: 46,       // 클레프 자리
    measurePad: 18,
    noteGap: 34,       // 음표 하나가 차지하는 가로폭 기준
  };

  // 현악기 조율(개방현 MIDI 번호, 낮은 줄부터). 튜너와 지판이 함께 쓴다.
  const TUNINGS = {
    guitar:      { short: '기타 표준', label: '기타 표준 EADGBE', strings: [40, 45, 50, 55, 59, 64], names: ['6E','5A','4D','3G','2B','1E'] },
    guitarDrop:  { short: '드롭 D',   label: '기타 드롭 D',      strings: [38, 45, 50, 55, 59, 64], names: ['6D','5A','4D','3G','2B','1E'] },
    guitarHalf:  { short: '반음 내림', label: '기타 반음 내림',   strings: [39, 44, 49, 54, 58, 63], names: ['6E♭','5A♭','4D♭','3G♭','2B♭','1E♭'] },
    bass:        { short: '베이스 4현', label: '베이스 4현 EADG',  strings: [28, 33, 38, 43],        names: ['4E','3A','2D','1G'] },
    bass5:       { short: '베이스 5현', label: '베이스 5현 BEADG', strings: [23, 28, 33, 38, 43],    names: ['5B','4E','3A','2D','1G'] },
    ukulele:     { short: '우쿨렐레',  label: '우쿨렐레 GCEA',    strings: [67, 60, 64, 69],        names: ['4G','3C','2E','1A'] },
  };

  // 지판 그림 크기
  const FRET_METRIC = {
    stringGap: 20,
    fretGap: 30,
    dotR: 7,
    pad: 26,
    windowFrets: 5,     // 코드 다이어그램에 보여 줄 프렛 수
    mapFrets: 12,       // 지판 전체 지도에 보여 줄 프렛 수
  };

  // 건반 그림 크기
  const KEY_METRIC = {
    whiteW: 22,
    whiteH: 104,
    blackW: 13,
    blackH: 66,
    lowMidi: 36,        // C2 부터
    octaves: 4,
  };

  const AUDIO = {
    a4: 440,
    master: 0.22,
    noteDur: 1.1,
    strumGap: 0.045,    // 기타 스트로크 간격(초)
  };

  const METRO = {
    bpmMin: 30,
    bpmMax: 260,
    bpmDefault: 90,
    lookahead: 0.1,     // 스케줄러가 미리 잡아 두는 시간(초)
    tick: 25,           // 스케줄러 주기(ms)
    accentHz: 1560,
    beatHz: 900,
    subHz: 640,
  };

  const TUNER = {
    fftSize: 8192,     // 낮은 음(베이스 E1 41Hz)까지 잡으려면 이만큼 필요하다
    minHz: 28,         // 5현 베이스 B0(30.9Hz) 까지 잡는다
    maxHz: 1300,       // 그 위는 이 앱에서 쓸 일이 없다
    clarityMin: 0.72,  // 이보다 흐린 신호는 무시. 배음이 센 악기는 1.0 이 안 나온다
    inTuneCents: 5,     // 이 안이면 맞은 것으로 본다
    smooth: 0.25,      // 표시값 부드럽게
    periodMs: 45,      // 음정 재는 주기(ms). 매 프레임 재면 무겁다
  };

  __M.APP = APP; __M.TABS = TABS; __M.DEG_COLOR = DEG_COLOR; __M.COLOR = COLOR; __M.STAFF_METRIC = STAFF_METRIC; __M.TUNINGS = TUNINGS; __M.FRET_METRIC = FRET_METRIC; __M.KEY_METRIC = KEY_METRIC; __M.AUDIO = AUDIO; __M.METRO = METRO; __M.TUNER = TUNER;
})();

// ── util/dom.js ─────────────────────────────
(function () {
  // DOM 을 만드는 최소한의 도구. 프레임워크는 쓰지 않는다.

  // el('div.card', {id:'x'}, ['글', el('b', '굵게')])
  function el(spec, attrs, kids) {
    const m = String(spec).split(/([.#])/);
    const node = document.createElement(m[0] || 'div');
    for (let i = 1; i < m.length; i += 2) {
      if (m[i] === '.') node.classList.add(m[i + 1]);
      else node.id = m[i + 1];
    }
    if (attrs && (typeof attrs === 'string' || attrs instanceof Node || Array.isArray(attrs))) {
      kids = attrs; attrs = null;
    }
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
        else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), v);
        else if (k === 'html') node.innerHTML = v;
        else node.setAttribute(k, v === true ? '' : v);
      }
    }
    add(node, kids);
    return node;
  }

  function add(node, kids) {
    if (kids == null) return node;
    if (Array.isArray(kids)) { kids.forEach((k) => add(node, k)); return node; }
    node.appendChild(kids instanceof Node ? kids : document.createTextNode(String(kids)));
    return node;
  }

  function clear(node) {
    while (node && node.firstChild) node.removeChild(node.firstChild);
    return node;
  }

  function qs(sel, root) {
    return (root || document).querySelector(sel);
  }

  // 라벨 붙은 한 줄짜리 조작부
  function field(label, control) {
    return el('label.field', [el('span.field-label', label), control]);
  }

  // 값이 바뀌면 알려 주는 버튼 묶음(라디오 대용)
  function chipGroup(items, value, onPick) {
    const box = el('div.chips');
    items.forEach((it) => {
      const b = el('button.chip', { type: 'button', 'data-v': it.value }, it.label);
      if (it.value === value) b.classList.add('on');
      if (it.title) b.title = it.title;
      b.addEventListener('click', () => {
        box.querySelectorAll('.chip').forEach((c) => c.classList.remove('on'));
        b.classList.add('on');
        onPick(it.value);
      });
      box.appendChild(b);
    });
    return box;
  }

  __M.el = el; __M.add = add; __M.clear = clear; __M.qs = qs; __M.field = field; __M.chipGroup = chipGroup;
})();

// ── util/svg.js ─────────────────────────────
(function () {
  // SVG 를 만드는 최소한의 도구. 악보 · 지판 · 건반이 전부 이걸로 그려진다.

  const NS = 'http://www.w3.org/2000/svg';

  function sv(tag, attrs, kids) {
    const node = document.createElementNS(NS, tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        node.setAttribute(k, v === true ? '' : String(v));
      }
    }
    if (kids != null) {
      (Array.isArray(kids) ? kids : [kids]).forEach((k) => {
        if (k == null) return;
        node.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));
      });
    }
    return node;
  }

  function svgRoot(w, h, cls) {
    return sv('svg', {
      viewBox: '0 0 ' + w + ' ' + h,
      width: w, height: h, class: cls || '',
      xmlns: NS, 'shape-rendering': 'geometricPrecision',
    });
  }

  function line(x1, y1, x2, y2, stroke, w) {
    return sv('line', { x1, y1, x2, y2, stroke, 'stroke-width': w == null ? 1 : w, 'stroke-linecap': 'round' });
  }

  function rect(x, y, w, h, fill, more) {
    return sv('rect', Object.assign({ x, y, width: w, height: h, fill }, more || {}));
  }

  function circle(cx, cy, r, fill, more) {
    return sv('circle', Object.assign({ cx, cy, r, fill }, more || {}));
  }

  function path(d, more) {
    return sv('path', Object.assign({ d, fill: 'none' }, more || {}));
  }

  function text(x, y, s, more) {
    return sv('text', Object.assign({
      x, y, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
      'font-family': 'ui-sans-serif, system-ui, sans-serif', 'font-size': 11,
    }, more || {}), String(s));
  }

  // 타원 음표 머리(살짝 기울어져 있어야 악보처럼 보인다)
  function ellipse(cx, cy, rx, ry, fill, rot, more) {
    return sv('ellipse', Object.assign({
      cx, cy, rx, ry, fill,
      transform: 'rotate(' + (rot || -18) + ' ' + cx + ' ' + cy + ')',
    }, more || {}));
  }

  __M.sv = sv; __M.svgRoot = svgRoot; __M.line = line; __M.rect = rect; __M.circle = circle; __M.path = path; __M.text = text; __M.ellipse = ellipse;
})();

// ── theory/notes.js ─────────────────────────────
(function () {
  // 음 하나를 다루는 곳. 이 프로젝트의 음은 언제나 {letter, alter, oct} 로 적는다.
  //   letter : C=0 D=1 E=2 F=3 G=4 A=5 B=6   (오선 위 세로 위치를 정한다)
  //   alter  : -2 ~ +2                        (♭♭ ♭ ♮ ♯ ♯♯)
  //   oct    : 국제 표기(가온다 = C4)
  // 이렇게 두는 이유: C♯ 과 D♭ 은 소리는 같아도 악보에서 자리가 다르다.
  // 피치클래스(0~11) 하나만 들고 다니면 그 구별이 사라진다.

  const { AUDIO } = __M;

  const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];

// ── ui/chordlab.js ─────────────────────────────
(function () {
  // 코드 사전. 코드 이름을 치면 기타 · 베이스 · 건반에서 어떻게 잡는지 한 화면에 보여 준다.
  // 잡을 음 개수를 1 개부터 늘려 가며 볼 수 있고, 생략된 음은 왜 빼도 되는지까지 적는다.

  const { el, clear, chipGroup } = __M;
  const { DEG_COLOR, TUNINGS } = __M;
  const { parseChord, chordExamples } = __M;
  const { tonePlan, countHint } = __M;
  const { degLabel } = __M;
  const { findShapes, fretMap, notePositions } = __M;
  const { handVoicing, voicingIndex, voicingMidis } = __M;
  const { notePc, noteName, noteMidi, makeNote } = __M;
  const { renderChordBox, renderFretMap, renderSingleNote } = __M;
  const { renderKeyboard } = __M;
  const { renderGrandChord, renderChordStaff } = __M;
  const { playMidis } = __M;

  const ROOTS = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];

  const state = { text: 'Cmaj7', count: null, guitarTuning: 'guitar', bassTuning: 'bass' };

  function mountChordLab(host) {
    clear(host);
    const input = el('input.chord-input', { type: 'text', value: state.text, spellcheck: 'false',
      placeholder: '코드 이름 — Cmaj7 · Am7 · G7sus4 · F♯m7♭5 · B♭13 · C/E' });
    const out = el('div.chord-out');

    const redraw = () => { state.text = input.value; draw(out, input); };
    input.addEventListener('input', () => { state.count = null; redraw(); });

    host.appendChild(el('div.page-head', [
      el('h2', '코드 사전'),
      el('p.tagline', '이름을 치면 세 악기에서 어디를 잡는지 나온다. 몇 개만 잡을지도 고를 수 있다.'),
    ]));
    host.appendChild(el('div.card.chord-search', [
      input,
      el('div.chips.static', ROOTS.map((r) => el('button.chip.ghost', { type: 'button', onclick: () => {
        const rest = input.value.replace(/^[A-Ga-g][#b♯♭]*/, '');
        input.value = r + rest; state.count = null; redraw();
      } }, r))),
      el('div.chips.static', chordExamples('C').map((c) => el('button.chip.ghost', { type: 'button', onclick: () => {
        input.value = c; state.count = null; redraw();
      } }, c))),
    ]));
    host.appendChild(out);
    draw(out, input);
  }

  function draw(out, input) {
    clear(out);
    const chord = parseChord(state.text);
    if (!chord) {
      out.appendChild(el('div.card.warn', '읽을 수 없는 코드 이름이다. Cmaj7 · Am7 · G7sus4 · B♭13 · C/E 처럼 적는다.'));
      return;
    }
    const max = chord.degs.length;
    if (state.count == null || state.count > max) state.count = max;
    const plan = tonePlan(chord, state.count);

    // 머리말 + 개수 고르개
    out.appendChild(el('div.card.chord-head', [
      el('div.chord-name', [el('b', chord.sym), el('span.chord-kor', chord.name)]),
      chord.hint ? el('p.tagline', chord.hint) : null,
      el('div.count-row', [
        el('span.field-label', '잡을 음 개수'),
        chipGroup(
          Array.from({ length: max }, (_, i) => ({ value: i + 1, label: String(i + 1) })),
          plan.count,
          (v) => { state.count = v; draw(out, input); }
        ),
      ]),
      el('p.tip', countHint(plan)),
    ]));

    out.appendChild(tonePanel(plan));
    out.appendChild(guitarPanel(plan, out, input));
    out.appendChild(bassPanel(plan, out, input));
    out.appendChild(keysPanel(plan));
  }

  // ── 도수 표 ───────────────────────────
  function tonePanel(plan) {
    const rows = plan.tones.map((t) => el('tr', { class: t.keep ? '' : 'off' }, [
      el('td', [el('span.deg-dot', { style: { background: t.keep ? DEG_COLOR[t.role] : 'transparent',
        borderColor: DEG_COLOR[t.role] } }), el('b', t.short)]),
      el('td', degLabel(t.deg)),
      el('td', noteName(t.note) + (t.alias ? ' (= ' + t.alias + ')' : '')),
      el('td.muted', t.keep ? t.roleText : '생략 — ' + t.omitWhy),
    ]));
    const omittable = plan.tones.filter((t) => t.bandOmit).map((t) => t.short).join(' · ');
    return el('div.card', [
      el('h3.section', '이 코드에 든 음'),
      el('table.tone-table', [
        el('thead', el('tr', [el('th', '도수'), el('th', ''), el('th', '음'), el('th', '하는 일')])),
        el('tbody', rows),
      ]),
      el('p.tip', ['밴드에서 빼도 되는 음: ', el('b', omittable || '없다'),
        ' — 베이스가 루트를 치고 완전5도는 소리에 거의 영향이 없다.']),
    ]);
  }

  // ── 기타 ─────────────────────────────
  function guitarPanel(plan, out, input) {
    const bassPc = plan.chord.bass ? notePc(plan.chord.bass) : notePc(plan.chord.root);
    const shapes = findShapes(state.guitarTuning, plan, bassPc);
    const body = el('div.panel-body');

    if (!shapes.length) {
      body.appendChild(el('p.tip', '이 조합은 여섯 줄 안에서 손가락 네 개로 잡을 자리를 못 찾았다. 개수를 줄여 보라.'));
    } else {
      const boxes = el('div.shape-row');
      shapes.forEach((s, i) => {
        const midis = s.tones.map((t) => t.midi);
        boxes.appendChild(el('div.shape', [
          renderChordBox(s, { caption: i === 0 ? '가장 쉬운 자리' : (s.lowFret || 1) + '프렛 자리' }),
          el('button.mini', { type: 'button', onclick: () => playMidis(midis, true) }, '소리 ▶'),
          el('div.shape-meta', (s.barre ? '바레 · ' : '') + '손가락 ' + s.fingers + '개'),
        ]));
      });
      body.appendChild(boxes);

      // 악보에는 기타 관례대로 실제 소리보다 한 옥타브 높여 적는다
      const staffItems = shapes[0].tones.map((t) => {
        const tone = t.tone;
        const n = fitNote(tone, t.midi + 12);
        return { note: n, tone: tone };
      });
      body.appendChild(el('div.score-scroll', renderChordStaff(staffItems, 'treble',
        { width: 260, note: '실제 소리보다 한 옥타브 높게 적었다' })));
    }

    body.appendChild(el('div.score-scroll', renderFretMap(fretMap(state.guitarTuning, plan),
      { caption: '지판 전체 — 색이 찬 것은 지금 잡는 음, 점선은 생략한 음' })));

    return el('div.card.panel', [
      el('div.panel-head', [el('h3', '🎸 기타'), tuningPicker('guitarTuning', ['guitar', 'guitarDrop', 'guitarHalf'], out, input)]),
      body,
    ]);
  }

  // 도수 음을 원하는 MIDI 높이에 맞춰 철자 유지한 채 옥타브만 정한다
  function fitNote(tone, midi) {
    const n = makeNote(tone.note.letter, tone.note.alter, 4);
    while (noteMidi(n) < midi - 6) n.oct += 1;
    while (noteMidi(n) > midi + 6) n.oct -= 1;
    return n;
  }

  // ── 베이스 ────────────────────────────
  function bassPanel(plan, out, input) {
    const bassNote = plan.chord.bass || plan.chord.root;
    const pos = notePositions(state.bassTuning, notePc(bassNote), 12);
    const rootTone = plan.tones.find((t) => notePc(t.note) === notePc(bassNote)) || plan.tones[0];
    const staffNote = fitNote(rootTone, pos.length ? pos[0].midi : 40);

    return el('div.card.panel', [
      el('div.panel-head', [el('h3', '🎻 베이스'), el('span.badge', '언제나 한 음'),
        tuningPicker('bassTuning', ['bass', 'bass5'], out, input)]),
      el('div.panel-body', [
        el('p.tip', ['베이스는 ', el('b', noteName(bassNote)), ' 한 음만 잡는다. 낮은 음끼리 겹치면 뭉개지기 때문이다. ',
          '색이 진한 자리가 제일 낮은(기본) 자리이고, 나머지는 같은 음의 다른 자리다.']),
        el('div.score-scroll', renderSingleNote(state.bassTuning, pos, noteName(bassNote),
          { caption: '이 음을 잡을 수 있는 자리' })),
        el('div.score-scroll', renderChordStaff([{ note: staffNote, tone: rootTone }], 'bass',
          { width: 220, note: '실제 소리보다 한 옥타브 높게 적었다' })),
        el('div.score-scroll', renderFretMap(fretMap(state.bassTuning, plan),
          { caption: '코드톤 위치 — 워킹 베이스로 넓힐 때 쓴다' })),
        el('button.mini', { type: 'button', onclick: () => playMidis([pos.length ? pos[0].midi : 40], false) }, '소리 ▶'),
      ]),
    ]);
  }

  // ── 건반 ─────────────────────────────
  function keysPanel(plan) {
    const v = handVoicing(plan);
    const press = voicingIndex(v);
    const midis = voicingMidis(v);
    const hands = (list, label) => el('div.hand', [
      el('span.hand-label', label),
      el('span', list.length ? list.map((x) => noteName(x.note, true) + ' (' + x.tone.short + ')').join(' · ') : '없음'),
    ]);

    return el('div.card.panel', [
      el('div.panel-head', [el('h3', '🎹 건반'), el('span.badge', '양손')]),
      el('div.panel-body', [
        el('div.hands', [hands(v.left, '왼손'), hands(v.right, '오른손')]),
        el('div.score-scroll', renderKeyboard(press, { low: 36, octaves: 4 })),
        el('div.score-scroll', renderGrandChord(v, { width: 330 })),
        el('button.mini', { type: 'button', onclick: () => playMidis(midis, false) }, '소리 ▶'),
        el('p.tip', '왼손이 뿌리를 잡고 오른손이 성격을 만든다. 개수를 줄이면 오른손부터 가벼워진다.'),
      ]),
    ]);
  }

  function tuningPicker(key, opts, out, input) {
    return chipGroup(
      opts.map((o) => ({ value: o, label: TUNINGS[o].short, title: TUNINGS[o].label })),
      state[key],
      (v) => { state[key] = v; draw(out, input); }
    );
  }

  __M.mountChordLab = mountChordLab;
})();

// ── ui/tuner.js ─────────────────────────────
(function () {
  // 튜너 화면. 마이크를 켜면 지금 내는 소리가 무슨 음이고 몇 센트 어긋났는지 보여 준다.

  const { el, clear, chipGroup } = __M;
  const { COLOR, TUNER, TUNINGS } = __M;
  const { sv, svgRoot, line, path, text, circle, rect } = __M;
  const { createTuner } = __M;
  const { playFreq } = __M;
  const { midiToNote, noteName, midiToFreq } = __M;

  const st = { preset: 'guitar', tuner: null, on: false };

  function mountTuner(host) {
    clear(host);
    const gauge = el('div.gauge');
    const read = el('div.tuner-read', '—');
    const detail = el('div.tuner-detail', '마이크를 켜고 한 줄씩 울려 본다');
    const strings = el('div.string-row');

    const paint = (r) => {
      clear(gauge);
      gauge.appendChild(needle(r));
      if (!r) { read.textContent = '—'; read.className = 'tuner-read'; detail.textContent = st.on ? '소리를 기다리는 중' : '마이크가 꺼져 있다'; return; }
      read.textContent = noteName(r.note, true);
      const good = Math.abs(r.cents) <= TUNER.inTuneCents;
      read.className = 'tuner-read' + (good ? ' good' : '');
      detail.textContent = r.hz.toFixed(1) + ' Hz · ' + (r.cents > 0 ? '+' : '') + r.cents + ' 센트 · '
        + (good ? '맞았다' : r.cents > 0 ? '높다 — 조금 풀어라' : '낮다 — 조금 조여라');
      paintStrings(strings, r.midi);
    };

    const btn = el('button.big', { type: 'button' }, '마이크 켜기');
    btn.addEventListener('click', async () => {
      if (st.on) { st.tuner.stop(); st.on = false; btn.textContent = '마이크 켜기'; paint(null); return; }
      st.tuner = createTuner(paint);
      try {
        await st.tuner.start();
        st.on = true; btn.textContent = '마이크 끄기';
      } catch (e) {
        detail.textContent = '마이크를 열 수 없다. 브라우저 주소창의 권한을 확인하라. (' + (e && e.name) + ')';
      }
    });

    host.appendChild(el('div.page-head', [
      el('h2', '튜너'),
      el('p.tagline', '자기상관으로 기본 주파수를 찾는다. 소리는 브라우저 밖으로 나가지 않는다.'),
    ]));
    host.appendChild(el('div.card.tuner-card', [
      gauge, read, detail, btn,
      el('div.count-row', [el('span.field-label', '조율'),
        chipGroup(Object.keys(TUNINGS).map((k) => ({ value: k, label: TUNINGS[k].short, title: TUNINGS[k].label })),
          st.preset, (v) => { st.preset = v; paintStrings(strings, null); })]),
      strings,
      el('p.tip', '줄 이름을 누르면 기준음이 난다. 그 소리에 귀를 맞춘 뒤 줄을 울려 바늘을 본다.'),
    ]));
    paintStrings(strings, null);
    paint(null);
  }

  // 바늘 눈금 — 가운데가 0센트, 좌우 ±50
  function needle(r) {
    const W = 420, H = 150, cx = W / 2, cy = H - 14, R = 118;
    const root = svgRoot(W, H, 'gauge-svg');
    const g = sv('g');
    root.appendChild(rect(0, 0, W, H, COLOR.panel2, { rx: 10 }));
    root.appendChild(g);
    for (let c = -50; c <= 50; c += 10) {
      const a = (c / 50) * (Math.PI / 2.6) - Math.PI / 2;
      const x1 = cx + Math.cos(a) * (R - 10), y1 = cy + Math.sin(a) * (R - 10);
      const x2 = cx + Math.cos(a) * R, y2 = cy + Math.sin(a) * R;
      g.appendChild(line(x1, y1, x2, y2, c === 0 ? COLOR.ok : COLOR.line, c === 0 ? 2.4 : 1.2));
      if (c % 25 === 0) g.appendChild(text(cx + Math.cos(a) * (R - 24), cy + Math.sin(a) * (R - 24), c, { 'font-size': 10, fill: COLOR.dim }));
    }
    const cents = r ? Math.max(-50, Math.min(50, r.cents)) : 0;
    const a = (cents / 50) * (Math.PI / 2.6) - Math.PI / 2;
    const col = !r ? COLOR.line : Math.abs(r.cents) <= TUNER.inTuneCents ? COLOR.ok : COLOR.accent;
    g.appendChild(line(cx, cy, cx + Math.cos(a) * (R - 16), cy + Math.sin(a) * (R - 16), col, 3));
    g.appendChild(circle(cx, cy, 5, col));
    return root;
  }

  function paintStrings(host, midi) {
    clear(host);
    const t = TUNINGS[st.preset];
    t.strings.forEach((m, i) => {
      const b = el('button.string-btn', { type: 'button', onclick: () => playFreq(midiToFreq(m), null, 1.6, 0.9) },
        [el('b', t.names[i]), el('span', noteName(midiToNote(m), true))]);
      if (midi != null && Math.abs(midi - m) <= 1) b.classList.add('near');
      host.appendChild(b);
    });
  }

  __M.mountTuner = mountTuner;
})();

// ── ui/metronome.js ─────────────────────────────
(function () {
  // 메트로놈 화면. 박이 올 때마다 램프가 켜진다.

  const { el, clear, chipGroup } = __M;
  const { METRO } = __M;
  const { createMetronome, createTapTempo } = __M;

  const st = { metro: null, tap: null };

  function mountMetronome(host) {
    clear(host);
    const lamps = el('div.lamps');
    const bpmView = el('div.bpm', String(METRO.bpmDefault));

    if (!st.metro) st.metro = createMetronome();
    if (!st.tap) st.tap = createTapTempo();
    const m = st.metro;
    bpmView.textContent = String(m.state.bpm);

    const drawLamps = (active) => {
      clear(lamps);
      for (let i = 0; i < m.state.beats; i++) {
        const d = el('span.lamp' + (i === 0 ? '.first' : ''));
        if (i === active) d.classList.add('on');
        lamps.appendChild(d);
      }
    };
    m.onBeat = (beat) => drawLamps(beat);

    const setBpm = (v) => {
      const bpm = Math.max(METRO.bpmMin, Math.min(METRO.bpmMax, Math.round(v)));
      m.set('bpm', bpm);
      bpmView.textContent = String(bpm);
      slider.value = String(bpm);
    };

    const slider = el('input.slider', { type: 'range', min: METRO.bpmMin, max: METRO.bpmMax, value: m.state.bpm,
      oninput: (e) => setBpm(+e.target.value) });

    const startBtn = el('button.big', { type: 'button' }, m.state.running ? '멈춤 ■' : '시작 ▶');
    startBtn.addEventListener('click', () => {
      if (m.state.running) { m.stop(); startBtn.textContent = '시작 ▶'; drawLamps(-1); }
      else { m.start(); startBtn.textContent = '멈춤 ■'; }
    });

    host.appendChild(el('div.page-head', [
      el('h2', '메트로놈'),
      el('p.tagline', 'setInterval 이 아니라 오디오 시계에 미리 잡아 두는 방식이라 흔들리지 않는다.'),
    ]));
    host.appendChild(el('div.card.metro-card', [
      bpmView, lamps,
      el('div.metro-row', [
        el('button.mini', { type: 'button', onclick: () => setBpm(m.state.bpm - 5) }, '−5'),
        slider,
        el('button.mini', { type: 'button', onclick: () => setBpm(m.state.bpm + 5) }, '+5'),
      ]),
      startBtn,
      el('div.metro-row', [
        el('button.mini', { type: 'button', onclick: () => { const v = st.tap(); if (v) setBpm(v); } }, '탭 템포 (두드려서 맞추기)'),
      ]),
      el('div.count-row', [el('span.field-label', '한 마디 박'),
        chipGroup([2, 3, 4, 5, 6, 7].map((v) => ({ value: v, label: v + '박' })), m.state.beats,
          (v) => { m.set('beats', v); drawLamps(-1); })]),
      el('div.count-row', [el('span.field-label', '쪼개기'),
        chipGroup([
          { value: 1, label: '４분' }, { value: 2, label: '８분' },
          { value: 3, label: '셋잇단' }, { value: 4, label: '16분' },
        ], m.state.sub, (v) => m.set('sub', v))]),
      el('div.count-row', [el('span.field-label', '첫 박 강조'),
        chipGroup([{ value: true, label: '켬' }, { value: false, label: '끔' }], m.state.accent,
          (v) => m.set('accent', v))]),
    ]));
    drawLamps(-1);
  }

  __M.mountMetronome = mountMetronome;
})();

// ── ui/shell.js ─────────────────────────────
(function () {
  // 전체 껍데기. 위쪽 탭과 본문 자리를 만들고, 탭에 맞는 화면을 붙인다.

  const { APP, TABS } = __M;
  const { el, clear } = __M;
  const { LESSONS } = __M;
  const { mountLesson } = __M;
  const { mountChordLab } = __M;
  const { mountTuner } = __M;
  const { mountMetronome } = __M;

  let current = null;

  function mountShell(root) {
    clear(root);
    const body = el('main.body');
    const tabs = el('nav.tabs');

    TABS.forEach((t) => {
      const b = el('button.tab', { type: 'button', 'data-id': t.id },
        [el('span.tab-icon', t.icon), el('span.tab-label', t.label)]);
      b.addEventListener('click', () => go(t.id));
      tabs.appendChild(b);
    });

    root.appendChild(el('header.top', [
      el('div.brand', [el('b', APP.title), el('span', APP.subtitle)]),
      tabs,
    ]));
    root.appendChild(body);
    root.appendChild(el('footer.foot', '학원 없이 혼자 보는 악기 교실 · 서버 없이 이 파일 하나로 돈다'));

    function go(id) {
      current = id;
      try { localStorage.setItem(APP.storageKey, id); } catch (e) { /* 막혀 있어도 상관없다 */ }
      if (location.hash.slice(1) !== id) location.hash = id;
      tabs.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.id === id));
      body.scrollTop = 0;
      render(body, id);
    }

    window.addEventListener('hashchange', () => {
      const id = location.hash.slice(1);
      if (id && id !== current && TABS.some((t) => t.id === id)) go(id);
    });

    let start = location.hash.slice(1);
    if (!start || !TABS.some((t) => t.id === start)) {
      try { start = localStorage.getItem(APP.storageKey); } catch (e) { start = null; }
    }
    go(TABS.some((t) => t.id === start) ? start : 'vocal');
  }

  function render(body, id) {
    clear(body);
    const page = el('div.page');
    body.appendChild(page);
    if (LESSONS[id]) mountLesson(page, LESSONS[id]);
    else if (id === 'chord') mountChordLab(page);
    else if (id === 'tuner') mountTuner(page);
    else if (id === 'metro') mountMetronome(page);
  }

  __M.mountShell = mountShell;
})();

// ── main.js ─────────────────────────────
(function () {
  // 진입점.

  const { mountShell } = __M;

  function boot() {
    const root = document.getElementById('app');
    if (!root) return;
    mountShell(root);
    const b = document.getElementById('boot');
    if (b) b.remove();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})();

</script>
