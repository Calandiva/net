<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="GGYEMSSBBYOKK — 기타·베이스·건반·우쿨렐레 코드 사전, 크로매틱 튜너, 메트로놈. 서버 없이 도는 한 장짜리 웹앱.">
<title>GGYEMSSBBYOKK — 코드 사전 · 튜너 · 메트로놈</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #12141a; --panel: #191c24; --panel2: #20242e; --line: #2e3440;
    --ink: #e8e6e1; --dim: #9aa0ac; --accent: #e4572e; --ok: #5aa469; --warn: #d9a441;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; -webkit-text-size-adjust: 100%;
  }
  #app { display: flex; flex-direction: column; min-height: 100%; }

  /* ── 머리와 탭 ── */
  .top { position: sticky; top: 0; z-index: 9; background: rgba(18,20,26,.94);
         backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px 6px; }
  .brand b { font-size: 17px; letter-spacing: .02em; }
  .brand span { font-size: 12px; color: var(--dim); }
  .tabs { display: flex; gap: 4px; padding: 0 10px 8px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; cursor: pointer;
         padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px;
         background: transparent; color: var(--dim); font: inherit; font-size: 13px; }
  .tab:hover { color: var(--ink); border-color: #3d4658; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab-icon { font-size: 14px; }

  .body { flex: 1; }
  .page { max-width: 940px; margin: 0 auto; padding: 20px 16px 60px; }
  .foot { text-align: center; color: #5d6470; font-size: 12px; padding: 18px; border-top: 1px solid var(--line); }

  /* ── 공통 조각 ── */
  .page-head { margin-bottom: 18px; }
  .page-head h2 { font-size: 24px; letter-spacing: -.01em; }
  .tagline { color: var(--dim); font-size: 13.5px; margin-top: 4px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px; margin-bottom: 14px; }
  .card.warn { border-color: var(--warn); color: var(--warn); }
  h3.section { font-size: 15px; margin: 22px 0 10px; color: var(--dim); font-weight: 600; }
  .card h3 { font-size: 15.5px; margin-bottom: 6px; }
  ul { padding-left: 18px; }
  li { margin: 3px 0; font-size: 14px; }
  .tip { font-size: 12.5px; color: var(--dim); margin-top: 8px;
         border-left: 2px solid var(--line); padding-left: 10px; }
  .tip b { color: var(--warn); }
  .muted { color: var(--dim); }
  .badge { font-size: 11px; color: var(--warn); border: 1px solid var(--warn);
           border-radius: 999px; padding: 1px 8px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips.static { margin-top: 8px; }
  .chip { cursor: pointer; font: inherit; font-size: 12.5px; padding: 4px 11px;
          border-radius: 999px; border: 1px solid var(--line); background: var(--panel2); color: var(--dim); }
  .chip:hover { color: var(--ink); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.ghost { background: transparent; }
  .field-label { font-size: 12px; color: var(--dim); flex: 0 0 auto; }
  .count-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

  button.big { display: block; width: 100%; margin: 12px 0 4px; padding: 12px;
               font: inherit; font-size: 15px; cursor: pointer; border-radius: 10px;
               border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  button.big:hover { filter: brightness(1.08); }
  button.mini { cursor: pointer; font: inherit; font-size: 12px; padding: 5px 12px; margin-top: 8px;
                border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); }
  button.mini:hover { border-color: var(--accent); }

  .score-scroll { overflow-x: auto; padding-bottom: 4px; margin-top: 8px; }
  .score-scroll svg { display: block; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick-row { display: flex; align-items: flex-start; gap: 10px; margin-top: 10px; }
  .pick-row .field-label { padding-top: 5px; }
  .algo-list { margin-top: 8px; font-size: 12.5px; }
  .algo-list b { color: var(--ink); }

  /* ── 코드 사전 ── */
  .chord-input { width: 100%; padding: 12px 14px; font: inherit; font-size: 18px;
                 border-radius: 10px; border: 1px solid var(--line);
                 background: var(--panel2); color: var(--ink); }
  .chord-input:focus { outline: none; border-color: var(--accent); }
  .chord-name { display: flex; align-items: baseline; gap: 10px; }
  .chord-name b { font-size: 26px; }
  .chord-kor { color: var(--dim); font-size: 13px; }
  .tone-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tone-table th { text-align: left; color: var(--dim); font-weight: 600; font-size: 11.5px;
                   border-bottom: 1px solid var(--line); padding: 4px 6px; }
  .tone-table td { padding: 6px; border-bottom: 1px solid #232833; vertical-align: top; }
  .tone-table tr.off td { opacity: .5; text-decoration-color: var(--dim); }
  .deg-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%;
             border: 1.5px solid; margin-right: 6px; vertical-align: -1px; }
  .panel-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
                border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 10px; }
  .panel-head h3 { margin: 0; flex: 1; }
  .shape-grid { display: grid; gap: 16px; margin-top: 12px;
                grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .shape { text-align: center; }
  .shape-meta { font-size: 11px; color: var(--dim); margin: 6px 0 4px; }
  .shape .btn-row { justify-content: center; }
  .shape .btn-row button.mini { margin-top: 0; }
  .hands { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; }
  .hand { display: flex; gap: 8px; }
  .hand-label { color: var(--warn); font-size: 12px; flex: 0 0 auto; }

  /* ── 튜너 ── */
  .tuner-card { text-align: center; }
  .gauge { display: flex; justify-content: center; }
  .tuner-read { font-size: 40px; font-weight: 700; margin-top: 6px; letter-spacing: .02em; }
  .tuner-read.good { color: var(--ok); }
  .tuner-detail { font-size: 13px; color: var(--dim); min-height: 20px; }
  .strip, .meter { display: flex; justify-content: center; margin-top: 8px; }
  .cost { font-size: 11px; color: #5d6470; margin-top: 6px; }
  .a4v { font-size: 12px; color: var(--dim); min-width: 62px; }
  .string-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
  .string-btn { cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 1px;
                padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
                background: var(--panel2); color: var(--ink); font-size: 11px; }
  .string-btn b { font-size: 13px; }
  .string-btn.near { border-color: var(--ok); color: var(--ok); }

  /* ── 메트로놈 ── */
  .metro-card { text-align: center; }
  .bpm { font-size: 54px; font-weight: 700; line-height: 1.1; }
  .lamps { display: flex; gap: 8px; justify-content: center; margin: 10px 0 4px; }
  .lamp { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel2); }
  .lamp.first { border-color: var(--accent); }
  .lamp.on { background: var(--accent); box-shadow: 0 0 10px rgba(228,87,46,.7); }
  .lamp.silent { background: var(--line); box-shadow: 0 0 8px rgba(154,160,172,.5); }
  .barcount { font-size: 12px; color: var(--dim); margin-top: -4px; }
  .metro-row { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 8px; }
  .slider { flex: 1; max-width: 340px; accent-color: var(--accent); }
  .metro-card .count-row { justify-content: center; }

  @media (max-width: 560px) {
    .page { padding: 16px 12px 48px; }
    .page-head h2 { font-size: 21px; }
    .bpm { font-size: 44px; }
  }

  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          background: var(--bg); color: var(--dim); font-size: 13px; z-index: 20; }
</style>
</head>

<script>

// ── util/dom.js ─────────────────────────────
(function () {
  // DOM 을 만드는 최소한의 도구. 프레임워크는 쓰지 않는다.

  // el('div.card', {id:'x'}, ['글', el('b', '굵게')])
  function el(spec, attrs, kids) {
    const m = String(spec).split(/([.#])/);
    const node = document.createElement(m[0] || 'div');
    for (let i = 1; i < m.length; i += 2) {
      if (m[i] === '.') node.classList.add(m[i + 1]);
      else node.id = m[i + 1];
    }
    if (attrs && (typeof attrs === 'string' || attrs instanceof Node || Array.isArray(attrs))) {
      kids = attrs; attrs = null;
    }
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
        else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), v);
        else if (k === 'html') node.innerHTML = v;
        else node.setAttribute(k, v === true ? '' : v);
      }
    }
    add(node, kids);
    return node;
  }

  function add(node, kids) {
    if (kids == null) return node;
    if (Array.isArray(kids)) { kids.forEach((k) => add(node, k)); return node; }
    node.appendChild(kids instanceof Node ? kids : document.createTextNode(String(kids)));
    return node;
  }

  function clear(node) {
    while (node && node.firstChild) node.removeChild(node.firstChild);
    return node;
  }

  function qs(sel, root) {
    return (root || document).querySelector(sel);
  }

  // 라벨 붙은 한 줄짜리 조작부
  function field(label, control) {
    return el('label.field', [el('span.field-label', label), control]);
  }

  // 값이 바뀌면 알려 주는 버튼 묶음(라디오 대용)
  function chipGroup(items, value, onPick) {
    const box = el('div.chips');
    items.forEach((it) => {
      const b = el('button.chip', { type: 'button', 'data-v': it.value }, it.label);
      if (it.value === value) b.classList.add('on');
      if (it.title) b.title = it.title;
      b.addEventListener('click', () => {
        box.querySelectorAll('.chip').forEach((c) => c.classList.remove('on'));
        b.classList.add('on');
        onPick(it.value);
      });
      box.appendChild(b);
    });
    return box;
  }

  __M.el = el; __M.add = add; __M.clear = clear; __M.qs = qs; __M.field = field; __M.chipGroup = chipGroup;
})();

    for (let i = 0; i < n; i++) c0 += x[i] * x[i];

    return ok(hz) ? { hz, clarity: Math.max(0, Math.min(1, best / c0)) } : null;

  // ── 2. NSDF / MPM (McLeod) ────────────────────────
  // 자기상관을 에너지로 정규화한 뒤(-1~1), 제일 높은 봉우리의 88% 를 넘는 "첫" 봉우리를
  // 고른다. 그 첫 봉우리가 진짜 주기라서 옥타브를 잘 안 틀린다. 이 앱의 기본값.

    const { lo, hi } = lagRange(sr, n);

    const nsdf = new Float32Array(hi + 2);
    for (let lag = lo; lag <= hi; lag++) {

      const m = n - lag;

    const hz = sr / refine(nsdf, pick);

  // ── 3. YIN ────────────────────────────────────────

  // ── 5. HPS (FFT 하모닉 곱) ────────────────────────
  // 주파수 영역으로 옮긴 뒤 2배·3배·4배로 압축한 스펙트럼을 곱한다.
  // 배음이 겹치는 자리 = 기음이 크게 남는다. 계산이 빠르지만 낮은 음은 분해능이 모자란다.

    const hz = pos * binHz;

    return ok(hz) ? { hz, clarity: Math.max(0, Math.min(1, Math.sqrt(share * (hi - lo)) / 6)) } : null;
  }

  // 제자리 FFT (radix-2 Cooley–Tukey). 라이브러리를 안 쓰려고 직접 둔다.
  function fft(re, im) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) {                 // 비트 뒤집기
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) {
        let t = re[i]; re[i] = re[j]; re[j] = t;
        t = im[i]; im[i] = im[j]; im[j] = t;
      }

      const ang = -2 * Math.PI / len;

          re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
          const ncr = cr * wr - ci * wi;
          ci = cr * wi + ci * wr; cr = ncr;
        }

    }
  }

  // 파형이 0 을 몇 번 지나는지만 센다. 제일 가볍고 제일 잘 틀린다.

  function pitchZC(x, sr) {
    const n = x.length;

    const cross = [];
    for (let i = 1; i < n; i++) {

        const t = x[i] - x[i - 1];

      }

    for (let i = 1; i < cross.length; i++) gaps.push(cross[i] - cross[i - 1]);

          st.mode, (v) => { st.mode = v; paintStrings(strings, null); })]),
      strings,
      el('p.tip', '크로매틱은 목소리·관악기·아무 악기에나 쓴다. 조율을 고르면 그 줄들만 놓고 보고, 줄 이름을 누르면 기준음이 난다.'),
    ]));

    const algoNote = el('p.tip', algoById(st.algo).full + ' — ' + algoById(st.algo).good);
    host.appendChild(el('div.card', [
      el('h3.section', '음정 찾는 방법'),
      el('div.count-row', [el('span.field-label', '알고리즘'),
        chipGroup(PITCH_ALGOS.map((a) => ({ value: a.id, label: a.name, title: a.full + ' — ' + a.good })),
          st.algo, (v) => { setOpt('algo', v); algoNote.textContent = algoById(v).full + ' — ' + algoById(v).good; })]),
      algoNote,
      el('ul.algo-list', PITCH_ALGOS.map((a) => el('li', [el('b', a.name), ' ', el('span.muted', a.good)]))),
    ]));

    host.appendChild(el('div.card', [
      el('h3.section', '세부'),
      el('div.count-row', [el('span.field-label', '표기'),
        chipGroup([{ value: false, label: '♯ 올림' }, { value: true, label: '♭ 내림' }], st.flat, (v) => setOpt('flat', v))]),
      el('div.count-row', [el('span.field-label', '반응'),
        chipGroup(SMOOTHS, st.smooth, (v) => setOpt('smooth', v))]),
      el('div.count-row', [el('span.field-label', '기준 A'), a4, a4v]),
      el('p.tip', '기준 A 는 보통 440Hz 다. 오케스트라는 442~443, 옛 악기는 415 를 쓰기도 한다. 바꾸면 모든 음의 기준이 같이 옮겨간다.'),
    ]));

    paintStrings(strings, null);
    paint(null);
  }

  // 바늘 눈금 — 가운데가 0센트, 좌우 ±50
  function needle(r) {
    const W = 420, H = 150, cx = W / 2, cy = H - 14, R = 118;
    const root = svgRoot(W, H, 'gauge-svg');
    const g = sv('g');
    root.appendChild(rect(0, 0, W, H, COLOR.panel2, { rx: 10 }));
    root.appendChild(g);
    for (let c = -50; c <= 50; c += 5) {
      const a = (c / 50) * (Math.PI / 2.6) - Math.PI / 2;
      const big = c % 25 === 0, mid = c % 10 === 0;
      const len = big ? 16 : mid ? 11 : 6;
      g.appendChild(line(cx + Math.cos(a) * (R - len), cy + Math.sin(a) * (R - len),
        cx + Math.cos(a) * R, cy + Math.sin(a) * R,
        c === 0 ? COLOR.ok : COLOR.line, c === 0 ? 2.6 : 1.1));
      if (big) g.appendChild(text(cx + Math.cos(a) * (R - 28), cy + Math.sin(a) * (R - 28), c, { 'font-size': 10, fill: COLOR.dim }));
    }
    // 맞은 것으로 보는 구간을 옅게 칠한다
    const a1 = (-TUNER.inTuneCents / 50) * (Math.PI / 2.6) - Math.PI / 2;
    const a2 = (TUNER.inTuneCents / 50) * (Math.PI / 2.6) - Math.PI / 2;
    g.appendChild(path(['M', cx, cy, 'L', cx + Math.cos(a1) * R, cy + Math.sin(a1) * R,
      'A', R, R, 0, 0, 1, cx + Math.cos(a2) * R, cy + Math.sin(a2) * R, 'Z'].join(' '),
      { fill: 'rgba(90,164,105,.14)' }));

    const cents = r ? Math.max(-50, Math.min(50, r.cents)) : 0;
    const a = (cents / 50) * (Math.PI / 2.6) - Math.PI / 2;
    const col = !r ? COLOR.line : Math.abs(r.cents) <= TUNER.inTuneCents ? COLOR.ok : COLOR.accent;
    g.appendChild(line(cx, cy, cx + Math.cos(a) * (R - 18), cy + Math.sin(a) * (R - 18), col, 3.2));
    g.appendChild(circle(cx, cy, 6, col));
    return root;
  }

  // 센트 이력 — 손이 떨리는지, 줄이 풀리는지가 여기 보인다
  function history() {
    const W = 420, H = 54, mid = H / 2;
    const root = svgRoot(W, H, 'strip-svg');
    const g = sv('g');
    root.appendChild(rect(0, 0, W, H, COLOR.panel2, { rx: 8 }));
    root.appendChild(g);
    g.appendChild(rect(0, mid - (TUNER.inTuneCents / 50) * mid, W, (TUNER.inTuneCents / 50) * mid * 2, 'rgba(90,164,105,.16)'));
    g.appendChild(line(0, mid, W, mid, COLOR.line, 1));
    const n = TUNER.historyLen;
    const step = W / n;
    st.hist.forEach((c, i) => {
      if (c == null) return;
      const y = mid - Math.max(-50, Math.min(50, c)) / 50 * (mid - 4);
      const x = W - (st.hist.length - i) * step;
      g.appendChild(circle(x, y, 1.6, Math.abs(c) <= TUNER.inTuneCents ? COLOR.ok : COLOR.accent));
    });
    g.appendChild(text(W - 24, 10, '+50', { 'font-size': 8, fill: COLOR.dim }));
    g.appendChild(text(W - 24, H - 8, '−50', { 'font-size': 8, fill: COLOR.dim }));
    return root;
  }

  // 들어오는 소리 세기와 또렷함
  function levelBar(level, clarity) {
    const W = 420, H = 20;
    const root = svgRoot(W, H, 'meter-svg');
    root.appendChild(rect(0, 0, W, H, COLOR.panel2, { rx: 6 }));
    const lw = Math.min(1, (level || 0) * 6) * (W / 2 - 12);
    const cw = Math.min(1, clarity || 0) * (W / 2 - 12);
    root.appendChild(rect(8, 6, lw, 8, COLOR.ok, { rx: 4 }));
    root.appendChild(rect(W / 2 + 4, 6, cw, 8, COLOR.warn, { rx: 4 }));
    root.appendChild(text(8, 10, '세기', { 'text-anchor': 'start', 'font-size': 8, fill: 'rgba(255,255,255,.35)' }));
    root.appendChild(text(W / 2 + 4, 10, '또렷함', { 'text-anchor': 'start', 'font-size': 8, fill: 'rgba(255,255,255,.35)' }));
    return root;
  }

  function paintStrings(host, midi) {
    clear(host);
    if (st.mode === 'chromatic') {
      host.appendChild(el('span.muted', '크로매틱 — 12반음 어디든 가장 가까운 음으로 맞춘다'));
      return;
    }
    const t = TUNINGS[st.mode];
    if (!t) return;
    t.strings.forEach((m, i) => {
      const b = el('button.string-btn', { type: 'button', onclick: () => playFreq(midiToFreq(m), null, 1.6, 0.9) },
        [el('b', t.names[i]), el('span', noteName(midiToNote(m, st.flat), true))]);
      if (midi != null && Math.abs(midi - m) <= 1) b.classList.add('near');
      host.appendChild(b);
    });
  }

  __M.mountTuner = mountTuner;
})();

// ── ui/metronome.js ─────────────────────────────
(function () {
  // 메트로놈 화면. 박마다 램프가 켜지고, 마디 수가 올라간다.

  const { el, clear, chipGroup } = __M;
  const { METRO } = __M;
  const { createMetronome, createTapTempo } = __M;

  const keep = { metro: null, tap: null };

  function mountMetronome(host) {
    clear(host);
    if (!keep.metro) keep.metro = createMetronome();
    if (!keep.tap) keep.tap = createTapTempo();
    const m = keep.metro;

    const bpmView = el('div.bpm', String(m.state.bpm));
    const barView = el('div.barcount', '마디 —');
    const lamps = el('div.lamps');

    const drawLamps = (active, silent) => {
      clear(lamps);
      for (let i = 0; i < m.state.beats; i++) {
        const d = el('span.lamp' + (i === 0 ? '.first' : ''));
        if (i === active) d.classList.add(silent ? 'silent' : 'on');
        lamps.appendChild(d);
      }
    };

    m.onBeat = (beat, sub, bar, silent) => {
      if (sub !== 0) return;
      drawLamps(beat, silent);
      barView.textContent = '마디 ' + (bar + 1) + (silent ? ' · 쉬는 마디 (속으로 세라)' : '');
    };
    m.onTempo = (bpm) => { bpmView.textContent = String(bpm); slider.value = String(bpm); };

    const setBpm = (v) => {
      const bpm = Math.max(METRO.bpmMin, Math.min(METRO.bpmMax, Math.round(v)));
      m.set('bpm', bpm);
      bpmView.textContent = String(bpm);
      slider.value = String(bpm);
    };

    const slider = el('input.slider', {
      type: 'range', min: METRO.bpmMin, max: METRO.bpmMax, value: m.state.bpm,
      oninput: (e) => setBpm(+e.target.value),
    });

    const startBtn = el('button.big', { type: 'button' }, m.state.running ? '멈춤 ■' : '시작 ▶');
    startBtn.addEventListener('click', () => {
      if (m.state.running) { m.stop(); startBtn.textContent = '시작 ▶'; drawLamps(-1); barView.textContent = '마디 —'; }
      else { m.start(); startBtn.textContent = '멈춤 ■'; }
    });

    host.appendChild(el('div.page-head', [
      el('h2', '메트로놈'),
      el('p.tagline', '오디오 시계에 미리 예약하는 방식이라 흔들리지 않는다.'),
    ]));

    host.appendChild(el('div.card.metro-card', [
      bpmView, barView, lamps,
      el('div.metro-row', [
        el('button.mini', { type: 'button', onclick: () => setBpm(m.state.bpm - 5) }, '−5'),
        el('button.mini', { type: 'button', onclick: () => setBpm(m.state.bpm - 1) }, '−1'),
        slider,
        el('button.mini', { type: 'button', onclick: () => setBpm(m.state.bpm + 1) }, '+1'),
        el('button.mini', { type: 'button', onclick: () => setBpm(m.state.bpm + 5) }, '+5'),
      ]),
      startBtn,
      el('div.metro-row', [
        el('button.mini', { type: 'button', onclick: () => { const v = keep.tap(); if (v) setBpm(v); } }, '탭 템포 — 두드려서 맞추기'),
      ]),
    ]));

    host.appendChild(el('div.card', [
      el('h3.section', '박'),
      row('한 마디', [2, 3, 4, 5, 6, 7].map((v) => ({ value: v, label: v + '박' })), m.state.beats,
        (v) => { m.set('beats', v); drawLamps(-1); }),
      row('쪼개기', [
        { value: 1, label: '４분' }, { value: 2, label: '８분' },
        { value: 3, label: '셋잇단' }, { value: 4, label: '16분' },
      ], m.state.sub, (v) => m.set('sub', v)),
      row('첫 박 강조', [{ value: true, label: '켬' }, { value: false, label: '끔' }], m.state.accent,
        (v) => m.set('accent', v)),
      row('소리', Object.keys(METRO.voices).map((k) => ({ value: k, label: METRO.voices[k].label })),
        m.state.voice, (v) => m.set('voice', v)),
    ]));

    host.appendChild(el('div.card', [
      el('h3.section', '연습 도구'),
      row('자동 증속', [{ value: false, label: '끔' }, { value: true, label: '켬' }], m.state.trainer,
        (v) => m.set('trainer', v)),
      el('p.tip', METRO.trainerBars + '마디마다 ' + METRO.trainerStep + 'BPM 씩 올린다. 못 따라가는 지점이 지금 실력의 끝이다.'),
      row('쉬는 마디', [
        { value: 0, label: '끔' }, { value: 2, label: '2마디마다' },
        { value: 4, label: '4마디마다' }, { value: 8, label: '8마디마다' },
      ], m.state.silentEvery, (v) => m.set('silentEvery', v)),
      el('p.tip', '마지막 한 마디를 소리 없이 지나간다. 속으로 박을 세다가 다시 소리가 들어올 때 어긋나면 아직 박이 몸에 안 든 것이다.'),
    ]));

    drawLamps(-1);
  }

  function row(label, items, value, onPick) {
    return el('div.count-row', [el('span.field-label', label), chipGroup(items, value, onPick)]);
  }

  __M.mountMetronome = mountMetronome;
})();

// ── ui/shell.js ─────────────────────────────
(function () {
  // 전체 껍데기. 위쪽 탭과 본문 자리를 만들고, 탭에 맞는 화면을 붙인다.

  const { APP, TABS, INSTRUMENTS } = __M;
  const { el, clear } = __M;
  const { mountFretInstrument } = __M;
  const { mountBass } = __M;
  const { mountKeys } = __M;
  const { mountTuner } = __M;
  const { mountMetronome } = __M;

  let current = null;

  function mountShell(root) {
    clear(root);
    const body = el('main.body');
    const tabs = el('nav.tabs');

    TABS.forEach((t) => {
      const b = el('button.tab', { type: 'button', 'data-id': t.id },
        [el('span.tab-icon', t.icon), el('span.tab-label', t.label)]);
      b.addEventListener('click', () => go(t.id));
      tabs.appendChild(b);
    });

    root.appendChild(el('header.top', [
      el('div.brand', [el('b', APP.name), el('span', APP.subtitle)]),
      tabs,
    ]));
    root.appendChild(body);
    root.appendChild(el('footer.foot', APP.name + ' · 서버 없이 이 파일 하나로 돈다'));

    function go(id) {
      current = id;
      try { localStorage.setItem(APP.storageKey, id); } catch (e) { /* 막혀 있어도 상관없다 */ }
      if (location.hash.slice(1) !== id) location.hash = id;
      tabs.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.id === id));
      window.scrollTo(0, 0);
      render(body, id);
    }

    window.addEventListener('hashchange', () => {
      const id = location.hash.slice(1);
      if (id && id !== current && TABS.some((t) => t.id === id)) go(id);
    });

    let start = location.hash.slice(1);
    if (!start || !TABS.some((t) => t.id === start)) {
      try { start = localStorage.getItem(APP.storageKey); } catch (e) { start = null; }
    }
    go(TABS.some((t) => t.id === start) ? start : 'guitar');
  }

  function render(body, id) {
    clear(body);
    const page = el('div.page');
    body.appendChild(page);
    const tab = TABS.find((t) => t.id === id);
    if (tab && tab.inst) {
      const kind = INSTRUMENTS[tab.inst].kind;
      if (kind === 'bass') mountBass(page);
      else if (kind === 'keys') mountKeys(page);
      else mountFretInstrument(page, tab.inst);
      return;
    }
    if (id === 'tuner') mountTuner(page);
    else if (id === 'metro') mountMetronome(page);
  }

  __M.mountShell = mountShell;
})();

// ── main.js ─────────────────────────────
(function () {
  // 진입점.

  const { mountShell } = __M;

  function boot() {
    const root = document.getElementById('app');
    if (!root) return;
    mountShell(root);
    const b = document.getElementById('boot');
    if (b) b.remove();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})();

</script>
</body>
